          <p class="summary">Totale: <b>${esc(Core.formatEuro(total))}</b></p>
        </section>
        <section class="card">
          <h3>Come leggere l’utile</h3>
          <p class="small-note muted">Utile competenza = fatturato del periodo − spese. Utile di cassa = incassi del periodo − spese. Le spese sono registrate per data di sostenimento.</p>
        </section>
      </div>
      <div class="table-wrap"><table class="table">
        <thead><tr><th>Data</th><th>Descrizione</th><th>Categoria</th><th></th><th class="num">Importo</th><th></th></tr></thead>
        <tbody>${rows.length ? rows.join('') : `<tr><td colspan="6">${UI.empty('Nessuna spesa con questi filtri.')}</td></tr>`}</tbody>
      </table></div>`;
  };

  App.changes['exp-year'] = (el) => {
    App.ui.expYear = el.value === '' ? '' : Number(el.value);
    App.refresh();
  };
  App.changes['exp-cat'] = (el) => {
    App.ui.expCat = el.value;
    App.refresh();
  };

  function openExpenseModal(expense) {
    const values = expense
      ? { date: expense.date, descrizione: expense.descrizione, categoria: expense.categoria, fornitore: expense.fornitore || '', amount: expense.amountCents, note: expense.note || '' }
      : { date: App.today(), categoria: 'Software e abbonamenti' };
    UI.modal({
      title: expense ? 'Modifica spesa' : 'Nuova spesa',
      size: 'wide',
      body: `
        <form data-form="expense" data-id="${esc(expense ? expense.id : '')}" novalidate>
          ${UI.fieldsHTML(EXPENSE_FIELDS, values)}
          <div class="form-actions"><button type="button" class="btn ghost" data-modal-close>Annulla</button><button type="submit" class="btn primary">Salva spesa</button></div>
        </form>`,
    });
  }

  App.actions['expense-new'] = () => openExpenseModal(null);
  App.actions['expense-edit'] = (el) => {
    const e = App.byId('expenses', el.dataset.id);
    if (e) openExpenseModal(e);
  };
  App.actions['expense-delete'] = async (el) => {
    const e = App.byId('expenses', el.dataset.id);
    if (!e) return;
    const ok = await UI.confirmDialog({ title: 'Eliminare la spesa?', message: `“${e.descrizione}” di ${Core.formatEuro(e.amountCents)} verrà eliminata, con la sua ricevuta.`, confirmText: 'Elimina', danger: true });
    if (!ok) return;
    await App.removeWithFiles('expenses', e.id);
    UI.toast('Spesa eliminata');
    App.refresh();
  };

  App.forms.expense = (form) =>
    UI.guard(form, async () => {
      const { values, errors } = UI.readFields(form, EXPENSE_FIELDS);
      const existing = form.dataset.id ? App.byId('expenses', form.dataset.id) : null;
      const rec = {
        ...(existing || {}),
        id: existing ? existing.id : undefined,
        date: values.date,
        descrizione: values.descrizione,
        categoria: values.categoria,
        fornitore: values.fornitore || '',
        amountCents: values.amount === null ? 0 : values.amount,
        note: values.note || '',
      };
      const all = [...errors, ...Core.validateExpense(rec)];
      if (values.receipt) all.push(...Core.validateFile(values.receipt));
      if (all.length) return UI.showErrors(form, all);
      const saved = await App.save('expenses', rec);
      if (values.receipt) {
        await App.addFile({ name: values.receipt.name, kind: 'ricevuta', date: rec.date, relatedId: saved.id, relatedType: 'expense', note: rec.descrizione }, values.receipt);
      }
      UI.closeModalOf(form);
      UI.toast('Spesa salvata');
      App.refresh();
    });

  App.invoiceState = (inv) => Core.invoiceState(inv, App.state.payments, App.today());
  App.invoiceOf = invoiceOf;
  App.paymentsOf = paymentsOf;
  App.openExpenseModal = openExpenseModal;
  App.fileYearChoices = yearChoices;
})(typeof window !== 'undefined' ? window : globalThis);

  <script>
/* js/views-altro.js */
/*
 * Andamento annuo, Task, Report settimanale, Fiscale, Esporta, Impostazioni.
 */
(function (root) {
  'use strict';

  const { Core, DB, UI, Fiscale, App } = root;
  const { esc, fmtDate, badge } = UI;
  const V = App.views;

  const yearNow = () => new Date().getFullYear();
  const eur = (c) => Core.formatEuro(c);

  // Grafico a barre SVG generico: series = [{values:[..], cls}], labels
  function barsSVG(labels, series, { ariaLabel, height = 240, fmt = (v) => v } = {}) {
    const W = 760;
    const H = height;
    const left = 48;
    const top = 14;
    const bottom = 30;
    const plotH = H - top - bottom;
    const n = labels.length;
    const max = Math.max(1, ...series.flatMap((s) => s.values));
    const slot = (W - left - 8) / n;
    const groupW = slot * 0.7;
    const bw = groupW / series.length;
    let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(ariaLabel)}">`;
    for (let i = 0; i <= 4; i++) {
      const y = top + plotH - (plotH * i) / 4;
      svg += `<line class="grid" x1="${left}" x2="${W - 8}" y1="${y}" y2="${y}"></line>`;
      svg += `<text class="axis" x="${left - 8}" y="${y + 4}" text-anchor="end">${esc(fmt((max * i) / 4))}</text>`;
    }
    labels.forEach((lab, i) => {
      const x0 = left + i * slot + (slot - groupW) / 2;
      series.forEach((s, k) => {
        const v = s.values[i] || 0;
        const h = (plotH * v) / max;
        svg += `<rect class="bar ${s.cls}" style="animation-delay:${(i * 40 + k * 80)}ms" x="${x0 + k * bw + 2}" y="${top + plotH - h}" width="${Math.max(2, bw - 4)}" height="${h}" rx="3"><title>${esc(lab)} · ${esc(s.name)}: ${esc(fmt(v))}</title></rect>`;
      });
      svg += `<text class="axis" x="${left + i * slot + slot / 2}" y="${H - 10}" text-anchor="middle">${esc(lab)}</text>`;
    });
    return `${svg}</svg>`;
  }

  // Linea (es. saldo cumulato) come SVG
  function lineSVG(labels, values, ariaLabel) {
    const W = 760;
    const H = 180;
    const top = 16;
    const bottom = 28;
    const left = 16;
    const max = Math.max(1, ...values);
    const step = (W - left * 2) / Math.max(1, labels.length - 1);
    const pts = values.map((v, i) => [left + i * step, top + (H - top - bottom) * (1 - v / max)]);
    const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
    const area = `${d} L${pts[pts.length - 1][0].toFixed(1)},${H - bottom} L${left},${H - bottom} Z`;
    return `<svg class="chart line" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(ariaLabel)}">
      <defs><linearGradient id="lg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".45"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
      <path class="area" d="${area}" fill="url(#lg)"></path><path class="stroke" d="${d}" pathLength="1"></path>
      ${pts.map((p, i) => `<circle class="dot" cx="${p[0]}" cy="${p[1]}" r="3"><title>${esc(labels[i])}: ${esc(eur(Math.round(values[i])))}</title></circle>`).join('')}
      ${labels.map((l, i) => `<text class="axis" x="${left + i * step}" y="${H - 8}" text-anchor="middle">${esc(l)}</text>`).join('')}
    </svg>`;
  }

  App.barsSVG = barsSVG;
  App.lineSVG = lineSVG;

  function fileYear() {
    return App.ui.altroYear || yearNow();
  }

  /* ============================== ANDAMENTO ============================== */
  V.andamento = () => {
    const year = fileYear();
    const trendAll = Fiscale.yearTrend(App.data(), year);
    const labels = trendAll.map((t) => t.short);
    const closedTotal = trendAll.reduce((s, t) => s + t.lavoriChiusi, 0);
    const newTotal = trendAll.reduce((s, t) => s + t.nuoviClienti, 0);
    const fatTot = trendAll.reduce((s, t) => s + t.fatturato, 0);
    const incTot = trendAll.reduce((s, t) => s + t.incassato, 0);
    let cum = 0;
    const cumulative = trendAll.map((t) => (cum += t.incassato));
    const closedList = trendAll.flatMap((t) => t.lavoriChiusiElenco.map((p) => ({ p, m: t.label })));
    const clientName = (id) => {
      const c = App.clientOf(id);
      return c ? App.clientName(c) : '—';
    };
    const rows = closedList
      .sort((a, b) => (a.p.dataConsegna < b.p.dataConsegna ? 1 : -1))
      .map(({ p }) => `<tr>
        <td><b>${esc(p.titolo)}</b><div class="muted small-note">${esc(p.servizio || '')}</div></td>
        <td>${esc(clientName(p.clientId))}</td>
        <td>${esc(fmtDate(p.dataInizio))}</td>
        <td>${esc(fmtDate(p.dataConsegna))}</td>
        <td class="num">${p.dataInizio && p.dataConsegna ? `${Core.daysBetween(p.dataInizio, p.dataConsegna)} gg` : '—'}</td>
        <td>${badge(p.stato, Core.STATI_PROGETTO[p.stato])}</td></tr>`);
    const openProjects = App.state.projects.filter((p) => p.stato === 'in_corso' || p.stato === 'preventivo');
    return `
      <header class="page-head">
        <div><p class="eyebrow">Andamento</p><h1>Andamento ${year}</h1><p class="muted">Gennaio–dicembre. Lavori chiusi con data di apertura e chiusura, nuovi clienti per mese.</p></div>
        <div class="head-actions">${yearPicker(year, 'alt-year')}</div>
      </header>
      <section class="kpi-grid">
        <article class="kpi accent"><span class="kpi-label">Fatturato anno</span><strong class="kpi-value" data-count-eur="${fatTot}">${esc(eur(fatTot))}</strong></article>
        <article class="kpi"><span class="kpi-label">Incassato anno</span><strong class="kpi-value">${esc(eur(incTot))}</strong></article>
        <article class="kpi"><span class="kpi-label">Lavori chiusi</span><strong class="kpi-value" data-count="${closedTotal}">${closedTotal}</strong><span class="delta muted">${openProjects.length} aperti ora</span></article>
        <article class="kpi"><span class="kpi-label">Nuovi clienti</span><strong class="kpi-value" data-count="${newTotal}">${newTotal}</strong></article>
      </section>
      <section class="card">
        <h3>Fatturato e incassi per mese</h3>
        ${barsSVG(labels, [
          { name: 'Fatturato', cls: 'fat', values: trendAll.map((t) => t.fatturato) },
          { name: 'Incassato', cls: 'inc', values: trendAll.map((t) => t.incassato) },
        ], { ariaLabel: `Fatturato e incassi ${year}`, height: 280, fmt: (v) => (v / 100 >= 1000 ? `${Math.round(v / 100000)}k` : String(Math.round(v / 100))) })}
        <div class="legend"><span><i class="sw fat"></i>Fatturato</span><span><i class="sw inc"></i>Incassato</span></div>
      </section>
      <div class="two-col">
        <section class="card">
          <h3>Lavori chiusi per mese</h3>
          ${barsSVG(labels, [{ name: 'Lavori chiusi', cls: 'closed', values: trendAll.map((t) => t.lavoriChiusi) }], { ariaLabel: 'Lavori chiusi per mese', height: 200 })}
        </section>
        <section class="card">
          <h3>Nuovi clienti per mese</h3>
          ${barsSVG(labels, [{ name: 'Nuovi clienti', cls: 'newc', values: trendAll.map((t) => t.nuoviClienti) }], { ariaLabel: 'Nuovi clienti per mese', height: 200 })}
        </section>
      </div>
      <section class="card">
        <h3>Incasso cumulato</h3>
        ${lineSVG(labels, cumulative, 'Incasso cumulato nell’anno')}
      </section>
      <section class="card">
        <div class="section-head"><h3>Lavori chiusi nell’anno (${closedList.length})</h3></div>
        ${closedList.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Lavoro</th><th>Cliente</th><th>Aperto il</th><th>Chiuso il</th><th class="num">Durata</th><th>Stato</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>` : UI.empty('Nessun lavoro chiuso in questo anno. Chiudi i progetti dalla scheda cliente.')}
      </section>`;
  };

  function yearPicker(year, changeKey) {
    const ys = App.fileYearChoices ? App.fileYearChoices() : [yearNow()];
    return `<label class="field"><span class="lbl">Anno</span><select name="year" data-change="${changeKey}">${ys.map((y) => `<option value="${y}"${y === year ? ' selected' : ''}>${y}</option>`).join('')}</select></label>`;
  }

  App.changes['alt-year'] = (el) => {
    App.ui.altroYear = Number(el.value);
    App.refresh();
  };

  /* ============================== TASK ============================== */
  const TASK_FIELDS = [
    { name: 'titolo', label: 'Cosa devi fare', required: true, full: true, placeholder: 'es. Inviare preventivo a Acme' },
    { name: 'scadenza', label: 'Scadenza', type: 'date', hint: 'Facoltativa' },
    { name: 'priorita', label: 'Priorità', type: 'select', options: Object.entries(Fiscale.PRIORITA), empty: false, required: true },
    { name: 'clientId', label: 'Cliente (facoltativo)', type: 'select', options: [], empty: '— nessuno —' },
    { name: 'note', label: 'Note', type: 'textarea', full: true },
  ];

  function taskFields() {
    return TASK_FIELDS.map((f) => (f.name === 'clientId' ? { ...f, options: App.clientOptions('') } : f));
  }

  function taskItem(t, today) {
    const b = Fiscale.taskBucket(t, today);
    const c = t.clientId ? App.clientOf(t.clientId) : null;

  V.tasks = () => {

      ['prossimo', 'Prossimi', ''],
      ['senza', 'Senza scadenza', ''],
      ['fatto', 'Completati', 'muted'],

    const open = all.filter((t) => t.stato !== 'fatto').length;
    const body = groups.map(([k, label, tone]) => {
      const list = all
        .filter((t) => Fiscale.taskBucket(t, today) === k)
        .sort((a, b) => (a.scadenza || '9999') < (b.scadenza || '9999') ? -1 : 1);
      if (!list.length) return '';
      return `<section class="card task-group ${tone}"><h3>${esc(label)} <span class="count">${list.length}</span></h3><ul class="task-list">${list.map((t) => taskItem(t, today)).join('')}</ul></section>`;

  function fiscalData(year) {
    const cfg = fiscalCfg();
    const ricavi = Fiscale.ricaviIncassati(App.data(), year);
    const t = Fiscale.taxEstimate({ anno: year, ricaviCents: ricavi, cfg });
    const today = App.today();
    const mesi = Number(today.slice(0, 4)) === year ? Number(today.slice(5, 7)) : 12;
    const proiezione = Fiscale.projectYear(ricavi, mesi);
    const pt = Fiscale.taxEstimate({ anno: year, ricaviCents: proiezione, cfg });
    const fatturato = App.state.invoices
      .filter((i) => i.stato === 'emessa' && Number(i.issueDate.slice(0, 4)) === year)
      .reduce((s, i) => s + Core.invoiceTotals(i).imponibile, 0);
    return { cfg, t, pt, ricavi, fatturato, mesi, proiezione };
  }

  <script>
/* js/risparmi.js */
/*
 * Risparmi (conto personale) e investimenti ETF: logica pura, testabile con node.
 *
 * Regole:
 *  - Tutti gli importi in centesimi interi; le quantità di ETF possono essere frazionarie (fino a 6 decimali).
 *  - Costo medio ponderato: un acquisto aumenta il costo, una vendita toglie costo medio × quantità venduta.
 *  - Il valore di mercato usa il prezzo che inserisci tu: non ci sono quotazioni online.
 */
(function (root, factory) {
  const C = typeof module === 'object' && module.exports ? require('./core.js') : root.Core;
  const api = factory(C);
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.Risparmi = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function (Core) {
  'use strict';

  const TIPI_MOVIMENTO = { versamento: 'Versamento', prelievo: 'Prelievo' };
  const TIPI_OPERAZIONE = { acquisto: 'Acquisto', vendita: 'Vendita' };
  const round6 = (x) => Math.round(x * 1e6) / 1e6;

  /* ------------------------------ Conto personale ------------------------------ */
  // movements: [{ date, tipo: 'versamento'|'prelievo', amountCents }]
  function savingsBalance(movements, saldoIniziale = 0, upToIso = null) {
    return movements.reduce((s, m) => {
      if (upToIso && m.date > upToIso) return s;
      return s + (m.tipo === 'prelievo' ? -m.amountCents : m.amountCents);
    }, Number(saldoIniziale) || 0);
  }

  // Flusso netto (versamenti − prelievi) per mese, per una lista di mesi YYYY-MM
  function savingsByMonth(movements, months) {
    const out = {};
    for (const m of months) out[m] = { versamenti: 0, prelievi: 0, netto: 0 };
    for (const mv of movements) {
      const key = Core.monthKey(mv.date);
      if (!out[key]) continue;
      if (mv.tipo === 'prelievo') out[key].prelievi += mv.amountCents;
      else out[key].versamenti += mv.amountCents;
    }
    for (const m of months) out[m].netto = out[m].versamenti - out[m].prelievi;
    return out;
  }

  function goalProgress(balanceCents, targetCents) {
    if (!targetCents || targetCents <= 0) return { pct: 0, mancano: 0, raggiunto: false };
    const pct = Math.max(0, Math.min(100, Math.round((balanceCents / targetCents) * 1000) / 10));
    const mancano = Math.max(0, targetCents - balanceCents);
    return { pct, mancano, raggiunto: balanceCents >= targetCents };
  }

  /* ------------------------------ ETF ------------------------------ */
  // ops: [{ date, tipo, quantita, prezzoCents, commissioniCents }] di UN ETF
  // Restituisce quantità, costo residuo, costo medio, utile realizzato dalle vendite.
  function etfPosition(ops) {
    const sorted = [...ops].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    let quantita = 0;
    let costo = 0; // centesimi
    let realizzato = 0;
    let investitoTotale = 0; // somma di tutti gli acquisti (costo lordo, non ridotto dalle vendite)
    for (const o of sorted) {
      const q = Number(o.quantita) || 0;
      const comm = Number(o.commissioniCents) || 0;
      if (o.tipo === 'acquisto') {
        const spesa = Math.round(q * o.prezzoCents) + comm;
        quantita = round6(quantita + q);
        costo += spesa;
        investitoTotale += spesa;
      } else {
        const costoMedio = quantita > 0 ? costo / quantita : 0;
        const ricavo = Math.round(q * o.prezzoCents) - comm;
        const costoVenduto = Math.round(costoMedio * q);
        realizzato += ricavo - costoVenduto;
        costo -= costoVenduto;
        quantita = round6(quantita - q);
        if (quantita <= 0) {
          quantita = 0;
          costo = 0;
        }
      }
    }
    return {
      quantita,
      costoCents: Math.round(costo),
      costoMedioCents: quantita > 0 ? Math.round(costo / quantita) : 0,
      realizzatoCents: Math.round(realizzato),
      investitoTotaleCents: Math.round(investitoTotale),
    };
  }

  // etfs: [{ id, nome, prezzoAttualeCents }], investments: [{ etfId, date, tipo, quantita, prezzoCents, commissioniCents }]
  function portfolio(etfs, investments) {
    const rows = etfs.map((e) => {
      const ops = investments.filter((o) => o.etfId === e.id);
      const pos = etfPosition(ops);
      const prezzo = Number(e.prezzoAttualeCents) || 0;
      const valoreCents = Math.round(pos.quantita * prezzo);
      const plCents = pos.quantita > 0 ? valoreCents - pos.costoCents : 0;
      return {
        etf: e,
        ...pos,
        prezzoCents: prezzo,
        valoreCents,
        plusCents: plCents,
        plusPct: pos.costoCents > 0 && pos.quantita > 0 ? Math.round((plCents / pos.costoCents) * 1000) / 10 : 0,
        operazioni: ops.length,
      };
    });
    const totali = rows.reduce(
      (t, r) => ({
        valore: t.valore + r.valoreCents,
        costo: t.costo + (r.quantita > 0 ? r.costoCents : 0),
        realizzato: t.realizzato + r.realizzatoCents,
        investitoTotale: t.investitoTotale + r.investitoTotaleCents,
      }),
      { valore: 0, costo: 0, realizzato: 0, investitoTotale: 0 }
    );
    totali.plus = totali.valore - totali.costo;
    totali.plusPct = totali.costo > 0 ? Math.round((totali.plus / totali.costo) * 1000) / 10 : 0;
    // quota di ciascun ETF sul valore totale
    rows.forEach((r) => {
      r.quotaPct = totali.valore > 0 ? Math.round((r.valoreCents / totali.valore) * 1000) / 10 : 0;
    });
    return { rows, totali };
  }

  /* ------------------------------ Validazione ------------------------------ */
  function validateMovement(m) {
    const err = [];
    if (!Core.isValidISODate(m.date)) err.push('Data non valida.');
    if (!Object.prototype.hasOwnProperty.call(TIPI_MOVIMENTO, m.tipo)) err.push('Tipo movimento non valido.');
    if (!Number.isInteger(m.amountCents) || m.amountCents <= 0) err.push('Importo deve essere maggiore di zero.');
    return err;
  }

  function validateEtf(e) {
    const err = [];
    if (!e.nome || !String(e.nome).trim()) err.push('Nome dell’ETF obbligatorio (es. VWCE).');
    if (e.isin && !/^[A-Z]{2}[A-Z0-9]{9}\d$/.test(String(e.isin).toUpperCase())) err.push('ISIN non valido (12 caratteri, es. IE00BK5BQT80).');
    if (e.prezzoAttualeCents !== undefined && e.prezzoAttualeCents !== null && (!Number.isInteger(e.prezzoAttualeCents) || e.prezzoAttualeCents < 0)) err.push('Prezzo attuale non valido.');
    return err;
  }

  // Controlla anche che la vendita non superi la quantità posseduta a quella data
  function validateInvestment(op, all = [], excludeId = null) {
    const err = [];
    if (!Core.isValidISODate(op.date)) err.push('Data non valida.');
    if (!Object.prototype.hasOwnProperty.call(TIPI_OPERAZIONE, op.tipo)) err.push('Tipo operazione non valido.');
    if (!(Number(op.quantita) > 0) || !Number.isFinite(Number(op.quantita))) err.push('Quantità deve essere maggiore di zero.');
    if (!Number.isInteger(op.prezzoCents) || op.prezzoCents <= 0) err.push('Prezzo unitario deve essere maggiore di zero.');
    if (!Number.isInteger(op.commissioniCents || 0) || (op.commissioniCents || 0) < 0) err.push('Commissioni non valide.');
    if (op.tipo === 'vendita' && op.etfId && Core.isValidISODate(op.date)) {
      const prima = all.filter((o) => o.etfId === op.etfId && o.id !== excludeId && o.date <= op.date);
      const posseduta = etfPosition(prima).quantita;
      if (Number(op.quantita) > posseduta + 1e-9) err.push(`Non puoi vendere più di quanto possiedi a quella data (${posseduta}).`);
    }
    return err;
  }

  /* ------------------------------ Portafoglio nel tempo ------------------------------ */
  // Costo delle quote in mano alla fine di ogni mese (somma dei costi residui di tutti gli ETF)
  function holdingsCostSeries(investments, etfIds, months) {
    return months.map((m) => {
      const end = Core.lastDayOf(m);
      let costo = 0;
      for (const id of etfIds) {
        const ops = investments.filter((o) => o.etfId === id && o.date <= end);
        costo += etfPosition(ops).costoCents;
      }
      return costo;
    });
  }

  // Quanto hai investito (acquisti netti di commissioni) per mese
  function monthlyContributions(investments, months) {
    const out = {};
    for (const m of months) out[m] = 0;
    for (const o of investments) {
      const k = Core.monthKey(o.date);
      if (out[k] === undefined || o.tipo !== 'acquisto') continue;
      out[k] += Math.round(Number(o.quantita) * o.prezzoCents) + (o.commissioniCents || 0);
    }
    return out;
  }

  // Simulazione a interesse composto mensile. NON è una previsione: il rendimento lo scegli tu.
  // Ritorna un punto per anno: { anno, valore, versato, interessi }
  function projectGrowth({ startCents = 0, monthlyCents = 0, annualRatePct = 0, years = 10 }) {
    const i = annualRatePct / 100 / 12;
    const out = [];
    for (let y = 0; y <= years; y++) {
      const n = y * 12;
      const growth = i === 0 ? 1 : Math.pow(1 + i, n);
      const fvStart = startCents * growth;
      const fvMonthly = i === 0 ? monthlyCents * n : monthlyCents * ((growth - 1) / i);
      const valore = Math.round(fvStart + fvMonthly);
      const versato = Math.round(startCents + monthlyCents * n);
      out.push({ anno: y, valore, versato, interessi: valore - versato });
    }
    return out;
  }

  return {
    TIPI_MOVIMENTO, TIPI_OPERAZIONE, holdingsCostSeries, monthlyContributions, projectGrowth,
    savingsBalance, savingsByMonth, goalProgress,
    etfPosition, portfolio,
    validateMovement, validateEtf, validateInvestment,
  };
});

</script>

(function (root) {
  'use strict';

  const { Core, UI, App, Risparmi } = root;

  const eur = (c) => Core.formatEuro(c);

  /* ============================== CONTO PERSONALE ============================== */
  const contoOf = () => ({ saldoIniziale: 0, obiettivoNome: '', obiettivoCents: 0, ...((App.settings().conto) || {}) });

  const MOV_FIELDS = [
    { name: 'date', label: 'Data', type: 'date', required: true },
    { name: 'tipo', label: 'Tipo', type: 'select', options: Object.entries(Risparmi.TIPI_MOVIMENTO), empty: false, required: true },

    { name: 'saldoIniziale', label: 'Saldo di partenza (€)', type: 'money', hint: 'Il saldo che avevi prima di iniziare a registrare i movimenti' },
    { name: 'obiettivoNome', label: 'Obiettivo (nome)', placeholder: 'es. Fondo emergenza, casa, viaggio' },
    { name: 'obiettivoCents', label: 'Obiettivo (importo €)', type: 'money' },
  ];

  function movementsSorted() {
    return [...App.state.savings].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
  }

  V.risparmi = () => {
    const conto = contoOf();
    const movs = App.state.savings;
    const today = App.today();
    const saldo = Risparmi.savingsBalance(movs, conto.saldoIniziale, null);
    const tot = (tipo) => movs.filter((m) => m.tipo === tipo).reduce((s, m) => s + m.amountCents, 0);
    const versamenti = tot('versamento');
    const prelievi = tot('prelievo');
    const goal = Risparmi.goalProgress(saldo, conto.obiettivoCents);

    // ultimi 12 mesi che finiscono a oggi
    const cur = today.slice(0, 7);
    const months = Array.from({ length: 12 }, (_, i) => Core.shiftMonth(cur, i - 11));
    const byM = Risparmi.savingsByMonth(movs, months);
    // saldo a fine di ogni mese: partenza + tutti i movimenti fino a quella data
    const balanceSeries = months.map((m) => Risparmi.savingsBalance(movs, conto.saldoIniziale, Core.lastDayOf(m)));
    const labels = months.map((m) => Core.monthShort(m));

    const rows = movementsSorted().map((m) => `<tr>
      <td>${esc(fmtDate(m.date))}</td>
      <td>${tagBadge(m.tipo === 'prelievo' ? 'warn' : 'ok', Risparmi.TIPI_MOVIMENTO[m.tipo])}</td>
      <td>${esc(m.nota || '—')}</td>
      <td class="num"><b class="${m.tipo === 'prelievo' ? 'neg' : ''}">${m.tipo === 'prelievo' ? '−' : '+'}${esc(eur(m.amountCents))}</b></td>
      <td class="num row-actions"><button type="button" class="btn small ghost danger" data-action="mov-delete" data-id="${esc(m.id)}">Elimina</button></td>
    </tr>`);

    return `
      <header class="page-head">
        <div><p class="eyebrow">Conto principale · personale</p><h1>Risparmi</h1>
          <p class="muted">Il saldo del tuo conto personale e i tuoi obiettivi. Non è collegato alla contabilità dell’attività.</p></div>
        <div class="head-actions">
          <button type="button" class="btn" data-action="conto-edit">Impostazioni conto</button>
          <button type="button" class="btn primary" data-action="mov-new">+ Movimento</button>
        </div>
      </header>
      <section class="kpi-grid">
        <article class="kpi accent"><span class="kpi-label">Saldo attuale</span><strong class="kpi-value">${esc(eur(saldo))}</strong><span class="delta muted">partenza ${esc(eur(conto.saldoIniziale))}</span></article>
        <article class="kpi"><span class="kpi-label">Versamenti totali</span><strong class="kpi-value">${esc(eur(versamenti))}</strong></article>
        <article class="kpi"><span class="kpi-label">Prelievi totali</span><strong class="kpi-value">${esc(eur(prelievi))}</strong></article>
        <article class="kpi ${goal.raggiunto ? 'accent' : ''}"><span class="kpi-label">${conto.obiettivoCents ? esc(conto.obiettivoNome || 'Obiettivo') : 'Obiettivo'}</span>
          <strong class="kpi-value">${conto.obiettivoCents ? `${goal.pct}%` : '—'}</strong>
          ${conto.obiettivoCents ? `<div class="meter"><i style="width:${goal.pct}%"></i></div><span class="delta muted">${goal.raggiunto ? 'obiettivo raggiunto' : `mancano ${esc(eur(goal.mancano))} su ${esc(eur(conto.obiettivoCents))}`}</span>` : '<span class="delta muted">imposta un obiettivo in “Impostazioni conto”</span>'}
        </article>
      </section>
      <div class="two-col">
        <section class="card">
          <h3>Saldo a fine mese · ultimi 12 mesi</h3>
          ${App.lineSVG(labels, balanceSeries.map((v) => Math.max(0, v)), 'Saldo del conto a fine mese')}
        </section>
        <section class="card">
          <h3>Versamenti e prelievi · ultimi 12 mesi</h3>
          ${App.barsSVG(labels, [
            { name: 'Versamenti', cls: 'inc', values: months.map((m) => byM[m].versamenti) },
            { name: 'Prelievi', cls: 'fat', values: months.map((m) => byM[m].prelievi) },
          ], { ariaLabel: 'Versamenti e prelievi per mese', height: 220, fmt: (v) => (v / 100 >= 1000 ? `${Math.round(v / 100000)}k` : String(Math.round(v / 100))) })}
          <div class="legend"><span><i class="sw inc"></i>Versamenti</span><span><i class="sw fat"></i>Prelievi</span></div>
        </section>
      </div>
      <section class="card">
        <div class="section-head"><h3>Movimenti (${movs.length})</h3></div>
        ${movs.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Data</th><th>Tipo</th><th>Nota</th><th class="num">Importo</th><th></th></tr></thead><tbody>${rows.join('')}</tbody></table></div>` : UI.empty('Nessun movimento. Aggiungi un versamento per iniziare.')}
      </section>`;
  };

  App.actions['mov-new'] = () => {
    UI.modal({
      title: 'Nuovo movimento',
      body: `<form data-form="movimento" novalidate>
        ${UI.fieldsHTML(MOV_FIELDS, { date: App.today(), tipo: 'versamento' })}
        <div class="form-actions"><button type="button" class="btn ghost" data-modal-close>Annulla</button><button type="submit" class="btn primary">Salva</button></div>
      </form>`,
    });
  };

  App.forms.movimento = (form) =>
    UI.guard(form, async () => {
      const { values, errors } = UI.readFields(form, MOV_FIELDS);
      const rec = { date: values.date, tipo: values.tipo, amountCents: values.amount === null ? 0 : values.amount, nota: values.nota || '' };
      const all = [...errors, ...Risparmi.validateMovement(rec)];
      if (all.length) return UI.showErrors(form, all);
      await App.save('savings', rec);
      UI.closeModalOf(form);
      UI.toast('Movimento registrato');
      App.refresh();
    });

  App.actions['mov-delete'] = async (el) => {
    const m = App.byId('savings', el.dataset.id);
    if (!m) return;
    const ok = await UI.confirmDialog({ title: 'Eliminare il movimento?', message: `${Risparmi.TIPI_MOVIMENTO[m.tipo]} di ${eur(m.amountCents)} del ${fmtDate(m.date)}.`, confirmText: 'Elimina', danger: true });
    if (!ok) return;
    await App.remove('savings', m.id);
    UI.toast('Movimento eliminato');
    App.refresh();
  };

  App.actions['conto-edit'] = () => {
    const c = contoOf();
    UI.modal({
      title: 'Impostazioni conto',
      body: `<form data-form="conto" novalidate>
        ${UI.fieldsHTML(CONTO_FIELDS, { saldoIniziale: c.saldoIniziale, obiettivoNome: c.obiettivoNome, obiettivoCents: c.obiettivoCents })}
        <div class="form-actions"><button type="button" class="btn ghost" data-modal-close>Annulla</button><button type="submit" class="btn primary">Salva</button></div>
      </form>`,
    });
  };

  App.forms.conto = (form) =>
    UI.guard(form, async () => {
      const { values, errors } = UI.readFields(form, CONTO_FIELDS);
      if (values.saldoIniziale === null) values.saldoIniziale = 0;
      if (values.obiettivoCents === null) values.obiettivoCents = 0;
      if (values.obiettivoCents < 0) errors.push('L’obiettivo non può essere negativo.');
      if (errors.length) return UI.showErrors(form, errors);
      await App.saveSettings({ conto: { saldoIniziale: values.saldoIniziale, obiettivoNome: values.obiettivoNome || '', obiettivoCents: values.obiettivoCents } });
      UI.closeModalOf(form);
      UI.toast('Conto aggiornato');
      App.refresh();
    });

  /* ============================== ETF ============================== */
  const ETF_FIELDS = [
    { name: 'nome', label: 'Nome ETF', required: true, placeholder: 'es. Vanguard FTSE All-World' },
    { name: 'ticker', label: 'Ticker', placeholder: 'es. VWCE' },
    { name: 'isin', label: 'ISIN', placeholder: 'es. IE00BK5BQT80', hint: '12 caratteri, facoltativo' },
    { name: 'prezzo', label: 'Prezzo attuale per quota (€)', type: 'money', hint: 'Lo aggiorni tu dal broker: nessuna quotazione automatica' },
    { name: 'note', label: 'Note', type: 'textarea', full: true },
  ];

  const PRICE_FIELDS = [
    { name: 'prezzo', label: 'Prezzo attuale per quota (€)', type: 'money', required: true },
    { name: 'dataPrezzo', label: 'Data del prezzo', type: 'date', required: true },
  ];

  function etfChoices(selected) {
    return App.state.etfs.map((e) => [e.id, e.nome + (e.ticker ? ` (${e.ticker})` : '')]);
  }

  const OP_FIELDS = [
    { name: 'etfId', label: 'ETF', type: 'select', options: [], required: true },
    { name: 'tipo', label: 'Operazione', type: 'select', options: Object.entries(Risparmi.TIPI_OPERAZIONE), empty: false, required: true },
    { name: 'date', label: 'Data', type: 'date', required: true },
    { name: 'quantita', label: 'Quote', type: 'number', step: 'any', required: true, hint: 'Anche frazionarie: es. 0,4325' },
    { name: 'prezzo', label: 'Prezzo per quota (€)', type: 'money', required: true },
    { name: 'commissioni', label: 'Commissioni (€)', type: 'money', hint: 'Facoltative' },
    { name: 'note', label: 'Note', full: true },
  ];

  V.etf = () => {
    const pf = Risparmi.portfolio(App.state.etfs, App.state.investments);
    const t = pf.totali;
    const rows = pf.rows.map((r) => `<tr>
      <td><b>${esc(r.etf.nome)}</b><div class="muted small-note">${esc([r.etf.ticker, r.etf.isin].filter(Boolean).join(' · ') || '—')}</div></td>
      <td class="num">${r.quantita ? esc(String(r.quantita).replace('.', ',')) : '0'}</td>
      <td class="num">${r.quantita ? esc(eur(r.costoMedioCents)) : '—'}</td>
      <td class="num">${r.prezzoCents ? esc(eur(r.prezzoCents)) : '<span class="muted">non inserito</span>'}
        <div><button type="button" class="link-btn" data-action="etf-price" data-id="${esc(r.etf.id)}">aggiorna prezzo</button></div></td>
      <td class="num"><b>${esc(eur(r.valoreCents))}</b></td>
      <td class="num"><span class="${toneOf(r.plusCents)}">${esc(eur(r.plusCents))}</span><div class="small-note ${toneOf(r.plusCents)}">${esc(pctTxt(r.plusPct))}</div></td>
      <td class="num">${esc(String(r.quotaPct).replace('.', ','))}%</td>
      <td class="num row-actions"><button type="button" class="btn small ghost" data-action="etf-edit" data-id="${esc(r.etf.id)}">Modifica</button></td>
    </tr>`);
    const ops = [...App.state.investments].sort((a, b) => (a.date < b.date ? 1 : -1));
    const etfName = (id) => {
      const e = App.byId('etfs', id);
      return e ? e.nome : '—';
    };
    const opRows = ops.map((o) => {
      const tot = Math.round(Number(o.quantita) * o.prezzoCents) + (o.commissioniCents || 0) * (o.tipo === 'acquisto' ? 1 : -1);
      return `<tr>
        <td>${esc(fmtDate(o.date))}</td>
        <td>${esc(etfName(o.etfId))}</td>
        <td>${tagBadge(o.tipo === 'vendita' ? 'warn' : 'ok', Risparmi.TIPI_OPERAZIONE[o.tipo])}</td>
        <td class="num">${esc(String(o.quantita).replace('.', ','))}</td>
        <td class="num">${esc(eur(o.prezzoCents))}</td>
        <td class="num">${esc(eur(o.commissioniCents || 0))}</td>
        <td class="num"><b>${esc(eur(Math.abs(tot)))}</b></td>
        <td class="num row-actions"><button type="button" class="btn small ghost danger" data-action="op-delete" data-id="${esc(o.id)}">Elimina</button></td>
      </tr>`;
    });
    const alloc = pf.rows.filter((r) => r.valoreCents > 0).map((r) => `<li>
        <div class="bars-row"><span>${esc(r.etf.nome)}</span><b>${esc(String(r.quotaPct).replace('.', ','))}%</b></div>
        <div class="meter"><i style="width:${r.quotaPct}%"></i></div></li>`).join('');
    return `
      <header class="page-head">
        <div><p class="eyebrow">Investimenti</p><h1>ETF</h1>
          <p class="muted">Costo medio, valore e plus/minusvalenze. Il valore usa i prezzi che inserisci tu.</p></div>
        <div class="head-actions">
          <a class="btn" href="#/investimenti">Vista portafoglio ✦</a>
          <button type="button" class="btn" data-action="etf-new">+ ETF</button>
          <button type="button" class="btn primary" data-action="op-new">+ Operazione</button>
        </div>
      </header>
      <section class="kpi-grid">
        <article class="kpi accent"><span class="kpi-label">Valore portafoglio</span><strong class="kpi-value">${esc(eur(t.valore))}</strong></article>
        <article class="kpi"><span class="kpi-label">Costo delle quote in mano</span><strong class="kpi-value">${esc(eur(t.costo))}</strong><span class="delta muted">investito in totale ${esc(eur(t.investitoTotale))}</span></article>
        <article class="kpi ${toneOf(t.plus)}"><span class="kpi-label">Plus / minusvalenza</span><strong class="kpi-value">${esc(eur(t.plus))}</strong><span class="delta ${toneOf(t.plus)}">${esc(pctTxt(t.plusPct))}</span></article>
        <article class="kpi ${toneOf(t.realizzato)}"><span class="kpi-label">Realizzato dalle vendite</span><strong class="kpi-value">${esc(eur(t.realizzato))}</strong></article>
      </section>
      <div class="two-col">
        <section class="card"><h3>Allocazione</h3>${alloc ? `<ul class="bars-list">${alloc}</ul>` : '<p class="muted">Aggiungi un’operazione per vedere la ripartizione.</p>'}</section>
        <section class="card"><h3>Come leggere i numeri</h3>
          <ul class="plain-list small-note">
            <li><b>Costo medio</b>: prezzo medio di carico, commissioni incluse.</li>
            <li><b>Plus/minusvalenza</b>: valore attuale − costo delle quote in mano (non ancora incassato).</li>
            <li><b>Realizzato</b>: utile o perdita già incassati con le vendite.</li>
            <li>Questo gestionale non è un consulente finanziario: sono solo conti sui dati che inserisci.</li>
          </ul></section>
      </div>
      <section class="card">
        <div class="section-head"><h3>Posizioni</h3></div>
        ${App.state.etfs.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>ETF</th><th class="num">Quote</th><th class="num">Costo medio</th><th class="num">Prezzo attuale</th><th class="num">Valore</th><th class="num">P/L</th><th class="num">Quota</th><th></th></tr></thead><tbody>${rows.join('')}</tbody></table></div>` : UI.empty('Nessun ETF. Aggiungine uno con “+ ETF”.')}
      </section>
      <section class="card">
        <div class="section-head"><h3>Operazioni (${App.state.investments.length})</h3></div>
        ${opRows.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Data</th><th>ETF</th><th>Tipo</th><th class="num">Quote</th><th class="num">Prezzo</th><th class="num">Commissioni</th><th class="num">Totale</th><th></th></tr></thead><tbody>${opRows.join('')}</tbody></table></div>` : UI.empty('Nessuna operazione. Registra il primo acquisto.')}
      </section>`;
  };

  // Etichetta colorata per tipo di movimento/operazione
  function tagBadge(tone, label) {
    const cls = { ok: 'ok', warn: 'warn', bad: 'danger' }[tone] || 'muted';
    return `<span class="badge ${cls}">${esc(label)}</span>`;
  }

  App.actions['etf-new'] = () => openEtfModal(null);
  App.actions['etf-edit'] = (el) => openEtfModal(App.byId('etfs', el.dataset.id));

  function openEtfModal(e) {
    const values = e ? { nome: e.nome, ticker: e.ticker || '', isin: e.isin || '', prezzo: e.prezzoAttualeCents ?? null, note: e.note || '' } : {};
    UI.modal({
      title: e ? `Modifica · ${e.nome}` : 'Nuovo ETF',
      body: `<form data-form="etf" data-id="${esc(e ? e.id : '')}" novalidate>
        ${UI.fieldsHTML(ETF_FIELDS, values)}
        <div class="form-actions"><button type="button" class="btn ghost" data-modal-close>Annulla</button><button type="submit" class="btn primary">Salva ETF</button></div>
      </form>`,
    });
  }

  App.forms.etf = (form) =>
    UI.guard(form, async () => {
      const { values, errors } = UI.readFields(form, ETF_FIELDS.map((f) => (f.name === 'nome' ? { ...f, required: false } : f)));
      const existing = form.dataset.id ? App.byId('etfs', form.dataset.id) : null;
      const rec = {
        ...(existing || {}),
        nome: values.nome,
        ticker: (values.ticker || '').toUpperCase(),
        isin: (values.isin || '').toUpperCase().replace(/\s/g, ''),
        prezzoAttualeCents: values.prezzo === null ? 0 : values.prezzo,
        dataPrezzo: existing && existing.dataPrezzo ? existing.dataPrezzo : '',
        note: values.note || '',
      };
      const all = [...errors, ...Risparmi.validateEtf(rec)];
      if (all.length) return UI.showErrors(form, all);
      await App.save('etfs', rec);
      UI.closeModalOf(form);
      UI.toast('ETF salvato');
      App.refresh();
    });

  App.actions['etf-price'] = (el) => {
    const e = App.byId('etfs', el.dataset.id);
    if (!e) return;
    UI.modal({
      title: `Prezzo · ${e.nome}`,
      size: 'small',
      body: `<form data-form="etf-price" data-id="${esc(e.id)}" novalidate>
        ${UI.fieldsHTML(PRICE_FIELDS, { prezzo: e.prezzoAttualeCents || null, dataPrezzo: App.today() })}
        <div class="form-actions"><button type="button" class="btn ghost" data-modal-close>Annulla</button><button type="submit" class="btn primary">Aggiorna</button></div>
      </form>`,
    });
  };

  App.forms['etf-price'] = (form) =>
    UI.guard(form, async () => {
      const { values, errors } = UI.readFields(form, PRICE_FIELDS);
      const e = App.byId('etfs', form.dataset.id);
      if (!e) return;
      if (values.prezzo !== null && values.prezzo <= 0) errors.push('Il prezzo deve essere maggiore di zero.');
      if (values.dataPrezzo && !Core.isValidISODate(values.dataPrezzo)) errors.push('Data non valida.');
      if (errors.length) return UI.showErrors(form, errors);
      await App.save('etfs', { ...e, prezzoAttualeCents: values.prezzo, dataPrezzo: values.dataPrezzo });
      UI.closeModalOf(form);
      UI.toast('Prezzo aggiornato');
      App.refresh();
    });

  App.actions['op-new'] = () => {
    if (!App.state.etfs.length) {
      UI.toast('Prima aggiungi un ETF con “+ ETF”.', 'err');
      return;
    }
    const fields = OP_FIELDS.map((f) => (f.name === 'etfId' ? { ...f, options: etfChoices() } : f));
    UI.modal({
      title: 'Nuova operazione',
      body: `<form data-form="operazione" novalidate>
        ${UI.fieldsHTML(fields, { tipo: 'acquisto', date: App.today() })}
        <div class="form-actions"><button type="button" class="btn ghost" data-modal-close>Annulla</button><button type="submit" class="btn primary">Salva operazione</button></div>
      </form>`,
    });
  };

  App.forms.operazione = (form) =>
    UI.guard(form, async () => {
      const fields = OP_FIELDS.map((f) => (f.name === 'etfId' ? { ...f, options: etfChoices() } : f));
      const { values, errors } = UI.readFields(form, fields);
      const rec = {
        etfId: values.etfId,
        date: values.date,
        tipo: values.tipo,
        quantita: values.quantita === null ? 0 : values.quantita,
        prezzoCents: values.prezzo === null ? 0 : values.prezzo,
        commissioniCents: values.commissioni === null ? 0 : values.commissioni,
        note: values.note || '',
      };
      const all = [...errors, ...Risparmi.validateInvestment(rec, App.state.investments)];
      if (!App.byId('etfs', rec.etfId)) all.push('Seleziona un ETF.');
      if (all.length) return UI.showErrors(form, all);
      await App.save('investments', rec);
      UI.closeModalOf(form);
      UI.toast('Operazione registrata');
      App.refresh();
    });

  App.actions['op-delete'] = async (el) => {
    const o = App.byId('investments', el.dataset.id);
    if (!o) return;
    // Non si può cancellare un acquisto se poi ci sono vendite che dipendono da lui
    const after = App.state.investments.filter((x) => x.id !== o.id);
    const broken = after.some((v) => v.tipo === 'vendita' && Risparmi.validateInvestment(v, after, v.id).length > 0);
    if (broken) {
      UI.toast('Non si può eliminare: alcune vendite successive diventerebbero impossibili.', 'err');
      return;
    }
    const ok = await UI.confirmDialog({ title: 'Eliminare l’operazione?', message: `${Risparmi.TIPI_OPERAZIONE[o.tipo]} di ${o.quantita} quote del ${fmtDate(o.date)}. Il costo medio verrà ricalcolato.`, confirmText: 'Elimina', danger: true });
    if (!ok) return;
    await App.remove('investments', o.id);
    UI.toast('Operazione eliminata');
    App.refresh();
  };

  // Patrimonio: conto + ETF, usato in dashboard
  App.patrimonio = () => {
    const conto = contoOf();
    const saldo = Risparmi.savingsBalance(App.state.savings, conto.saldoIniziale, null);
    const etf = Risparmi.portfolio(App.state.etfs, App.state.investments).totali.valore;
    return { conto: saldo, etf, totale: saldo + etf };
  };

})(typeof window !== 'undefined' ? window : globalThis);

</script>
  <script>
/* js/views-investimenti.js */
/*
 * Portafoglio ETF: pagina dedicata e visiva. Legge gli stessi dati di "ETF" e "Risparmi":
 * ogni modifica fatta lì si vede qui al refresh, nessun dato duplicato.
 * La pagina ETF e la dashboard restano invariate.
 */
(function (root) {
  'use strict';

  const { Core, UI, App, Risparmi } = root;
  const { esc, fmtDate } = UI;
  const V = App.views;

  const eur = (c) => Core.formatEuro(c);
  const pct = (p) => Core.formatPercent(p);
  const PALETTE = ['#5ee7ff', '#9b7bff', '#ff7ab6', '#3ddc97', '#ffc15e', '#6ea8ff', '#ff8a5c', '#c3f56b'];

  function donut(segments, centerLabel, centerValue) {
    const R = 15.915;
    let acc = 0;
    const arcs = segments.map((s, i) => {
      const dash = `${s.pct} ${100 - s.pct}`;
      const offset = -acc;
      acc += s.pct;
      return `<circle class="seg" r="${R}" cx="21" cy="21" pathLength="100" stroke="${PALETTE[i % PALETTE.length]}"
        stroke-dasharray="${dash}" stroke-dashoffset="${offset}" style="animation-delay:${i * 140}ms"><title>${esc(s.label)}: ${esc(String(s.pct).replace('.', ','))}%</title></circle>`;
    }).join('');
    return `<svg class="donut" viewBox="0 0 42 42" role="img" aria-label="Allocazione del portafoglio">
      <circle class="track" r="${R}" cx="21" cy="21"></circle>${arcs}
      <text x="21" y="20" text-anchor="middle" class="d-val">${esc(centerValue)}</text>
      <text x="21" y="26" text-anchor="middle" class="d-lbl">${esc(centerLabel)}</text></svg>`;
  }

  function gauge(p) {
    const clamped = Math.max(-100, Math.min(100, p));
    const len = 100;
    const fill = Math.min(100, Math.abs(clamped));
    const tone = p >= 0 ? 'good' : 'bad';
    return `<svg class="gauge ${tone}" viewBox="0 0 120 70" role="img" aria-label="Rendimento ${esc(pct(p))}">
      <path class="g-track" d="M10,60 A50,50 0 0 1 110,60" pathLength="${len}"></path>
      <path class="g-fill" d="M10,60 A50,50 0 0 1 110,60" pathLength="${len}" stroke-dasharray="${fill} ${len}"></path>
      <text x="60" y="52" text-anchor="middle" class="g-val">${esc(pct(p))}</text>
      <text x="60" y="66" text-anchor="middle" class="g-lbl">rendimento</text></svg>`;
  }

  function monthsWindow(n = 12) {
    const cur = App.today().slice(0, 7);
    return Array.from({ length: n }, (_, i) => Core.shiftMonth(cur, i - (n - 1)));
  }

  function emptyState() {
    return `
      <div class="inv-empty">
        <div class="inv-orb" aria-hidden="true"></div>
        <h1>Il tuo portafoglio ETF</h1>
        <p class="muted">Aggiungi il primo ETF e il primo acquisto: qui vedrai valore, costo medio, plus/minusvalenze e la crescita nel tempo.</p>
        <div class="head-actions"><a class="btn primary" href="#/etf">Vai alla gestione ETF</a></div>
      </div>`;
  }

  V.investimenti = () => {
    if (!App.state.etfs.length) return emptyState();
    const etfIds = App.state.etfs.map((e) => e.id);
    const pf = Risparmi.portfolio(App.state.etfs, App.state.investments);
    const t = pf.totali;
    const held = pf.rows.filter((r) => r.quantita > 0);
    const months = monthsWindow(12);
    const costSeries = Risparmi.holdingsCostSeries(App.state.investments, etfIds, months);
    const contrib = Risparmi.monthlyContributions(App.state.investments, months);
    const contribValues = months.map((m) => contrib[m]);
    const contribTot = contribValues.reduce((s, v) => s + v, 0);
    const contribMonths = contribValues.filter((v) => v > 0).length;
    const avgMonthly = contribMonths ? Math.round(contribTot / contribMonths) : 0;
    const firstOp = [...App.state.investments].sort((a, b) => (a.date < b.date ? -1 : 1))[0];
    const realizedAll = t.realizzato;
    const gaugeVal = t.plusPct;
    const segs = held
      .filter((r) => r.valoreCents > 0)
      .map((r) => ({ label: r.etf.nome, pct: r.quotaPct, valore: r.valoreCents }));

    const cards = pf.rows.map((r, i) => {
      const diff = r.prezzoCents && r.costoMedioCents ? r.prezzoCents - r.costoMedioCents : 0;
      const up = diff >= 0;
      const bar = Math.max(4, Math.min(100, r.quotaPct));
      return `<article class="inv-card" style="--i:${i}; --c:${PALETTE[i % PALETTE.length]}">
        <header><div><span class="inv-dot"></span><b>${esc(r.etf.nome)}</b></div>
          <span class="inv-tkr">${esc(r.etf.ticker || '')}</span></header>
        <div class="inv-val">${esc(eur(r.valoreCents))}</div>
        <div class="inv-row"><span>Quote</span><b>${esc(String(r.quantita).replace('.', ','))}</b></div>
        <div class="inv-row"><span>Costo medio</span><b>${r.quantita ? esc(eur(r.costoMedioCents)) : '—'}</b></div>
        <div class="inv-row"><span>Prezzo attuale</span><b>${r.prezzoCents ? esc(eur(r.prezzoCents)) : 'non inserito'}</b></div>
        ${r.quantita && r.prezzoCents ? `<div class="inv-pl ${up ? 'good' : 'bad'}"><span>${up ? '▲' : '▼'} ${esc(eur(Math.abs(Math.round(diff * r.quantita))))}</span> <small>${esc(pct(r.plusPct))}</small></div>` : ''}
        <div class="inv-bar" title="Quota nel portafoglio"><i style="width:${bar}%"></i></div>
        <div class="inv-foot">${esc(String(r.quotaPct).replace('.', ','))}% del portafoglio</div>
      </article>`;
    }).join('');

    const timeline = [...App.state.investments]
      .sort((a, b) => (a.date < b.date ? 1 : -1))
      .slice(0, 12)
      .map((o, i) => {
        const e = App.byId('etfs', o.etfId);
        const importo = Math.round(Number(o.quantita) * o.prezzoCents) + (o.commissioniCents || 0);
        return `<li style="--d:${i * 70}ms" class="${o.tipo}">
          <span class="tl-dot"></span>
          <div><b>${o.tipo === 'vendita' ? 'Vendita' : 'Acquisto'}</b> · ${esc(e ? e.nome : '—')}
            <div class="muted small-note">${esc(fmtDate(o.date))} · ${esc(String(o.quantita).replace('.', ','))} quote a ${esc(eur(o.prezzoCents))}</div></div>
          <b class="${o.tipo === 'vendita' ? 'neg' : ''}">${o.tipo === 'vendita' ? '−' : '+'}${esc(eur(importo))}</b></li>`;
      }).join('');

    const projDefaults = { mensile: 200, rendimento: 6, anni: 15 };
    const startCents = t.valore;

    return `
      <header class="inv-hero">
        <div class="inv-hero-bg" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="inv-hero-copy">
          <p class="eyebrow">Portafoglio ETF · ${esc(App.today().slice(0, 4))}</p>
          <h1 class="inv-title">Il tuo patrimonio investito</h1>
          <div class="inv-big" data-count-eur="${t.valore}">${esc(eur(t.valore))}</div>
          <p class="inv-sub">
            <span class="pill ${t.plus >= 0 ? 'good' : 'bad'}">${t.plus >= 0 ? '▲' : '▼'} ${esc(eur(Math.abs(t.plus)))} · ${esc(pct(t.plusPct))}</span>
            <span class="muted">rispetto al costo di ${esc(eur(t.costo))}</span>
          </p>
        </div>
        <div class="inv-hero-gauge">${gauge(gaugeVal)}</div>
      </header>

      <section class="inv-stats stagger">
        <article class="inv-stat"><span>Investito in totale</span><b data-count-eur="${t.investitoTotale}">${esc(eur(t.investitoTotale))}</b></article>
        <article class="inv-stat"><span>Realizzato dalle vendite</span><b class="${realizedAll >= 0 ? 'good' : 'bad'}">${esc(eur(realizedAll))}</b></article>
        <article class="inv-stat"><span>Versato ultimi 12 mesi</span><b>${esc(eur(contribTot))}</b><small>${contribMonths} mesi con acquisti</small></article>
        <article class="inv-stat"><span>Media mensile reale</span><b>${esc(eur(avgMonthly))}</b><small>solo mesi con acquisti</small></article>
        <article class="inv-stat"><span>ETF in portafoglio</span><b>${held.length}</b><small>${firstOp ? `dal ${esc(fmtDate(firstOp.date))}` : ''}</small></article>
      </section>

      <div class="inv-grid">
        <section class="card inv-panel">
          <div class="section-head"><h3>Allocazione</h3></div>
          <div class="donut-wrap">
            ${segs.length ? donut(segs, 'ETF', `${segs.length}`) : '<p class="muted">Nessuna quota in portafoglio.</p>'}
            <ul class="legend-list">${segs.map((s, i) => `<li><i style="background:${PALETTE[i % PALETTE.length]}"></i>${esc(s.label)}<b>${esc(String(s.pct).replace('.', ','))}%</b></li>`).join('')}</ul>
          </div>
        </section>
        <section class="card inv-panel wide">
          <div class="section-head"><h3>Capitale in mano nel tempo</h3><span class="muted small-note">costo delle quote ancora possedute, fine mese</span></div>
          ${App.lineSVG(months.map((m) => Core.monthShort(m)), costSeries, 'Costo delle quote in mano per mese')}
        </section>
      </div>

      <section class="card inv-panel">
        <div class="section-head"><h3>Versamenti mensili · ultimi 12 mesi</h3></div>
        ${App.barsSVG(months.map((m) => Core.monthShort(m)), [{ name: 'Versato', cls: 'inc', values: contribValues }], { ariaLabel: 'Versamenti mensili negli ultimi 12 mesi', height: 220, fmt: (v) => (v / 100 >= 1000 ? `${Math.round(v / 100000)}k` : String(Math.round(v / 100))) })}
      </section>

      <section class="inv-cards stagger">${cards || UI.empty('Nessuna posizione.')}</section>

      <section class="card inv-panel">
        <div class="section-head"><h3>Simulatore · quanto potrebbe diventare</h3>
          <span class="muted small-note">Simulazione a interesse composto. Non è una previsione: il rendimento lo scegli tu.</span></div>
        <form class="sim-form" data-input="proj" aria-label="Parametri simulazione">
          <label class="sim-field"><span>Versamento mensile <b data-out="mensile">${esc(eur(projDefaults.mensile * 100))}</b></span>
            <input type="range" min="0" max="2000" step="10" value="${projDefaults.mensile}" name="mensile"></label>
          <label class="sim-field"><span>Rendimento annuo ipotizzato <b data-out="rendimento">${esc(projDefaults.rendimento)}%</b></span>
            <input type="range" min="0" max="12" step="0.5" value="${projDefaults.rendimento}" name="rendimento"></label>
          <label class="sim-field"><span>Orizzonte <b data-out="anni">${projDefaults.anni} anni</b></span>
            <input type="range" min="1" max="40" step="1" value="${projDefaults.anni}" name="anni"></label>
          <input type="hidden" name="start" value="${startCents}">
        </form>
        <div id="sim-out">${simOutput(startCents, projDefaults.mensile * 100, projDefaults.rendimento, projDefaults.anni)}</div>
      </section>

      <section class="card inv-panel">
        <div class="section-head"><h3>Ultime operazioni</h3></div>
        ${timeline ? `<ol class="inv-timeline">${timeline}</ol>` : UI.empty('Nessuna operazione.')}
      </section>

      <p class="muted small-note inv-disc">Valori calcolati sui prezzi che inserisci tu. Questa pagina non è consulenza finanziaria.</p>`;
  };

  function simOutput(startCents, monthlyCents, rate, years) {
    const pts = Risparmi.projectGrowth({ startCents, monthlyCents, annualRatePct: rate, years });
    const last = pts[pts.length - 1];
    const labels = pts.map((p) => (p.anno % 5 === 0 || p.anno === years ? `${p.anno}a` : ''));
    return `
      <div class="sim-kpis">
        <article><span>Valore a ${years} anni</span><b data-count-eur="${last.valore}">${esc(eur(last.valore))}</b></article>
        <article><span>Versato</span><b>${esc(eur(last.versato))}</b></article>
        <article class="good"><span>Interessi stimati</span><b>${esc(eur(last.interessi))}</b></article>
      </div>
      ${App.lineSVG(labels, pts.map((p) => p.valore), `Crescita simulata in ${years} anni`)}`;
  }

  App.inputs.proj = (el) => {
    const form = el.closest('form') || el;
    const v = (n) => Number(form.elements[n].value);
    const mensile = v('mensile');
    const rendimento = v('rendimento');
    const anni = v('anni');
    const start = Number(form.elements.start.value) || 0;
    form.querySelector('[data-out="mensile"]').textContent = eur(mensile * 100);
    form.querySelector('[data-out="rendimento"]').textContent = `${String(rendimento).replace('.', ',')}%`;
    form.querySelector('[data-out="anni"]').textContent = `${anni} ${anni === 1 ? 'anno' : 'anni'}`;
    const out = document.getElementById('sim-out');
    if (out) out.innerHTML = simOutput(start, mensile * 100, rendimento, anni);
  };

  App.views.investimenti = V.investimenti;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
</html>
