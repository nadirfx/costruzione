  <style>
/* ==========================================================================
   Gestionale personale · tema scuro high-tech
   ========================================================================== */

:root {
  --bg: #07090f;
  --bg-2: #0c1019;
  --surface: rgba(255, 255, 255, 0.045);
  --surface-2: rgba(255, 255, 255, 0.075);
  --line: rgba(255, 255, 255, 0.09);
  --text: #eef2fb;
  --muted: #8a93a8;
  --accent: #5ee7ff;
  --accent-2: #9b7bff;
  --accent-3: #ff7ab6;
  --ok: #3ddc97;
  --warn: #ffc15e;
  --danger: #ff5d73;
  --info: #6ea8ff;
  --radius: 18px;
  --radius-sm: 11px;
  --shadow: 0 20px 60px -20px rgba(0, 0, 0, 0.7);
  --glow: 0 0 0 1px rgba(94, 231, 255, 0.25), 0 10px 40px -10px rgba(94, 231, 255, 0.35);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --sidebar: 248px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: "Inter", "SF Pro Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-feature-settings: "tnum" 1, "ss01" 1;
  color: var(--text);
  background:
    radial-gradient(1200px 700px at 85% -10%, rgba(155, 123, 255, 0.18), transparent 60%),
    radial-gradient(900px 600px at -10% 110%, rgba(94, 231, 255, 0.13), transparent 60%),
    var(--bg);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
h1, h2, h3 { letter-spacing: -0.02em; margin: 0 0 .4em; }
h1 { font-size: clamp(1.6rem, 2.6vw, 2.3rem); font-weight: 700; }
h3 { font-size: 1rem; font-weight: 650; color: #dfe6f6; }
p { margin: .4em 0; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }
.muted { color: var(--muted); }
.small-note { font-size: .82rem; }
.mono { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: .85rem; }
.num { text-align: right; white-space: nowrap; }
.right { float: right; }
.grow { flex: 1; }
.mt { margin-top: 22px; }
.warn-text { color: var(--warn); }
.neg { color: var(--danger); }
.label-danger { color: var(--danger); font-weight: 600; }
.label-info { color: var(--info); font-weight: 600; }

/* ---------- Layout ---------- */
.app { display: grid; grid-template-columns: var(--sidebar) 1fr; min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; height: 100vh; padding: 22px 14px;
  background: linear-gradient(180deg, rgba(12, 16, 25, 0.9), rgba(7, 9, 15, 0.9));
  border-right: 1px solid var(--line);
  backdrop-filter: blur(18px);
  display: flex; flex-direction: column; gap: 6px;
}
.brand { display: flex; align-items: center; gap: 12px; padding: 6px 10px 18px; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
  background: conic-gradient(from 200deg, var(--accent), var(--accent-2), var(--accent-3), var(--accent));
  box-shadow: var(--glow); font-weight: 800; color: #05070c;
  animation: spin-slow 14s linear infinite;
}
.brand-mark span { animation: spin-slow 14s linear infinite reverse; display: inline-block; }
.brand-name { font-weight: 750; letter-spacing: .02em; }
.brand-sub { font-size: .72rem; color: var(--muted); letter-spacing: .14em; text-transform: uppercase; }
.nav { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.nav a {
  position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 12px;
  border-radius: 12px; color: #b9c2d6; font-size: .92rem; transition: background .25s var(--ease), color .25s;
}
.nav a:hover { background: var(--surface); color: #fff; text-decoration: none; }
.nav a.active { background: linear-gradient(90deg, rgba(94, 231, 255, 0.16), rgba(155, 123, 255, 0.08)); color: #fff; }
.nav a.active::before {
  content: ""; position: absolute; left: -14px; top: 8px; bottom: 8px; width: 3px; border-radius: 3px;
  background: linear-gradient(var(--accent), var(--accent-2)); box-shadow: 0 0 14px var(--accent);
}
.nav .ico { width: 22px; text-align: center; opacity: .9; }
.nav-sep { height: 1px; background: var(--line); margin: 8px 6px; }
.sidebar-foot { margin-top: auto; padding: 12px; font-size: .75rem; color: var(--muted); }
.sidebar-foot .ok-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 10px var(--ok); margin-right: 6px; }

.main { padding: 30px clamp(18px, 3vw, 44px) 80px; min-width: 0; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.page-head p { margin: 2px 0; }
.eyebrow { font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px !important; font-weight: 600; }
.head-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.crumbs { font-size: .85rem; color: var(--muted); margin-bottom: 10px; }
.crumbs a { color: var(--muted); }

/* ---------- Cards & KPI ---------- */
.card, .kpi, .task-group {
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(12px);
  animation: rise .7s var(--ease) both;
  margin-bottom: 18px;
  min-width: 0;
}
.card { transition: border-color .3s, transform .4s var(--ease); }
.card:hover { border-color: rgba(94, 231, 255, 0.22); }
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 18px; }
.kpi-grid.small { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.kpi { margin: 0; position: relative; overflow: hidden; transition: transform .4s var(--ease), box-shadow .4s; }
.kpi:hover { transform: translateY(-3px); box-shadow: var(--shadow), var(--glow); }
.kpi::after {
  content: ""; position: absolute; inset: auto -40% -60% auto; width: 160px; height: 160px; border-radius: 50%;
  background: radial-gradient(circle, rgba(94, 231, 255, 0.18), transparent 70%); pointer-events: none;
}
.kpi.accent { border-color: rgba(94, 231, 255, 0.35); }
.kpi.accent .kpi-value { background: linear-gradient(90deg, #fff, var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.kpi.warn { border-color: rgba(255, 193, 94, 0.35); }
.kpi.bad { border-color: rgba(255, 93, 115, 0.45); }
.kpi-label { display: block; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.kpi-value { display: block; font-size: clamp(1.25rem, 2.1vw, 1.6rem); font-weight: 720; margin: 8px 0 4px; font-variant-numeric: tabular-nums; }
.delta { display: block; font-size: .8rem; color: var(--muted); }
.delta.good { color: var(--ok); }
.delta.bad { color: var(--danger); }
.small-note.muted { color: var(--muted); }
.two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.two-col > .card { margin-bottom: 18px; }
.section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.section-head h3 { margin: 0; }
.summary { margin: 12px 0; color: #cfd6e6; }
.plain-list { list-style: none; padding: 0; margin: 8px 0; }
.plain-list li { padding: 9px 0; border-bottom: 1px dashed var(--line); }
.plain-list li:last-child { border-bottom: 0; }
.bars-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
.bars-row { display: flex; justify-content: space-between; gap: 10px; font-size: .9rem; }
.meter { height: 8px; background: rgba(255, 255, 255, 0.07); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.meter i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); box-shadow: 0 0 14px rgba(94, 231, 255, 0.5); transition: width 1.2s var(--ease); }
.meter.big { height: 12px; margin: 12px 0; }
.dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 18px; margin: 6px 0; }
.dl dt { color: var(--muted); }
.dl dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- Grafici ---------- */
.chart { width: 100%; height: auto; overflow: visible; }
.chart .grid { stroke: rgba(255, 255, 255, 0.07); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-size: 12px; }
.chart .bar { transform-box: fill-box; transform-origin: bottom; animation: grow .9s var(--ease) both; }
.chart .bar.fat { fill: var(--accent); filter: drop-shadow(0 0 6px rgba(94, 231, 255, .35)); }
.chart .bar.inc { fill: var(--accent-2); }
.chart .bar.closed { fill: var(--ok); }
.chart .bar.newc { fill: var(--accent-3); }
.chart .bar-fat { fill: rgba(94, 231, 255, .32); transition: fill .3s; animation: grow .9s var(--ease) both; transform-box: fill-box; transform-origin: bottom; }
.chart .bar-fat.sel { fill: var(--accent); }
.chart .bar-inc { fill: rgba(155, 123, 255, .3); animation: grow .9s var(--ease) both; transform-box: fill-box; transform-origin: bottom; }
.chart .bar-inc.sel { fill: var(--accent-2); }
.chart .bar-fat:hover, .chart .bar-inc:hover { filter: brightness(1.3); }
.chart .stroke { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.6s var(--ease) .2s forwards; filter: drop-shadow(0 0 8px rgba(94, 231, 255, .6)); }
.chart .area { opacity: 0; animation: fade .8s ease 1s forwards; }
.chart .dot { fill: var(--bg); stroke: var(--accent); stroke-width: 2; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: .82rem; color: #b9c2d6; margin-top: 10px; }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.sw.fat { background: var(--accent); }
.sw.inc { background: var(--accent-2); }

/* ---------- Tabelle ---------- */
.table-wrap { overflow-x: auto; border-radius: var(--radius-sm); border: 1px solid var(--line); background: rgba(0, 0, 0, 0.15); margin-bottom: 18px; -webkit-overflow-scrolling: touch; }
.table { width: 100%; border-collapse: collapse; font-size: .9rem; }
.table th, .table td { padding: 11px 14px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.table th { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; background: rgba(255, 255, 255, 0.02); position: sticky; top: 0; }
.table tbody tr { transition: background .2s; }
.table tbody tr:hover { background: rgba(94, 231, 255, 0.05); }
.table tfoot th, .table tfoot td, .total-row td { font-weight: 650; border-top: 1px solid var(--line); }
.table tr.sel-row { background: rgba(94, 231, 255, 0.08); }
.table tr.click { cursor: pointer; }
.table td a { color: #e8f4ff; }
.row-actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
.table .row-actions { justify-content: flex-end; }

/* ---------- Badge ---------- */
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: .75rem; font-weight: 600; border: 1px solid transparent; white-space: nowrap; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
.badge.ok { color: var(--ok); background: rgba(61, 220, 151, .1); border-color: rgba(61, 220, 151, .3); }
.badge.warn { color: var(--warn); background: rgba(255, 193, 94, .1); border-color: rgba(255, 193, 94, .3); }
.badge.danger { color: var(--danger); background: rgba(255, 93, 115, .1); border-color: rgba(255, 93, 115, .35); }
.badge.info { color: var(--info); background: rgba(110, 168, 255, .1); border-color: rgba(110, 168, 255, .3); }
.badge.muted { color: var(--muted); background: rgba(255, 255, 255, .05); border-color: var(--line); }
.count { display: inline-block; min-width: 22px; padding: 1px 7px; margin-left: 6px; border-radius: 99px; background: rgba(255, 255, 255, .08); font-size: .75rem; color: #cfd6e6; text-align: center; }

/* ---------- Tabs ---------- */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 4px; margin: 6px 0 16px; background: rgba(0, 0, 0, .25); border: 1px solid var(--line); border-radius: 14px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 0 0 auto; background: transparent; border: 0; color: var(--muted); padding: 9px 14px; border-radius: 10px; font: inherit; font-size: .9rem; cursor: pointer; transition: all .25s var(--ease); }
.tab:hover { color: #fff; background: var(--surface); }
.tab.active { background: linear-gradient(135deg, rgba(94, 231, 255, .2), rgba(155, 123, 255, .18)); color: #fff; box-shadow: inset 0 0 0 1px rgba(94, 231, 255, .3); }
.tab-body { animation: rise .5s var(--ease) both; }

/* ---------- Bottoni & campi ---------- */
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
  padding: 10px 16px; border-radius: 12px; font: inherit; font-size: .9rem; font-weight: 550; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .2s var(--ease), background .2s, box-shadow .3s, border-color .2s;
  text-decoration: none !important; white-space: nowrap;
}
.btn:hover { background: rgba(255, 255, 255, .11); transform: translateY(-1px); border-color: rgba(255, 255, 255, .2); }
.btn:active { transform: translateY(0) scale(.98); }
.btn:disabled { opacity: .5; cursor: wait; transform: none; }
.btn:focus-visible, .icon-btn:focus-visible, .nav a:focus-visible, .tab:focus-visible, .check-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #05070c; border: 0; font-weight: 700; box-shadow: 0 8px 26px -8px rgba(94, 231, 255, .6); }
.btn.primary:hover { box-shadow: 0 12px 34px -6px rgba(155, 123, 255, .7); background: linear-gradient(135deg, #7af0ff, #b49bff); }
.btn.danger { background: rgba(255, 93, 115, .14); color: #ffc2cb; border-color: rgba(255, 93, 115, .4); }
.btn.danger:hover { background: rgba(255, 93, 115, .25); }
.btn.ghost { background: transparent; }
.btn.small { padding: 6px 10px; font-size: .8rem; border-radius: 9px; }
.btn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-top: 14px; }
.yearrow { margin-bottom: 8px; }
.link-btn { background: none; border: 0; color: var(--muted); cursor: pointer; font: inherit; font-size: .78rem; padding: 0 0 0 8px; }
.link-btn.danger { color: var(--danger); }
.icon-btn { background: transparent; border: 0; color: var(--muted); font-size: 1.1rem; cursor: pointer; padding: 6px 10px; border-radius: 10px; }
.icon-btn:hover { color: #fff; background: var(--surface-2); }

.toolbar { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field.grow { flex: 1 1 240px; }
.field.narrow { flex: 0 0 140px; }
.field.full { grid-column: 1 / -1; }
.field.check { flex-direction: row; align-items: center; gap: 10px; cursor: pointer; }
.lbl { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.req { color: var(--accent-3); }
.hint { font-size: .75rem; color: var(--muted); }
input, select, textarea {
  font: inherit; color: var(--text); background: rgba(0, 0, 0, .35);
  border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; width: 100%;
  transition: border-color .2s, box-shadow .2s, background .2s;
  color-scheme: dark;
}
input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); flex: 0 0 auto; }
input[type="file"] { padding: 9px; font-size: .85rem; }
textarea { resize: vertical; }
select option { background: #101524; color: var(--text); }
input:focus, select:focus, textarea:focus { outline: none; border-color: rgba(94, 231, 255, .6); box-shadow: 0 0 0 4px rgba(94, 231, 255, .14); background: rgba(0, 0, 0, .5); }
input::placeholder, textarea::placeholder { color: #566079; }
.check { display: inline-flex; align-items: center; gap: 8px; color: #cfd6e6; font-size: .9rem; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
.form-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 18px; align-items: center; }
.form-actions.left { justify-content: flex-start; }
form .card { box-shadow: none; }

/* Righe fattura */
.riga { display: grid; grid-template-columns: minmax(180px, 2.4fr) minmax(90px, .7fr) minmax(120px, 1fr) minmax(110px, .9fr) auto; gap: 10px; align-items: end; padding: 12px; border: 1px dashed rgba(255, 255, 255, .12); border-radius: 14px; margin-bottom: 10px; animation: rise .4s var(--ease) both; }
.riga .field { margin: 0; }
.riga-tot { display: flex; flex-direction: column; gap: 6px; }
.riga-tot b { padding: 10px 0; font-variant-numeric: tabular-nums; }
.totals { margin-left: auto; min-width: min(360px, 100%); display: grid; gap: 6px; padding: 16px; border-radius: 14px; background: rgba(0, 0, 0, .3); border: 1px solid var(--line); margin-top: 8px; }
.totals div { display: flex; justify-content: space-between; color: #cfd6e6; }
.totals .grand { font-size: 1.15rem; color: #fff; border-top: 1px solid var(--line); padding-top: 8px; margin-top: 4px; }
.totals .grand b { color: var(--accent); }

/* ---------- Task ---------- */
.task-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.task { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: rgba(0, 0, 0, .18); transition: transform .3s var(--ease), border-color .3s; }
.task:hover { transform: translateX(3px); border-color: rgba(94, 231, 255, .25); }
.task.scaduto { border-color: rgba(255, 93, 115, .4); }
.task.oggi { border-color: rgba(94, 231, 255, .4); }
.task.fatto { opacity: .55; }
.task.fatto .task-body b { text-decoration: line-through; }
.task-body { cursor: pointer; min-width: 0; }
.check-btn { width: 26px; height: 26px; border-radius: 9px; border: 1.5px solid rgba(255, 255, 255, .25); background: transparent; color: var(--ok); cursor: pointer; font-weight: 800; transition: all .3s var(--ease); }
.check-btn:hover { border-color: var(--ok); box-shadow: 0 0 12px rgba(61, 220, 151, .4); }
.task.fatto .check-btn { background: rgba(61, 220, 151, .2); border-color: var(--ok); }
.task-group h3 { display: flex; align-items: center; }
.task-group.danger { border-color: rgba(255, 93, 115, .35); }
.task-group.accent { border-color: rgba(94, 231, 255, .35); }

/* ---------- Timeline, file ---------- */
.timeline { list-style: none; padding: 0; margin: 0; border-left: 2px solid rgba(94, 231, 255, .3); }
.timeline li { position: relative; padding: 0 0 18px 20px; }
.timeline li::before { content: ""; position: absolute; left: -7px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
.tl-meta { font-size: .82rem; color: var(--muted); margin-bottom: 4px; }
.timeline p { margin: 0; white-space: pre-wrap; }
.file-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.file-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: rgba(0, 0, 0, .18); flex-wrap: wrap; }
.file-row b { word-break: break-all; }

/* ---------- Alert, empty, toast, modal ---------- */
.alert { padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); margin-bottom: 18px; background: var(--surface); animation: rise .5s var(--ease) both; }
.alert.warn { border-color: rgba(255, 193, 94, .4); background: rgba(255, 193, 94, .08); }
.alert.danger { border-color: rgba(255, 93, 115, .45); background: rgba(255, 93, 115, .08); }
.alert.info { border-color: rgba(110, 168, 255, .4); background: rgba(110, 168, 255, .08); }
.alert pre { white-space: pre-wrap; font-size: .8rem; color: var(--muted); }
.form-errors { border: 1px solid rgba(255, 93, 115, .5); background: rgba(255, 93, 115, .08); color: #ffd3da; padding: 12px 14px; border-radius: 12px; margin-bottom: 14px; animation: shake .45s var(--ease); }
.form-errors ul { margin: 6px 0 0 18px; padding: 0; }

@keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.99); } to { opacity: 1; transform: none; } }

  <!-- Ordine importante: la logica prima, poi storage, UI, viste e avvio -->
  <script>
/* js/core.js */
/*
 * Core del gestionale: logica pura (nessun DOM, nessuno storage).
 *
 * Regole fondamentali:
 *  - Tutti gli importi sono interi in CENTESIMI (es. 12,50 € = 1250).
 *  - Tutte le date sono stringhe "YYYY-MM-DD" in calendario locale.
 *    Non si usano mai toISOString() o confronti di Date per le date di business,
 *    così non ci sono sfasamenti di un giorno dovuti al fuso orario.
 */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.Core = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  /* ------------------------------------------------------------------ *
   * Costanti
   * ------------------------------------------------------------------ */
  const CATEGORIE_SPESA = [
    'Software e abbonamenti',
    'Crediti AI e API',
    'Hardware e attrezzatura',
    'Hosting e domini',
    'Stock e asset (musica, font, footage)',
    'Formazione',
    'Marketing e pubblicità',
    'Consulenze e commercialista',
    'Trasporti e vitto',
    'Altro',
  ];

  const METODI_PAGAMENTO = ['Bonifico', 'Contanti', 'Carta', 'PayPal', 'Assegno', 'Altro'];

  const STATI_PROGETTO = {
    preventivo: 'Preventivo',
    in_corso: 'In corso',
    consegnato: 'Consegnato',
    chiuso: 'Chiuso',
    annullato: 'Annullato',
  };

  const TIPI_DOCUMENTO = {
    contratto: 'Contratto',
    ricevuta: 'Ricevuta di pagamento',
    fattura: 'Fattura',
    brief: 'Brief / materiale cliente',
    altro: 'Altro',
  };

  const TIPI_ATTIVITA = {
    nota: 'Nota',
    chiamata: 'Chiamata',
    email: 'Email',
    riunione: 'Riunione',
    consegna: 'Consegna',
  };

  const MESI = [
    'gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno',
    'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre',
  ];

  const MAX_FILE_BYTES = 25 * 1024 * 1024;

  /* ------------------------------------------------------------------ *
   * Date (calendario locale, stringhe YYYY-MM-DD)
   * ------------------------------------------------------------------ */
  const pad2 = (n) => String(n).padStart(2, '0');
  const pad3 = (n) => String(n).padStart(3, '0');
  const fmtYMD = (y, m, d) => `${String(y).padStart(4, '0')}-${pad2(m)}-${pad2(d)}`;

  function parseISO(s) {
    const [y, m, d] = s.split('-').map(Number);
    return { y, m, d };
  }

  function daysInMonth(y, m) {
    // m è 1-based: Date.UTC(y, m, 0) è l'ultimo giorno del mese m
    return new Date(Date.UTC(y, m, 0)).getUTCDate();
  }

  function isValidISODate(s) {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    const { y, m, d } = parseISO(s);
    if (m < 1 || m > 12 || d < 1) return false;
    return d <= daysInMonth(y, m);
  }

  function todayISO(now = new Date()) {
    return fmtYMD(now.getFullYear(), now.getMonth() + 1, now.getDate());
  }

  function addDays(iso, n) {
    const { y, m, d } = parseISO(iso);
    const dt = new Date(Date.UTC(y, m - 1, d + n));
    return fmtYMD(dt.getUTCFullYear(), dt.getUTCMonth() + 1, dt.getUTCDate());
  }

  // Giorni da a verso b (positivo se b è dopo a). Usa UTC: niente errori di ora legale.
  function daysBetween(a, b) {
    const A = parseISO(a);
    const B = parseISO(b);
    return Math.round((Date.UTC(B.y, B.m - 1, B.d) - Date.UTC(A.y, A.m - 1, A.d)) / 86400000);
  }

  const monthKeyOf = (y, m) => `${String(y).padStart(4, '0')}-${pad2(m)}`;
  const monthKey = (iso) => iso.slice(0, 7);

  function shiftMonth(key, n) {
    const y = Number(key.slice(0, 4));
    const m = Number(key.slice(5, 7));
    const t = y * 12 + (m - 1) + n;
    return monthKeyOf(Math.floor(t / 12), (t % 12) + 1);
  }

  function lastDayOf(monthK) {
    const y = Number(monthK.slice(0, 4));
    const m = Number(monthK.slice(5, 7));
    return fmtYMD(y, m, daysInMonth(y, m));
  }

  function monthsOfYear(year) {
    return Array.from({ length: 12 }, (_, i) => monthKeyOf(year, i + 1));
  }

  function monthLabel(monthK) {
    const y = Number(monthK.slice(0, 4));
    const m = Number(monthK.slice(5, 7));
    const txt = MESI[m - 1];
    return `${txt.charAt(0).toUpperCase()}${txt.slice(1)} ${y}`;
  }

  function monthShort(monthK) {
    const m = Number(monthK.slice(5, 7));
    return MESI[m - 1].slice(0, 3);
  }

  function inRange(iso, from, to) {
    return typeof iso === 'string' && iso >= from && iso <= to;
  }

  /*
   * Specifica di periodo:
   *  { type:'mese', year, month }            un mese
   *  { type:'trimestre', year, q }           trimestre 1..4
   *  { type:'ultimi', year, month, n }       n mesi che terminano a year/month
   *  { type:'anno', year }                   1 gennaio - 31 dicembre
   */
  function resolvePeriod(spec) {
    let months;
    let label;
    switch (spec.type) {
      case 'mese':
        months = [monthKeyOf(spec.year, spec.month)];
        label = monthLabel(months[0]);
        break;
      case 'trimestre': {
        const start = (spec.q - 1) * 3 + 1;
        months = [0, 1, 2].map((i) => monthKeyOf(spec.year, start + i));
        label = `${spec.q}° trimestre ${spec.year}`;
        break;
      }
      case 'ultimi': {
        const end = monthKeyOf(spec.year, spec.month);
        months = Array.from({ length: spec.n }, (_, i) => shiftMonth(end, i - (spec.n - 1)));
        label = `Ultimi ${spec.n} mesi (fino a ${monthLabel(end)})`;
        break;
      }
      case 'anno':
        months = monthsOfYear(spec.year);
        label = `Anno ${spec.year} (gennaio–dicembre)`;
        break;
      default:
        throw new Error(`Periodo non valido: ${spec.type}`);
    }
    return {
      label,
      months,
      from: `${months[0]}-01`,
      to: lastDayOf(months[months.length - 1]),
      // finestra precedente di uguale lunghezza, per i confronti
      previousMonths: months.map((m) => shiftMonth(m, -months.length)),
    };
  }

  /* ------------------------------------------------------------------ *
   * Denaro (centesimi interi)
   * ------------------------------------------------------------------ */
  // Accetta "1234,5", "1.234,56", "1234.56", "1,234.56", "€ 12", "-3,00".
  // Un punto seguito da esattamente 3 cifre e nient'altro è interpretato come migliaia (1.234 = 1234).
  function parseEuroToCents(input) {
    if (typeof input === 'number') return Number.isFinite(input) ? Math.round(input * 100) : null;
    if (typeof input !== 'string') return null;
    let s = input.replace(/€/g, '').replace(/\s/g, '');
    if (s === '') return null;
    let negative = false;
    if (s.startsWith('-')) {
      negative = true;
      s = s.slice(1);
    }
    const lc = s.lastIndexOf(',');
    const ld = s.lastIndexOf('.');
    if (lc !== -1 && ld !== -1) {
      s = lc > ld ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
    } else if (lc !== -1) {
      s = /^\d+,\d+$/.test(s) ? s.replace(',', '.') : (/^\d{1,3}(,\d{3})+$/.test(s) ? s.replace(/,/g, '') : null);
    } else if (ld !== -1) {
      if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
    }
    if (s === null || !/^\d+(\.\d+)?$/.test(s)) return null;
    const [intPart, fracPart = ''] = s.split('.');
    let cents;
    if (fracPart.length <= 2) {
      cents = Number(intPart) * 100 + Number(fracPart.padEnd(2, '0'));
    } else {
      cents = Math.round(Number(s) * 100);
    }
    return negative ? -cents : cents;
  }

  const euroFormatter = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' });
  const formatEuro = (cents) => euroFormatter.format((Number(cents) || 0) / 100);

  // Per campi di input e CSV: "1234,56" senza simbolo
  const centsToPlain = (cents) => ((Number(cents) || 0) / 100).toFixed(2).replace('.', ',');

  function formatPercent(v) {
    if (v === null || v === undefined || !Number.isFinite(v)) return 'n.d.';
    const sign = v > 0 ? '+' : '';
    return `${sign}${v.toLocaleString('it-IT', { maximumFractionDigits: 1 })}%`;
  }

  // Variazione percentuale. null se non calcolabile (precedente = 0 e attuale ≠ 0).
  function pctChange(curr, prev) {
    if (prev === 0) return curr === 0 ? 0 : null;
    return ((curr - prev) / Math.abs(prev)) * 100;
  }

  /* ------------------------------------------------------------------ *
   * Fatture
   * ------------------------------------------------------------------ */
  function invoiceTotals(inv) {
    const righe = Array.isArray(inv.righe) ? inv.righe : [];
    const imponibile = righe.reduce((s, r) => s + Math.round(Number(r.quantita) * Number(r.prezzoCents)), 0);
    const rate = Number(inv.ivaRate) || 0;
    const iva = Math.round((imponibile * rate) / 100);
    return { imponibile, iva, totale: imponibile + iva };
  }

  function paidOnInvoice(invoiceId, payments, excludePaymentId = null) {
    return payments.reduce(
      (s, p) => (p.invoiceId === invoiceId && p.id !== excludePaymentId ? s + p.amountCents : s),
      0
    );
  }

  /*
   * Stato di una fattura:
   *  bozza | annullata  -> stato dichiarato
   *  pagata | parziale | scaduta | emessa -> stato di pagamento (derivato)
   */
  function invoiceState(inv, payments, today) {
    const { totale } = invoiceTotals(inv);
    if (inv.stato === 'bozza') return { code: 'bozza', label: 'Bozza', overdue: false, paid: 0, residuo: totale, totale };
    if (inv.stato === 'annullata') return { code: 'annullata', label: 'Annullata', overdue: false, paid: 0, residuo: 0, totale };
    const paid = paidOnInvoice(inv.id, payments);
    const residuo = totale - paid;
    const overdue = residuo > 0 && inv.dueDate < today;
    let code;
    if (residuo <= 0) code = 'pagata';
    else if (overdue) code = 'scaduta';
    else if (paid > 0) code = 'parziale';
    else code = 'emessa';
    const labels = {
      pagata: 'Pagata',
      scaduta: 'Scaduta',
      parziale: 'Pagata in parte',
      emessa: 'Da pagare',
    };
    return { code, label: labels[code], overdue, paid, residuo, totale };
  }

  // Numero progressivo per anno: max esistente + 1 (le annullate non liberano numeri)
  function nextInvoiceNumber(year, invoices) {
    const re = new RegExp(`^${year}/(\\d+)$`);
    let max = 0;
    for (const inv of invoices) {
      const m = re.exec(inv.number || '');
      if (m) max = Math.max(max, parseInt(m[1], 10));
    }
    return `${year}/${pad3(max + 1)}`;
  }

  /* ------------------------------------------------------------------ *
   * Saldi e aggregazioni
   * ------------------------------------------------------------------ */
  // data: { clients, invoices, payments, expenses }
  function clientBalance(clientId, data) {
    const imponibile = data.invoices
      .filter((i) => i.clientId === clientId && i.stato === 'emessa')
      .reduce((s, i) => s + invoiceTotals(i).imponibile, 0);
    const totale = data.invoices
      .filter((i) => i.clientId === clientId && i.stato === 'emessa')
      .reduce((s, i) => s + invoiceTotals(i).totale, 0);
    const incassato = data.payments
      .filter((p) => p.clientId === clientId)
      .reduce((s, p) => s + p.amountCents, 0);
    return { imponibile, totale, incassato, saldo: totale - incassato };
  }

  // Ritorna { daIncassare, crediti } sommando il saldo di tutti i clienti
  function receivablesSummary(data) {
    let daIncassare = 0;
    let crediti = 0;
    for (const c of data.clients) {
      const { saldo } = clientBalance(c.id, data);
      if (saldo > 0) daIncassare += saldo;
      else if (saldo < 0) crediti += -saldo;
    }
    return { daIncassare, crediti };
  }

  function overdueInvoices(data, today) {
    return data.invoices
      .filter((i) => i.stato === 'emessa')
      .map((i) => ({ inv: i, st: invoiceState(i, data.payments, today) }))
      .filter((x) => x.st.overdue)
      .sort((a, b) => (a.inv.dueDate < b.inv.dueDate ? -1 : 1));
  }

  // Aggregazione mensile su una lista di mesi (chiavi YYYY-MM)
  function aggregate(data, months) {
    const byMonth = {};
    for (const m of months) {
      byMonth[m] = { fatturato: 0, iva: 0, fatture: 0, incassato: 0, spese: 0, utileCompetenza: 0, utileCassa: 0 };
    }
    for (const inv of data.invoices) {
      if (inv.stato !== 'emessa') continue;
      const m = monthKey(inv.issueDate);
      if (!byMonth[m]) continue;
      const t = invoiceTotals(inv);
      byMonth[m].fatturato += t.imponibile;
      byMonth[m].iva += t.iva;
      byMonth[m].fatture += 1;
    }
    for (const p of data.payments) {
      const m = monthKey(p.date);
      if (byMonth[m]) byMonth[m].incassato += p.amountCents;
    }
    for (const e of data.expenses) {
      const m = monthKey(e.date);
      if (byMonth[m]) byMonth[m].spese += e.amountCents;
    }
    const totals = { fatturato: 0, iva: 0, fatture: 0, incassato: 0, spese: 0, utileCompetenza: 0, utileCassa: 0 };
    for (const m of months) {
      const r = byMonth[m];
      r.utileCompetenza = r.fatturato - r.spese;
      r.utileCassa = r.incassato - r.spese;
      for (const k of Object.keys(totals)) totals[k] += r[k];
    }
    return { byMonth, totals };
  }

  function topClients(data, from, to, limit = 5) {
    const map = new Map();
    for (const inv of data.invoices) {
      if (inv.stato !== 'emessa' || !inRange(inv.issueDate, from, to)) continue;
      map.set(inv.clientId, (map.get(inv.clientId) || 0) + invoiceTotals(inv).imponibile);
    }
    return [...map.entries()]
      .map(([clientId, fatturato]) => ({ clientId, fatturato }))
      .sort((a, b) => b.fatturato - a.fatturato)
      .slice(0, limit);
  }

  /* ------------------------------------------------------------------ *
   * Validazione
   * Ogni validatore ritorna un array di messaggi (vuoto = ok).
   * ------------------------------------------------------------------ */
  function isValidPartitaIva(s) {
    if (!/^\d{11}$/.test(s || '')) return false;
    let sum = 0;
    for (let i = 0; i < 10; i++) {
      let d = Number(s[i]);
      if (i % 2 === 1) {
        d *= 2;
        if (d > 9) d -= 9;
      }
      sum += d;
    }
    return (10 - (sum % 10)) % 10 === Number(s[10]);
  }

  function isValidCodiceFiscale(s) {
    const v = (s || '').toUpperCase();
    return /^[A-Z]{6}\d{2}[ABCDEHLMPRST]\d{2}[A-Z]\d{3}[A-Z]$/.test(v) || /^\d{11}$/.test(v);
  }

  const isValidEmail = (s) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s || '');

  const isNonEmpty = (s) => typeof s === 'string' && s.trim().length > 0;

  function validateClient(c) {
    const err = [];
    if (!['privato', 'azienda'].includes(c.tipo)) err.push('Tipo cliente non valido.');
    if (c.tipo === 'privato') {
      if (!isNonEmpty(c.nome)) err.push('Il nome è obbligatorio.');
      if (!isNonEmpty(c.cognome)) err.push('Il cognome è obbligatorio.');
    } else {
      if (!isNonEmpty(c.ragioneSociale)) err.push('La ragione sociale è obbligatoria.');
      if (!isNonEmpty(c.partitaIva)) err.push('La partita IVA è obbligatoria per le aziende.');
    }
    if (isNonEmpty(c.partitaIva) && !isValidPartitaIva(c.partitaIva.trim())) err.push('Partita IVA non valida (11 cifre con codice di controllo).');
    if (isNonEmpty(c.codiceFiscale) && !isValidCodiceFiscale(c.codiceFiscale.trim())) err.push('Codice fiscale non valido.');
    if (isNonEmpty(c.email) && !isValidEmail(c.email.trim())) err.push('Email non valida.');
    return err;
  }

  function validateInvoice(inv, ctx) {
    const err = [];
    const { clients = [], invoices = [], payments = [] } = ctx || {};
    if (!clients.some((c) => c.id === inv.clientId)) err.push('Seleziona un cliente.');
    if (!isValidISODate(inv.issueDate)) err.push('Data di emissione non valida.');
    if (!isValidISODate(inv.dueDate)) err.push('Data di scadenza non valida.');
    if (isValidISODate(inv.issueDate) && isValidISODate(inv.dueDate) && inv.dueDate < inv.issueDate) {
      err.push('La scadenza non può essere prima dell’emissione.');
    }
    if (!/^\d{4}\/\d{3,}$/.test(inv.number || '')) err.push('Numero fattura non valido (formato AAAA/001).');
    else if (invoices.some((i) => i.number === inv.number && i.id !== inv.id)) err.push(`Il numero ${inv.number} è già usato.`);
    const righe = Array.isArray(inv.righe) ? inv.righe : [];
    if (righe.length === 0) err.push('Aggiungi almeno una riga.');
    righe.forEach((r, idx) => {
      const n = idx + 1;
      if (!isNonEmpty(r.descrizione)) err.push(`Riga ${n}: descrizione obbligatoria.`);
      if (!(Number(r.quantita) > 0) || !Number.isFinite(Number(r.quantita))) err.push(`Riga ${n}: quantità deve essere maggiore di zero.`);
      if (!Number.isInteger(r.prezzoCents) || r.prezzoCents < 0) err.push(`Riga ${n}: prezzo non valido.`);
    });
    const rate = Number(inv.ivaRate);
    if (!Number.isFinite(rate) || rate < 0 || rate > 100) err.push('Aliquota IVA non valida (0–100).');
    if (inv.id) {
      const paid = paidOnInvoice(inv.id, payments);
      const { totale } = invoiceTotals(inv);
      if (paid > totale) err.push(`Non puoi scendere sotto gli incassi già registrati (${formatEuro(paid)}).`);
    }
    return err;
  }

  function validatePayment(p, ctx) {
    const err = [];
    const { clients = [], invoices = [], payments = [] } = ctx || {};
    if (!clients.some((c) => c.id === p.clientId)) err.push('Seleziona un cliente.');
    if (!isValidISODate(p.date)) err.push('Data pagamento non valida.');
    if (!Number.isInteger(p.amountCents) || p.amountCents <= 0) err.push('Importo deve essere maggiore di zero.');
    if (p.invoiceId) {
      const inv = invoices.find((i) => i.id === p.invoiceId);
      if (!inv) err.push('Fattura collegata non trovata.');
      else {
        if (inv.clientId !== p.clientId) err.push('La fattura collegata appartiene a un altro cliente.');
        if (inv.stato !== 'emessa') err.push('Puoi registrare incassi solo su fatture emesse.');
        else {
          const residuo = invoiceTotals(inv).totale - paidOnInvoice(inv.id, payments, p.id);
          if (p.amountCents > residuo) err.push(`L’importo supera il residuo della fattura (${formatEuro(residuo)}).`);
        }
      }
    }
    return err;
  }

  function validateExpense(e) {
    const err = [];
    if (!isValidISODate(e.date)) err.push('Data non valida.');
    if (!isNonEmpty(e.descrizione)) err.push('Descrizione obbligatoria.');
    if (!Number.isInteger(e.amountCents) || e.amountCents <= 0) err.push('Importo deve essere maggiore di zero.');
    if (!CATEGORIE_SPESA.includes(e.categoria)) err.push('Categoria non valida.');
    return err;
  }

  function validateProject(p, ctx) {
    const err = [];
    const { clients = [] } = ctx || {};
    if (!clients.some((c) => c.id === p.clientId)) err.push('Seleziona un cliente.');
    if (!isNonEmpty(p.titolo)) err.push('Titolo obbligatorio.');
    if (!Object.prototype.hasOwnProperty.call(STATI_PROGETTO, p.stato)) err.push('Stato progetto non valido.');
    if (p.dataInizio && !isValidISODate(p.dataInizio)) err.push('Data inizio non valida.');
    if (p.dataConsegna && !isValidISODate(p.dataConsegna)) err.push('Data consegna non valida.');
    if (p.budgetCents !== undefined && (!Number.isInteger(p.budgetCents) || p.budgetCents < 0)) err.push('Budget non valido.');
    return err;
  }

  function validateActivity(a) {
    const err = [];
    if (!isValidISODate(a.date)) err.push('Data non valida.');
    if (!isNonEmpty(a.testo)) err.push('Scrivi il contenuto dell’attività.');
    if (!Object.prototype.hasOwnProperty.call(TIPI_ATTIVITA, a.tipo)) err.push('Tipo non valido.');

  }

  function validateFile(file) {
    const err = [];
    if (!file) err.push('Seleziona un file.');
    else if (file.size > MAX_FILE_BYTES) err.push('Il file supera 25 MB.');
    return err;
  }

  /* ------------------------------------------------------------------ *
   * CSV (separatore ";" e virgola decimale, come vuole Excel in italiano)
   * ------------------------------------------------------------------ */
  function toCsv(columns, rows) {
    const q = (v) => {
      const s = v === null || v === undefined ? '' : String(v);
      return /[";\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };
    const lines = [columns.map((c) => q(c.label)).join(';')];
    for (const r of rows) lines.push(columns.map((c) => q(c.get(r))).join(';'));

  }

  /* ------------------------------------------------------------------ *
   * Varie
   * ------------------------------------------------------------------ */
  function uid() {

  }

  function daysSince(isoDate, today) {
    if (!isValidISODate(isoDate)) return null;
    return daysBetween(isoDate, today);
  }

  return {
    CATEGORIE_SPESA, METODI_PAGAMENTO, STATI_PROGETTO, TIPI_DOCUMENTO, TIPI_ATTIVITA, MESI, MAX_FILE_BYTES,
    pad2, isValidISODate, daysInMonth, todayISO, addDays, daysBetween, monthKeyOf, monthKey, shiftMonth,
    lastDayOf, monthsOfYear, monthLabel, monthShort, inRange, resolvePeriod,
    parseEuroToCents, formatEuro, centsToPlain, formatPercent, pctChange,
    invoiceTotals, paidOnInvoice, invoiceState, nextInvoiceNumber,
    clientBalance, receivablesSummary, overdueInvoices, aggregate, topClients,
    isValidPartitaIva, isValidCodiceFiscale, isValidEmail,
    validateClient, validateInvoice, validatePayment, validateExpense, validateProject, validateActivity, validateFile,
    toCsv, uid, daysSince,
  };
});

/* js/fiscale.js */
/*
 * Fiscale e report: logica pura (testabile con node).
 *
 * ATTENZIONE: sono stime. Aliquote, coefficiente di redditività e soglie sono
 * configurabili in Impostazioni: verificale con il commercialista.
 *
 * Regole usate (regime forfettario, principio di cassa):
 *  - ricavi = compensi INCASSATI nell'anno (non le fatture emesse)
 *  - reddito lordo = ricavi × coefficiente di redditività (ATECO)
 *  - contributi = reddito lordo × aliquota INPS (deducibili)
 *  - imponibile = reddito lordo − contributi
 *  - imposta = imponibile × aliquota sostitutiva (5% nei primi 5 anni se spettante, poi 15%)
 */
(function (root, factory) {
  const C = typeof module === 'object' && module.exports ? require('./core.js') : root.Core;
  const api = factory(C);
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.Fiscale = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function (Core) {
  'use strict';

  const DEFAULT_FISCAL = {
    regimeForfettario: true,
    annoInizio: new Date().getFullYear(),
    coefficiente: 78,          // % di redditività: verifica il tuo codice ATECO
    aliquotaInps: 22,          // % contributi gestione separata (come da tua indicazione)
    aliquotaSostitutiva: 15,   // % imposta sostitutiva ordinaria
    aliquotaStartup: 5,        // % imposta agevolata (primi 5 anni, se spettante)
    anniStartup: 5,
    sogliaRicavi: 85000,       // euro: limite di ricavi/compensi del regime
  };

  // Imposta sostitutiva dell'anno: agevolata nei primi anniStartup anni dall'inizio
  function aliquotaImpostaPerAnno(anno, cfg) {
    const c = { ...DEFAULT_FISCAL, ...cfg };
    const idx = anno - Number(c.annoInizio);
    return idx >= 0 && idx < c.anniStartup ? c.aliquotaStartup : c.aliquotaSostitutiva;
  }

  // Stima per un anno solare. ricaviCents = compensi incassati nell'anno (centesimi)
  function taxEstimate({ anno, ricaviCents, cfg }) {
    const c = { ...DEFAULT_FISCAL, ...cfg };
    const ricavi = Math.max(0, Math.round(ricaviCents));
    const redditoLordo = Math.round((ricavi * c.coefficiente) / 100);
    const contributi = Math.round((redditoLordo * c.aliquotaInps) / 100);
    const imponibile = Math.max(0, redditoLordo - contributi);
    const aliquotaImposta = aliquotaImpostaPerAnno(anno, c);
    const imposta = Math.round((imponibile * aliquotaImposta) / 100);
    const totaleDaPagare = contributi + imposta;
    const sogliaCents = Math.round(c.sogliaRicavi * 100);
    return {
      anno,
      ricavi,
      coefficiente: c.coefficiente,
      redditoLordo,
      aliquotaInps: c.aliquotaInps,
      contributi,
      imponibile,
      aliquotaImposta,
      imposta,
      totaleDaPagare,
      nettoStimato: Math.max(0, ricavi - totaleDaPagare),
      effettivo: ricavi > 0 ? Math.round((totaleDaPagare / ricavi) * 1000) / 10 : 0,
      sogliaRaggiunta: ricavi >= sogliaCents,
      percentualeSoglia: Math.min(100, Math.round((ricavi / sogliaCents) * 1000) / 10),
      inStartup: aliquotaImposta === c.aliquotaStartup,
    };
  }

  // Proiezione lineare a fine anno, dai mesi già trascorsi
  function projectYear(ricaviYtdCents, mesiTrascorsi) {
    if (!mesiTrascorsi || mesiTrascorsi <= 0) return 0;
    return Math.round((ricaviYtdCents / mesiTrascorsi) * 12);
  }

  // Ricavi per tassazione: incassi nell'anno (principio di cassa)
  function ricaviIncassati(data, anno) {
    return data.payments
      .filter((p) => Number(p.date.slice(0, 4)) === anno)
      .reduce((s, p) => s + p.amountCents, 0);
  }

  /* ------------------------------ Settimane ------------------------------ */
  // Lunedì e domenica della settimana che contiene iso
  function weekRange(iso) {
    const { y, m, d } = { y: Number(iso.slice(0, 4)), m: Number(iso.slice(5, 7)), d: Number(iso.slice(8, 10)) };
    const dow = new Date(Date.UTC(y, m - 1, d)).getUTCDay(); // 0 = domenica
    const offset = dow === 0 ? 6 : dow - 1;
    const from = Core.addDays(iso, -offset);
    return { from, to: Core.addDays(from, 6) };
  }

  const localDateOf = (ts) => (ts ? Core.todayISO(new Date(ts)) : '');

  function weekReport(data, anyDayIso, today) {
    const { from, to } = weekRange(anyDayIso);
    const inW = (d) => Core.inRange(d, from, to);
    const fatture = data.invoices.filter((i) => i.stato === 'emessa' && inW(i.issueDate));
    const fatturato = fatture.reduce((s, i) => s + Core.invoiceTotals(i).imponibile, 0);
    const incassi = data.payments.filter((p) => inW(p.date));
    const incassato = incassi.reduce((s, p) => s + p.amountCents, 0);
    const spese = data.expenses.filter((e) => inW(e.date)).reduce((s, e) => s + e.amountCents, 0);
    const nuoviClienti = data.clients.filter((c) => inW(localDateOf(c.createdAt)));
    const lavoriChiusi = data.projects
      .filter((p) => (p.stato === 'consegnato' || p.stato === 'chiuso') && inW(p.dataConsegna || ''))
      .map((p) => ({ ...p, durataGiorni: p.dataInizio ? Core.daysBetween(p.dataInizio, p.dataConsegna) : null }));
    const lavoriAperti = data.projects.filter((p) => p.stato === 'in_corso' || p.stato === 'preventivo');
    const attivita = data.activities.filter((a) => inW(a.date));
    const tasksFatti = (data.tasks || []).filter((t) => t.stato === 'fatto' && inW(localDateOf(t.completedAt)));
    const tasksAperti = (data.tasks || []).filter((t) => t.stato !== 'fatto');
    const scadenzeSettimana = tasksAperti.filter((t) => t.scadenza && inW(t.scadenza));
    const tasksScaduti = tasksAperti.filter((t) => t.scadenza && t.scadenza < today);
    return {
      from, to,
      fatturato, incassato, spese, utile: incassato - spese,
      fattureEmesse: fatture.length,
      nuoviClienti,
      lavoriChiusi,
      lavoriAperti,
      attivita,
      incassi,
      tasksFatti,
      tasksAperti,
      scadenzeSettimana,
      tasksScaduti,
    };
  }

  /* ------------------------------ Andamento annuo ------------------------------ */
  function yearTrend(data, year) {
    const months = Core.monthsOfYear(year);
    const agg = Core.aggregate(data, months);
    return months.map((m) => {
      const a = agg.byMonth[m];
      const closed = data.projects.filter((p) => (p.stato === 'consegnato' || p.stato === 'chiuso') && (p.dataConsegna || '').startsWith(m));
      const nuovi = data.clients.filter((c) => localDateOf(c.createdAt).startsWith(m));
      return {
        month: m,
        label: Core.monthLabel(m),
        short: Core.monthShort(m),
        fatturato: a.fatturato,
        incassato: a.incassato,
        spese: a.spese,
        lavoriChiusi: closed.length,
        lavoriChiusiElenco: closed,
        nuoviClienti: nuovi.length,
      };
    });
  }

  /* ------------------------------ Task ------------------------------ */
  function taskBucket(t, today) {
    if (t.stato === 'fatto') return 'fatto';
    if (!t.scadenza) return 'senza';
    if (t.scadenza < today) return 'scaduto';
    if (t.scadenza === today) return 'oggi';
    return 'prossimo';
  }

  const PRIORITA = { alta: 'Alta', media: 'Media', bassa: 'Bassa' };

  function validateTask(t) {
    const err = [];
    if (!t.titolo || !String(t.titolo).trim()) err.push('Scrivi il titolo del task.');
    if (t.scadenza && !Core.isValidISODate(t.scadenza)) err.push('Scadenza non valida.');
    if (!Object.prototype.hasOwnProperty.call(PRIORITA, t.priorita)) err.push('Priorità non valida.');
    return err;
  }

  return {
    DEFAULT_FISCAL, PRIORITA, aliquotaImpostaPerAnno, taxEstimate, projectYear, ricaviIncassati,
    weekRange, weekReport, yearTrend, taskBucket, validateTask,
  };
});

  <script>
/* js/db.js */
/*
 * Persistenza in IndexedDB (tutto in locale, nel tuo browser).
 *
 * Stores:
 *   clients, projects, invoices, payments, expenses, activities  -> record JSON
 *   files      -> metadati dei documenti (nome, tipo, cliente, ...)
 *   blobs      -> contenuto binario dei documenti (tenuto separato: non viene caricato in memoria)
 *   meta       -> impostazioni (record con id "settings")
 *
 * Ogni scrittura è una transazione: o va tutta, o non va.
 */
(function (root) {
  'use strict';

  const DB_NAME = 'gestionale-personale';
  // v2: aggiunto lo store "tasks". onupgradeneeded crea solo gli store mancanti: i dati esistenti restano.
  // v3: aggiunto lo store "snapshots" (copie di sicurezza dei dati). Mai svuotato dall'import.
  const DB_VERSION = 4;
  // v4: aggiunti "savings" (movimenti conto personale), "etfs" e "investments" (operazioni ETF)
  const RECORD_STORES = ['clients', 'projects', 'invoices', 'payments', 'expenses', 'activities', 'tasks', 'savings', 'etfs', 'investments', 'files', 'meta'];
  const LIST_KEYS = ['clients', 'projects', 'invoices', 'payments', 'expenses', 'activities', 'tasks', 'savings', 'etfs', 'investments'];
  const ALL_STORES = [...RECORD_STORES, 'blobs', 'snapshots'];
  const DATA_STORES = [...RECORD_STORES, 'blobs'];
  const BACKUP_FORMAT = 'gestionale-backup';
  const BACKUP_VERSION = 1;

  let dbPromise = null;

  function open() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      if (!root.indexedDB) {
        reject(new Error('Questo browser non supporta IndexedDB: i dati non possono essere salvati.'));
        return;
      }
      const req = root.indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        for (const s of ALL_STORES) {
          if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'id' });
        }
      };
      req.onsuccess = () => {
        const db = req.result;
        // Se un'altra scheda aggiorna il database, chiudiamo e riapriamo alla prossima operazione
        db.onversionchange = () => {
          db.close();
          dbPromise = null;
        };
        resolve(db);
      };
      req.onerror = () => reject(req.error || new Error('Apertura database fallita'));
      req.onblocked = () => reject(new Error('Il database è aperto in un’altra scheda: chiudila e ricarica la pagina.'));
    });
    // In caso di errore, al prossimo tentativo si riprova l'apertura
    dbPromise.catch(() => { dbPromise = null; });
    return dbPromise;
  }

  // Esegue `work(tx, box)` dentro una transazione; box.value è il risultato a commit avvenuto.
  function run(storeNames, mode, work) {
    return open().then(
      (db) =>
        new Promise((resolve, reject) => {
          const tx = db.transaction(storeNames, mode);
          const box = { value: undefined };
          tx.oncomplete = () => resolve(box.value);
          tx.onerror = () => reject(tx.error || new Error('Errore di scrittura nel database'));
          tx.onabort = () => reject(tx.error || new Error('Operazione annullata'));
          try {
            work(tx, box);
          } catch (e) {
            try { tx.abort(); } catch (_) { /* già chiusa */ }
            reject(e);
          }
        })
    );
  }

  function getAllFrom(tx, store, box, key) {
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => { box.value = box.value || {}; box.value[key || store] = req.result; };
  }

  // Carica tutti i record (senza i blob)
  function loadAll() {
    return run(RECORD_STORES, 'readonly', (tx, box) => {
      box.value = {};
      for (const s of RECORD_STORES) getAllFrom(tx, s, box);
    }).then((out) => {
      const result = {};
      for (const s of RECORD_STORES) result[s] = out[s] || [];
      // il record delle impostazioni è un singolo oggetto
      const settingsRec = result.meta.find((r) => r.id === 'settings');
      result.settings = settingsRec ? stripId(settingsRec) : {};
      delete result.meta;
      return result;
    });
  }

  function stripId(rec) {
    const { id, ...rest } = rec;
    return rest;
  }

  function put(store, rec) {
    return run([store], 'readwrite', (tx) => {
      tx.objectStore(store).put(rec);
    }).then(() => rec);
  }

  function remove(store, id) {
    return run([store], 'readwrite', (tx) => {
      tx.objectStore(store).delete(id);
    });
  }

  function saveSettings(settings) {
    return put('meta', { id: 'settings', ...settings }).then(() => settings);
  }

  // Salva metadati e blob del documento in un'unica transazione
  function saveFile(meta, blob) {
    return run(['files', 'blobs'], 'readwrite', (tx) => {
      tx.objectStore('files').put(meta);
      tx.objectStore('blobs').put({ id: meta.id, blob });
    }).then(() => meta);
  }

  function removeFile(id) {
    return run(['files', 'blobs'], 'readwrite', (tx) => {
      tx.objectStore('files').delete(id);
      tx.objectStore('blobs').delete(id);
    });
  }

  function getBlob(id) {
    return run(['blobs'], 'readonly', (tx, box) => {
      const req = tx.objectStore('blobs').get(id);
      req.onsuccess = () => { box.value = req.result ? req.result.blob : null; };
    });
  }

  /* ------------------------------ Backup ------------------------------ */

  function blobToDataURL(blob) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => resolve(fr.result);
      fr.onerror = () => reject(fr.error);
      fr.readAsDataURL(blob);
    });
  }

  function dataURLToBlob(dataUrl, type) {
    const comma = dataUrl.indexOf(',');
    if (comma < 0) throw new Error('Dati di un documento non leggibili');
    const bin = atob(dataUrl.slice(comma + 1));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type: type || 'application/octet-stream' });
  }

  // Esporta tutto (incluso il contenuto dei documenti) in un unico oggetto JSON
  async function exportAll() {
    const data = await loadAll();
    const blobs = await run(['blobs'], 'readonly', (tx, box) => {
      const req = tx.objectStore('blobs').getAll();
      req.onsuccess = () => { box.value = req.result || []; };
    });
    const files = [];
    for (const b of blobs) {
      const meta = data.files.find((f) => f.id === b.id);
      if (!meta) continue;
      files.push({ ...meta, dataUrl: await blobToDataURL(b.blob) });
    }
    return {
      format: BACKUP_FORMAT,
      version: BACKUP_VERSION,
      exportedAt: new Date().toISOString(),
      counts: {
        clienti: data.clients.length,
        progetti: data.projects.length,
        fatture: data.invoices.length,
        pagamenti: data.payments.length,
        spese: data.expenses.length,
        attivita: data.activities.length,
        task: data.tasks.length,
        movimentiConto: data.savings.length,
        etf: data.etfs.length,
        operazioniEtf: data.investments.length,
        documenti: files.length,
      },
      data: {
        settings: data.settings,
        clients: data.clients,
        projects: data.projects,
        invoices: data.invoices,
        payments: data.payments,
        expenses: data.expenses,
        activities: data.activities,
        tasks: data.tasks,
        savings: data.savings,
        etfs: data.etfs,
        investments: data.investments,
        files,
      },
    };
  }

  // Valida la struttura minima di un backup prima di toccare il database
  function validateBackup(obj) {
    if (!obj || obj.format !== BACKUP_FORMAT) throw new Error('Il file non è un backup di questo gestionale.');
    if (obj.version !== BACKUP_VERSION) throw new Error(`Versione di backup non supportata: ${obj.version}`);
    const d = obj.data;
    if (!d || typeof d !== 'object') throw new Error('Backup senza dati.');
    // Le sezioni nate dopo (task, conto, ETF) sono facoltative: i backup vecchi restano validi
    for (const k of ['savings', 'etfs', 'investments', 'tasks']) if (d[k] === undefined) d[k] = [];
    for (const k of ['clients', 'projects', 'invoices', 'payments', 'expenses', 'activities', 'files']) {
      if (!Array.isArray(d[k])) throw new Error(`Sezione mancante nel backup: ${k}`);
      for (const r of d[k]) {
        if (!r || typeof r.id !== 'string' || !r.id) throw new Error(`Record senza id in "${k}".`);
      }
    }
    for (const f of d.files) {
      if (typeof f.dataUrl !== 'string') throw new Error(`Documento senza contenuto: ${f.name || f.id}`);
    }
    return d;
  }

  // Sostituisce interamente i dati con quelli del backup (operazione atomica)
  async function importAll(obj) {
    const d = validateBackup(obj);
    const blobs = d.files.map((f) => ({ id: f.id, blob: dataURLToBlob(f.dataUrl, f.mime) }));
    const metas = d.files.map(({ dataUrl, ...rest }) => rest);
    await run(ALL_STORES, 'readwrite', (tx) => {
      // Gli snapshot non vengono toccati: l'import può essere annullato ripristinando uno snapshot
      for (const s of DATA_STORES) tx.objectStore(s).clear();
      for (const c of d.clients) tx.objectStore('clients').put(c);
      for (const p of d.projects) tx.objectStore('projects').put(p);
      for (const i of d.invoices) tx.objectStore('invoices').put(i);
      for (const p of d.payments) tx.objectStore('payments').put(p);
      for (const e of d.expenses) tx.objectStore('expenses').put(e);
      for (const a of d.activities) tx.objectStore('activities').put(a);
      for (const t of d.tasks || []) tx.objectStore('tasks').put(t);
      for (const x of d.savings) tx.objectStore('savings').put(x);
      for (const x of d.etfs) tx.objectStore('etfs').put(x);
      for (const x of d.investments) tx.objectStore('investments').put(x);
      for (const m of metas) tx.objectStore('files').put(m);
      for (const b of blobs) tx.objectStore('blobs').put(b);
      tx.objectStore('meta').put({ id: 'settings', ...(d.settings || {}) });
    });
    return d;
  }

  /* ------------------------------ Snapshot ------------------------------ */
  // rec: { id (ISO), reason, savedAt, counts, records }  (records = copia JSON di tutti i record, senza documenti)
  function saveSnapshot(snap) {
    return put('snapshots', snap).then(() => snap);
  }

  // Elenco leggero (senza il contenuto dei record), dal più recente
  function listSnapshots() {
    return run(['snapshots'], 'readonly', (tx, box) => {
      const req = tx.objectStore('snapshots').getAll();
      req.onsuccess = () => {
        box.value = (req.result || []).map(({ records, ...meta }) => meta).sort((a, b) => (a.id < b.id ? 1 : -1));
      };
    });
  }

  function getSnapshot(id) {
    return run(['snapshots'], 'readonly', (tx, box) => {
      const req = tx.objectStore('snapshots').get(id);
      req.onsuccess = () => { box.value = req.result || null; };
    });
  }

  // Mantiene solo gli ultimi `keep` snapshot
  async function pruneSnapshots(keep = 40) {
    const all = await listSnapshots();
    const old = all.slice(keep);
    if (!old.length) return 0;
    await run(['snapshots'], 'readwrite', (tx) => {
      for (const s of old) tx.objectStore('snapshots').delete(s.id);
    });
    return old.length;
  }

  // Ripristina solo i record (clienti, fatture, ...). I documenti restano com'erano.
  async function restoreRecords(records) {
    const stores = [...LIST_KEYS, 'meta'];
    await run(stores, 'readwrite', (tx) => {
      for (const s of LIST_KEYS) {
        tx.objectStore(s).clear();
        for (const r of records[s] || []) tx.objectStore(s).put(r);
      }
      tx.objectStore('meta').put({ id: 'settings', ...(records.settings || {}) });
    });
  }

  async function requestPersistence() {
    try {
      if (root.navigator && root.navigator.storage && root.navigator.storage.persist) {
        return await root.navigator.storage.persist();
      }
    } catch (_) { /* non critico */ }
    return false;
  }

  async function storageEstimate() {
    try {

/*
 * Helper di interfaccia: escape HTML, modali, conferme, toast, form dichiarativi.
 * Ogni valore che arriva dai dati viene passato da esc() prima di finire nell'HTML.

(function (root) {
  'use strict';

  const Core = root.Core;

  const esc = (v) =>

      .replace(/&/g, '&amp;')

    el.setAttribute('role', 'status');

  /* ------------------------------ Modali ------------------------------ */

  // body: stringa HTML. Ritorna { close(), el }. onOpen(el) viene chiamato dopo l'inserimento.
  function modal({ title, body, size = '', onOpen = null, onClose = null }) {
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `
      <div class="modal ${esc(size)}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
        <header class="modal-head">
          <h2>${esc(title)}</h2>
          <button type="button" class="icon-btn" data-modal-close aria-label="Chiudi">✕</button>
        </header>
        <div class="modal-body">${body}</div>
      </div>`;
    document.body.appendChild(overlay);
    const entry = {
      el: overlay,
      close() {
        overlay.remove();
        openModals = openModals.filter((m) => m !== entry);
        if (onClose) onClose();
      },
    };
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) return; // niente chiusura per click fuori: evita di perdere dati digitati
      if (e.target.closest('[data-modal-close]')) entry.close();
    });
    overlay.modalEntry = entry;
    openModals.push(entry);
    if (onOpen) onOpen(overlay.querySelector('.modal'), entry);
    const first = overlay.querySelector('input, select, textarea, button:not([data-modal-close])');
    if (first) first.focus();
    return entry;
  }

  function closeTopModal() {
    const m = openModals[openModals.length - 1];
    if (m) m.close();

  document.addEventListener('keydown', (e) => {

        done = true;
        resolve(v);

      const m = modal({
        title,
        size: 'small',
        body: `
          <p class="confirm-msg">${esc(message)}</p>
          <div class="form-actions">
            <button type="button" class="btn ghost" data-confirm="no">Annulla</button>
            <button type="button" class="btn ${danger ? 'danger' : 'primary'}" data-confirm="yes">${esc(confirmText)}</button>

        onOpen: (el) => {
          el.addEventListener('click', (e) => {

    const cls = `field${f.full ? ' full' : ''}${f.type === 'checkbox' ? ' check' : ''}`;
    const hint = f.hint ? `<small class="hint">${esc(f.hint)}</small>` : '';

      } else {

      box.setAttribute('role', 'alert');

    box.innerHTML = `<strong>Controlla questi punti:</strong><ul>${errors.map((e) => `<li>${esc(e)}</li>`).join('')}</ul>`;
    box.scrollIntoView({ block: 'nearest' });

  /* ------------------------------ Download ------------------------------ */
  // Chiude la modale che contiene l'elemento (se c'è)
  function closeModalOf(el) {

      document.querySelectorAll('[data-nav]').forEach((a) => {
        a.classList.toggle('active', a.dataset.nav === route.nav);
        if (a.dataset.nav === route.nav) a.setAttribute('aria-current', 'page');
        else a.removeAttribute('aria-current');
      });
      const fn = App.views[route.view];
      if (!fn) {
        main.innerHTML = UI.empty('Pagina non trovata.');
        return;
      }
      try {
        // Stessa pagina (es. dopo un salvataggio): mantiene la posizione. Pagina nuova: in cima.
        const sameRoute = main.dataset.route === location.hash;
        const y = root.scrollY;
        main.innerHTML = fn(...route.params);
        main.dataset.route = location.hash;
        root.scrollTo(0, sameRoute ? y : 0);
        countUp(main);
        if (main.querySelector('#snap-list') && App.loadSnapshotList) App.loadSnapshotList();
        // Form fattura: calcola subito i totali (nuova fattura o modifica)
        const invForm = main.querySelector('form[data-input="invoice-totals"]');
        if (invForm) App.inputs['invoice-totals'](invForm);
      } catch (e) {
        console.error(e);
        main.innerHTML = `<div class="alert danger"><strong>Errore nella pagina.</strong><pre>${esc(e.message)}</pre></div>`;
      }
    },

    refresh() {
      if (App.locked) return;
      App.render();
      App.renderBackupBanner();
    },

    // Avviso di backup: mai fatto o più vecchio di 14 giorni, con dati presenti
    renderBackupBanner() {
      const host = $('#backup-banner');
      if (!host) return;
      const s = App.settings();
      const hasData = App.state.clients.length + App.state.invoices.length + App.state.payments.length + App.state.expenses.length > 0;
      const days = Core.daysSince(s.lastBackupAt ? s.lastBackupAt.slice(0, 10) : null, App.today());
      if (hasData && (days === null || days >= 14)) {
        host.hidden = false;
        const quando = days === null ? 'Non hai mai esportato un backup' : `Ultimo backup ${days} giorni fa`;
        host.innerHTML = `${quando}. I dati vivono solo in questo browser: <a href="#/esporta">esporta un backup</a>.`;
      } else {
        host.hidden = true;
        host.innerHTML = '';
      }
    },
  };

  root.App = App;

  // Numeri che salgono fino al valore finale (data-count = intero, data-count-eur = centesimi)
  const reduceMotion = root.matchMedia && root.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function countUp(scope) {
    if (reduceMotion || !root.requestAnimationFrame) return;
    scope.querySelectorAll('[data-count], [data-count-eur]').forEach((el) => {
      const isEur = el.hasAttribute('data-count-eur');
      const target = Number(isEur ? el.dataset.countEur : el.dataset.count) || 0;
      const start = performance.now();
      const dur = 900;
      const step = (now) => {
        const p = Math.min(1, (now - start) / dur);
        const eased = 1 - Math.pow(1 - p, 3);
        const v = Math.round(target * eased);
        el.textContent = isEur ? Core.formatEuro(v) : String(v);
        if (p < 1) root.requestAnimationFrame(step);
      };
      el.textContent = isEur ? Core.formatEuro(0) : '0';
      root.requestAnimationFrame(step);
    });
  }

  /* ------------------------------ Delegazione eventi ------------------------------ */
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const fn = App.actions[el.dataset.action];
    if (!fn) return;
    if (el.tagName === 'A' && el.getAttribute('href') === '#') e.preventDefault();
    Promise.resolve(fn(el, e)).catch(reportError);
  });

  document.addEventListener('submit', (e) => {
    const form = e.target.closest('form[data-form]');
    if (!form) return;
    e.preventDefault();
    const fn = App.forms[form.dataset.form];
    if (!fn) return;
    Promise.resolve(fn(form, e)).catch(reportError);
  });

  document.addEventListener('change', (e) => {
    const el = e.target.closest('[data-change]');
    if (!el) return;
    const fn = App.changes[el.dataset.change];
    if (fn) Promise.resolve(fn(el, e)).catch(reportError);
  });

  document.addEventListener('input', (e) => {
    const el = e.target.closest('[data-input]');
    if (!el) return;
    const fn = App.inputs[el.dataset.input];
    if (fn) fn(el, e);
  });

  // Formato automatico per i campi importo: alla perdita di focus scrive 1.234,56
  document.addEventListener('blur', (e) => {
    const el = e.target;
    if (el && el.dataset && el.dataset.type === 'money' && el.value.trim() !== '') {
      const c = Core.parseEuroToCents(el.value);
      if (c !== null) el.value = Core.centsToPlain(c);
    }
  }, true);

  function reportError(err) {
    console.error(err);
    toast(err && err.message ? err.message : 'Operazione non riuscita', 'err');
  }
  App.reportError = reportError;

  /* ------------------------------ Avvio ------------------------------ */
  async function boot() {
    const main = $('#view');
    try {
      await DB.open();
      DB.requestPersistence();
      App.state = { ...App.state, ...(await DB.loadAll()) };
    } catch (err) {
      console.error(err);
      main.innerHTML = `<div class="alert danger"><strong>Impossibile aprire l’archivio dati.</strong><p>${esc(err.message)}</p></div>`;
      return;
    }
    const stored = App.state.settings || {};
    App.state.settings = { ...DEFAULT_SETTINGS, ...stored, fiscal: { ...DEFAULT_SETTINGS.fiscal, ...(stored.fiscal || {}) } };
    root.addEventListener('hashchange', () => App.refresh());
    if (!root.location.hash) root.location.hash = '#/dashboard';
    // Ultima copia di sicurezza, per la cadenza automatica
    DB.listSnapshots()
      .then((list) => { App.lastSnapshotAt = list[0] ? Date.parse(list[0].savedAt) : null; })
      .catch(() => {});
    if (Auth.isLoggedIn()) {
      App.unlock();
    } else {
      App.lock();
    }
  }

  if (root.document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(typeof window !== 'undefined' ? window : globalThis);

</script>
  <script>
/* js/login.js */
/*
 * Schermata di accesso: blocca l'app finché utente e password non sono corretti.
 * I dati restano nel database anche quando l'app è bloccata: il blocco non tocca nulla.
 */
(function (root) {
  'use strict';

  const { Auth, UI, App } = root;
  const $ = UI.$;

  function setMsg(text, kind = '') {
    const m = $('#login-msg');
    if (!m) return;
    m.textContent = text;
    m.className = `login-msg ${kind}`;
  }

  App.lock = () => {
    App.locked = true;
    document.body.classList.add('locked');
    const screen = $('#login');
    if (screen) screen.hidden = false;
    const wait = Auth.lockedFor();
    if (wait > 0) startCountdown(wait);
    else setMsg('');
    const u = $('#login-user');
    if (u && !u.value) u.value = Auth.USERNAME;
    const p = $('#login-pass');
    if (p) { p.value = ''; setTimeout(() => p.focus(), 60); }
  };

  App.unlock = () => {
    App.locked = false;
    document.body.classList.remove('locked');
    const screen = $('#login');
    if (screen) screen.hidden = true;
    setMsg('');
    App.refresh();
  };

  let timer = null;
  function startCountdown(ms) {
    const btn = $('#login-submit');
    const end = Date.now() + ms;
    if (btn) {
      btn.dataset.hold = '1';
      btn.disabled = true;
    }
    clearInterval(timer);
    timer = setInterval(() => {
      const left = Math.ceil((end - Date.now()) / 1000);
      if (left <= 0) {
        clearInterval(timer);
        if (btn) {
          delete btn.dataset.hold;
          btn.disabled = false;
        }
        setMsg('');
        Auth.clearFails();
        return;
      }
      setMsg(`Troppi tentativi. Riprova tra ${left} secondi.`, 'err');
    }, 250);
  }

  App.forms.login = (form) =>
    UI.guard(form, async () => {
      const user = form.elements.username.value;
      const pass = form.elements.password.value;
      const remember = form.elements.remember.checked;
      if (Auth.lockedFor() > 0) return startCountdown(Auth.lockedFor());
      setMsg('Verifica in corso…');
      let ok;
      try {
        ok = await Auth.verifyCredentials(user, pass);
      } catch (err) {
        if (err.message === 'CONTEXT') {
          setMsg('Per accedere serve una pagina sicura: apri il file dal computer o da un indirizzo https.', 'err');
          return;
        }
        throw err;
      }
      if (!ok) {
        const st = Auth.recordFail();
        form.elements.password.value = '';
        form.classList.remove('shake');
        void form.offsetWidth;
        form.classList.add('shake');
        if (Auth.lockedFor() > 0) return startCountdown(Auth.lockedFor());
        const left = 5 - (st.n % 5);
        setMsg(`Utente o password non corretti. Tentativi rimasti: ${left}.`, 'err');
        return;
      }
      Auth.clearFails();
      Auth.startSession(remember);
      setMsg('');
      App.unlock();
      UI.toast('Bentornato');
    });

  App.actions.logout = async () => {
    const ok = await UI.confirmDialog({
      title: 'Uscire dal gestionale?',
      message: 'I dati restano salvati su questo dispositivo. Per riaccedere serviranno utente e password.',
      confirmText: 'Esci',
    });
    if (!ok) return;
    Auth.endSession();
    App.lock();
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
  <script>
/* js/views-dashboard.js */
/*
 * Dashboard: KPI del periodo scelto, confronto con il periodo precedente,
 * grafico mensile dell'anno, tabelle per mese e trimestre, scadenze, top clienti.
 */
(function (root) {
  'use strict';

  const { Core, UI, App, Fiscale } = root;
  const { esc, fmtDate } = UI;
  const V = App.views;

  const PERIODS = [
    ['mese', 'Mese'],
    ['trimestre', 'Trimestre'],
    ['ultimi3', 'Ultimi 3 mesi'],
    ['ultimi6', 'Ultimi 6 mesi'],
    ['anno', 'Anno (gen–dic)'],
  ];

  function defaultDash() {
    const t = new Date();
    return { year: t.getFullYear(), month: t.getMonth() + 1, q: Math.floor(t.getMonth() / 3) + 1, period: 'mese' };
  }

  function dash() {
    if (!App.ui.dash) App.ui.dash = defaultDash();
    return App.ui.dash;
  }

  function periodSpec(d) {
    switch (d.period) {
      case 'trimestre': return { type: 'trimestre', year: d.year, q: d.q };
      case 'ultimi3': return { type: 'ultimi', year: d.year, month: d.month, n: 3 };
      case 'ultimi6': return { type: 'ultimi', year: d.year, month: d.month, n: 6 };
      case 'anno': return { type: 'anno', year: d.year };
      default: return { type: 'mese', year: d.year, month: d.month };
    }
  }

  // Anni selezionabili: dal primo dato registrato (o anno corrente) fino all'anno prossimo
  function yearOptions() {
    const s = App.state;
    const years = [
      ...s.invoices.map((i) => Number(i.issueDate.slice(0, 4))),
      ...s.payments.map((p) => Number(p.date.slice(0, 4))),
      ...s.expenses.map((e) => Number(e.date.slice(0, 4))),
      new Date().getFullYear(),
    ].filter((y) => Number.isFinite(y));
    const min = Math.min(...years);
    const max = Math.max(...years) + 1;
    const out = [];
    for (let y = min; y <= max; y++) out.push(y);
    return out;
  }

  // Formato compatto per gli assi del grafico (es. 12,5k)
  const compact = (cents) => {
    const eur = (Number(cents) || 0) / 100;
    if (Math.abs(eur) >= 1000) return `${(eur / 1000).toLocaleString('it-IT', { maximumFractionDigits: 1 })}k`;
    return eur.toLocaleString('it-IT', { maximumFractionDigits: 0 });
  };

  function delta(curr, prev, { invert = false } = {}) {
    const pct = Core.pctChange(curr, prev);
    if (pct === null) return `<span class="delta muted">nessun dato nel periodo precedente</span>`;
    if (pct === 0) return `<span class="delta muted">invariato rispetto al precedente</span>`;
    const good = invert ? pct < 0 : pct > 0;
    return `<span class="delta ${good ? 'good' : 'bad'}">${pct > 0 ? '▲' : '▼'} ${esc(Core.formatPercent(pct))} vs periodo precedente</span>`;
  }

  function kpi(label, value, extra = '', tone = '') {
    return `<article class="kpi ${tone}"><span class="kpi-label">${esc(label)}</span><strong class="kpi-value">${esc(value)}</strong>${extra}</article>`;
  }

  function barChart(year, selectedMonths, byMonth) {
    const W = 760;
    const H = 300;
    const left = 52;
    const top = 16;
    const bottom = 34;
    const plotH = H - top - bottom;
    const months = Core.monthsOfYear(year);
    const max = Math.max(1, ...months.map((m) => Math.max(byMonth[m].fatturato, byMonth[m].incassato)));
    const slot = (W - left - 8) / 12;
    const barW = slot * 0.34;
    let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Fatturato e incassi per mese nel ${year}">`;
    for (let i = 0; i <= 4; i++) {
      const v = (max * i) / 4;
      const y = top + plotH - (plotH * i) / 4;
      svg += `<line class="grid" x1="${left}" x2="${W - 8}" y1="${y}" y2="${y}"></line>`;
      svg += `<text class="axis" x="${left - 8}" y="${y + 4}" text-anchor="end">${esc(compact(v))}</text>`;
    }
    months.forEach((m, i) => {
      const x = left + i * slot + slot * 0.13;
      const a = byMonth[m];
      const hF = (plotH * a.fatturato) / max;
      const hI = (plotH * a.incassato) / max;
      const sel = selectedMonths.includes(m) ? ' sel' : '';
      svg += `<rect class="bar-fat${sel}" x="${x}" y="${top + plotH - hF}" width="${barW}" height="${hF}"><title>${esc(Core.monthLabel(m))} · fatturato ${esc(Core.formatEuro(a.fatturato))}</title></rect>`;
      svg += `<rect class="bar-inc${sel}" x="${x + barW + 3}" y="${top + plotH - hI}" width="${barW}" height="${hI}"><title>${esc(Core.monthLabel(m))} · incassato ${esc(Core.formatEuro(a.incassato))}</title></rect>`;
      svg += `<text class="axis" x="${x + barW}" y="${H - 12}" text-anchor="middle">${esc(Core.monthShort(m))}</text>`;
    });
    svg += '</svg>';
    return `${svg}<div class="legend"><span><i class="sw fat"></i>Fatturato (netto IVA)</span><span><i class="sw inc"></i>Incassato</span><span class="muted">Mesi evidenziati: periodo selezionato</span></div>`;
  }

  function controls(d) {
    const years = yearOptions();
    const months = [...Array(12)].map((_, i) => [i + 1, Core.MESI[i][0].toUpperCase() + Core.MESI[i].slice(1)]);
    return `
      <form class="toolbar dash-controls" aria-label="Filtri dashboard">
        <label class="field"><span class="lbl">Periodo</span>
          <select name="period" data-change="dash">${PERIODS.map(([v, l]) => `<option value="${v}"${v === d.period ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>
        </label>
        <label class="field"><span class="lbl">Anno</span>
          <select name="year" data-change="dash">${years.map((y) => `<option value="${y}"${y === d.year ? ' selected' : ''}>${y}</option>`).join('')}</select>
        </label>
        ${d.period === 'trimestre' ? `<label class="field"><span class="lbl">Trimestre</span>
          <select name="q" data-change="dash">${[1, 2, 3, 4].map((q) => `<option value="${q}"${q === d.q ? ' selected' : ''}>${q}° trimestre</option>`).join('')}</select></label>` : ''}
        ${d.period !== 'anno' ? `<label class="field"><span class="lbl">${d.period === 'mese' ? 'Mese' : 'Fino a (incluso)'}</span>
