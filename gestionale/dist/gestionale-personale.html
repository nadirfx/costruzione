          <select name="month" data-change="dash">${months.map(([v, l]) => `<option value="${v}"${v === d.month ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></label>` : ''}
      </form>`;
  }

  function monthTable(year, byMonth, selected) {
    const months = Core.monthsOfYear(year);
    const rows = months.map((m) => {
      const a = byMonth[m];
      const hi = selected.includes(m) ? ' class="sel-row"' : '';
      return `<tr${hi}>
        <td>${esc(Core.monthLabel(m))}</td>
        <td class="num">${a.fatture}</td>
        <td class="num">${esc(Core.formatEuro(a.fatturato))}</td>
        <td class="num">${esc(Core.formatEuro(a.iva))}</td>
        <td class="num">${esc(Core.formatEuro(a.incassato))}</td>
        <td class="num">${esc(Core.formatEuro(a.spese))}</td>
        <td class="num ${a.utileCompetenza < 0 ? 'neg' : ''}">${esc(Core.formatEuro(a.utileCompetenza))}</td>
        <td class="num ${a.utileCassa < 0 ? 'neg' : ''}">${esc(Core.formatEuro(a.utileCassa))}</td>
      </tr>`;
    });
    const t = Core.aggregate(App.data(), months).totals;
    return `<div class="table-wrap"><table class="table">
      <thead><tr><th>Mese</th><th class="num">Fatture</th><th class="num">Fatturato</th><th class="num">IVA</th><th class="num">Incassato</th><th class="num">Spese</th><th class="num">Utile competenza</th><th class="num">Utile cassa</th></tr></thead>
      <tbody>${rows.join('')}</tbody>
      <tfoot><tr><th>Totale anno</th><td class="num">${t.fatture}</td><td class="num">${esc(Core.formatEuro(t.fatturato))}</td><td class="num">${esc(Core.formatEuro(t.iva))}</td><td class="num">${esc(Core.formatEuro(t.incassato))}</td><td class="num">${esc(Core.formatEuro(t.spese))}</td><td class="num">${esc(Core.formatEuro(t.utileCompetenza))}</td><td class="num">${esc(Core.formatEuro(t.utileCassa))}</td></tr></tfoot>
    </table></div>`;
  }

  function quarterTable(year) {
    const rows = [1, 2, 3, 4].map((q) => {
      const months = Core.resolvePeriod({ type: 'trimestre', year, q }).months;
      const t = Core.aggregate(App.data(), months).totals;
      return `<tr>
        <td>${q}° trimestre</td>
        <td class="num">${esc(Core.formatEuro(t.fatturato))}</td>
        <td class="num">${esc(Core.formatEuro(t.incassato))}</td>
        <td class="num">${esc(Core.formatEuro(t.spese))}</td>
        <td class="num ${t.utileCompetenza < 0 ? 'neg' : ''}">${esc(Core.formatEuro(t.utileCompetenza))}</td>
      </tr>`;
    });
    return `<div class="table-wrap"><table class="table"><thead><tr><th>Trimestre</th><th class="num">Fatturato</th><th class="num">Incassato</th><th class="num">Spese</th><th class="num">Utile competenza</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
  }

  function scadenze(today) {
    const overdue = Core.overdueInvoices(App.data(), today).slice(0, 6);
    const soon = App.data().invoices
      .filter((i) => i.stato === 'emessa')
      .map((i) => ({ inv: i, st: Core.invoiceState(i, App.state.payments, today) }))
      .filter((x) => !x.st.overdue && x.st.residuo > 0 && x.inv.dueDate >= today && x.inv.dueDate <= Core.addDays(today, 14))
      .sort((a, b) => (a.inv.dueDate < b.inv.dueDate ? -1 : 1))
      .slice(0, 6);
    const line = ({ inv, st }) => {
      const c = App.byId('clients', inv.clientId);
      return `<li><a href="#/fatture/${esc(inv.id)}">${esc(inv.number)}</a> · ${esc(c ? clientName(c) : '—')} · scade ${esc(fmtDate(inv.dueDate))}<span class="right">${esc(Core.formatEuro(st.residuo))}</span></li>`;
    };
    return `
      <section class="card">
        <h3>Scadenze</h3>
        ${overdue.length ? `<p class="label-danger">Scadute</p><ul class="plain-list">${overdue.map(line).join('')}</ul>` : '<p class="muted">Nessuna fattura scaduta.</p>'}
        ${soon.length ? `<p class="label-info">Nei prossimi 14 giorni</p><ul class="plain-list">${soon.map(line).join('')}</ul>` : ''}
      </section>`;
  }

  function fiscalYear(year) {
    const cfg = App.settings().fiscal || {};
    const ricavi = Fiscale.ricaviIncassati(App.data(), year);
    return Fiscale.taxEstimate({ anno: year, ricaviCents: ricavi, cfg });
  }

  // Task aperti: prima quelli in ritardo, poi quelli di oggi e i prossimi
  function taskCard(today) {
    const open = App.state.tasks.filter((t) => t.stato !== 'fatto');
    const order = { scaduto: 0, oggi: 1, prossimo: 2, senza: 3 };
    const list = open
      .map((t) => ({ t, b: Fiscale.taskBucket(t, today) }))
      .sort((a, b) => (order[a.b] - order[b.b]) || ((a.t.scadenza || '9999') < (b.t.scadenza || '9999') ? -1 : 1))
      .slice(0, 7);
    const late = open.filter((t) => t.scadenza && t.scadenza < today).length;
    const rows = list.map(({ t, b }) => `<li class="task ${b}">
        <button type="button" class="check-btn" data-action="task-toggle" data-id="${esc(t.id)}" aria-label="Segna fatto"></button>
        <div class="task-body"><b>${esc(t.titolo)}</b><div class="muted small-note">${t.scadenza ? esc(fmtDate(t.scadenza)) : 'senza scadenza'}</div></div>
        <span class="badge ${b === 'scaduto' ? 'danger' : b === 'oggi' ? 'info' : 'muted'}">${b === 'scaduto' ? 'in ritardo' : b === 'oggi' ? 'oggi' : Fiscale.PRIORITA[t.priorita] || ''}</span>
      </li>`).join('');
    return `
      <section class="card">
        <div class="section-head"><h3>Da fare ${late ? `<span class="count">${late} in ritardo</span>` : ''}</h3>
          <a class="btn small" href="#/task">Tutti i task</a></div>
        ${rows ? `<ul class="task-list">${rows}</ul>` : UI.empty('Nessun task aperto. Ottimo.')}
      </section>`;
  }

  function clientName(c) {
    return c.tipo === 'azienda' ? c.ragioneSociale : `${c.nome || ''} ${c.cognome || ''}`.trim();
  }

  function topClientsCard(from, to) {
    const top = Core.topClients(App.data(), from, to, 5);
    if (!top.length) return `<section class="card"><h3>Top clienti</h3><p class="muted">Nessuna fattura emessa nel periodo.</p></section>`;
    const max = top[0].fatturato || 1;
    return `<section class="card"><h3>Top clienti nel periodo</h3><ul class="bars-list">${top.map((t) => {
      const c = App.byId('clients', t.clientId);
      const pct = Math.round((t.fatturato / max) * 100);
      return `<li><div class="bars-row"><span>${esc(c ? clientName(c) : '—')}</span><b>${esc(Core.formatEuro(t.fatturato))}</b></div><div class="meter"><i style="width:${pct}%"></i></div></li>`;
    }).join('')}</ul></section>`;
  }

  V.dashboard = () => {
    const d = dash();
    const today = App.today();
    const spec = periodSpec(d);
    const period = Core.resolvePeriod(spec);
    const cur = Core.aggregate(App.data(), period.months).totals;
    const prev = Core.aggregate(App.data(), period.previousMonths).totals;
    const yearAgg = Core.aggregate(App.data(), Core.monthsOfYear(d.year));
    const rec = Core.receivablesSummary(App.data());
    const overdue = Core.overdueInvoices(App.data(), today);
    const overdueSum = overdue.reduce((s, x) => s + x.st.residuo, 0);
    const emesse = cur.fatture;

    const kpis = [
      kpi('Fatturato (netto IVA)', Core.formatEuro(cur.fatturato), delta(cur.fatturato, prev.fatturato), 'accent'),
      kpi('Incassato', Core.formatEuro(cur.incassato), delta(cur.incassato, prev.incassato)),
      kpi('Spese', Core.formatEuro(cur.spese), delta(cur.spese, prev.spese, { invert: true })),
      kpi('Utile (competenza)', Core.formatEuro(cur.utileCompetenza), `<span class="delta muted">fatturato − spese</span>`, cur.utileCompetenza < 0 ? 'bad' : ''),
      kpi('Utile (cassa)', Core.formatEuro(cur.utileCassa), `<span class="delta muted">incassato − spese</span>`, cur.utileCassa < 0 ? 'bad' : ''),
      kpi('IVA su fatturato', Core.formatEuro(cur.iva), `<span class="delta muted">${emesse} fatture emesse nel periodo</span>`),
    ].join('');

    const global = [
      kpi('Da incassare', Core.formatEuro(rec.daIncassare), `<span class="delta muted">saldo positivo di tutti i clienti</span>`, rec.daIncassare > 0 ? 'warn' : ''),
      kpi('Acconti / crediti', Core.formatEuro(rec.crediti), `<span class="delta muted">incassato in più del dovuto</span>`),
      kpi('Fatture scadute', `${overdue.length}`, `<span class="delta ${overdue.length ? 'bad' : 'muted'}">${esc(Core.formatEuro(overdueSum))} da incassare</span>`, overdue.length ? 'bad' : ''),
      kpi('Patrimonio personale', Core.formatEuro(App.patrimonio().totale), `<span class="delta muted">conto ${esc(Core.formatEuro(App.patrimonio().conto))} · ETF ${esc(Core.formatEuro(App.patrimonio().etf))}</span>`, 'accent'),
      kpi(`Da versare ${d.year} (stima)`, Core.formatEuro(fiscalYear(d.year).totaleDaPagare), `<span class="delta muted">contributi + imposta sugli incassi</span>`),
    ].join('');

    const backup = App.settings().lastBackupAt ? `ultimo backup ${esc(fmtDate(App.settings().lastBackupAt.slice(0, 10)))}` : 'nessun backup ancora';

    return `
      <header class="page-head">
        <div>
          <p class="eyebrow">Oggi ${esc(fmtDate(today))}</p>
          <h1>Dashboard</h1>
          <p class="muted">${esc(period.label)}</p>
        </div>
        <div class="head-actions">
          <a class="btn primary" href="#/fatture/nuova">+ Nuova fattura</a>
          <a class="btn" href="#/incassi">Registra incasso</a>
        </div>
      </header>
      ${controls(d)}
      <section class="kpi-grid" aria-label="Indicatori del periodo">${kpis}</section>
      <section class="kpi-grid small" aria-label="Situazione crediti">${global}</section>
      <p class="muted small-note">${backup} · Importi in euro. Fatturato = imponibile delle fatture emesse nel mese della data di emissione. Incassato = pagamenti registrati nel mese della data di pagamento.</p>

      <section class="card">
        <h3>Andamento ${d.year}</h3>
        ${barChart(d.year, period.months, yearAgg.byMonth)}
      </section>

      <div class="two-col">
        <section class="card">
          <h3>Trimestri ${d.year}</h3>
          ${quarterTable(d.year)}
        </section>
        ${topClientsCard(period.from, period.to)}
      </div>

      <section class="card">
        <h3>Dettaglio mese per mese · ${d.year}</h3>
        ${monthTable(d.year, yearAgg.byMonth, period.months)}
      </section>

      ${taskCard(today)}

      <div class="two-col">${scadenze(today)}
        <section class="card">
          <h3>Confronto</h3>
          <p>Il periodo <b>${esc(period.label)}</b> confrontato con quello precedente di uguale durata.</p>
          <ul class="plain-list">
            <li>Fatturato precedente: <b>${esc(Core.formatEuro(prev.fatturato))}</b></li>
            <li>Incassato precedente: <b>${esc(Core.formatEuro(prev.incassato))}</b></li>
            <li>Spese precedenti: <b>${esc(Core.formatEuro(prev.spese))}</b></li>
          </ul>
        </section>
      </div>`;
  };

  App.changes.dash = (el) => {
    const d = dash();
    const v = el.value;
    if (el.name === 'period') d.period = v;
    else if (el.name === 'year') d.year = Number(v);
    else if (el.name === 'month') d.month = Number(v);
    else if (el.name === 'q') d.q = Number(v);
    App.refresh();
  };

  // Esposto per i test e per l'eventuale uso da altre viste
  App.dashboardInternals = { periodSpec, defaultDash, yearOptions, compact, clientName };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
  <script>
/* js/views-clienti.js */
/*
 * Clienti: elenco, anagrafica, scheda cliente con schede (panoramica, progetti,
 * fatture, pagamenti, documenti, attività). Un cliente con fatture o incassi
 * non si elimina: si archivia, così lo storico resta intatto.
 */
(function (root) {
  'use strict';

  const { Core, DB, UI, App } = root;
  const { esc, fmtDate, badge } = UI;
  const V = App.views;

  const CLIENT_FIELDS = [
    { name: 'tipo', label: 'Tipo', type: 'select', options: [['privato', 'Privato'], ['azienda', 'Azienda / libero professionista']], required: true, empty: false, full: true },
    { name: 'nome', label: 'Nome' },
    { name: 'cognome', label: 'Cognome' },
    { name: 'ragioneSociale', label: 'Ragione sociale (aziende)', full: true },
    { name: 'partitaIva', label: 'Partita IVA', hint: '11 cifre, controllata automaticamente' },
    { name: 'codiceFiscale', label: 'Codice fiscale' },
    { name: 'email', label: 'Email', type: 'text' },
    { name: 'pec', label: 'PEC' },
    { name: 'sdi', label: 'Codice SDI', hint: '7 caratteri, fatturazione elettronica' },
    { name: 'telefono', label: 'Telefono', type: 'text' },
    { name: 'indirizzo', label: 'Indirizzo', full: true },
    { name: 'cap', label: 'CAP' },
    { name: 'citta', label: 'Città' },
    { name: 'provincia', label: 'Provincia', placeholder: 'es. MI' },
    { name: 'note', label: 'Note', type: 'textarea', full: true },
  ];

  const PROJECT_FIELDS = [
    { name: 'titolo', label: 'Titolo progetto', required: true, full: true, placeholder: 'es. Spot prodotto estate 2026' },
    { name: 'servizio', label: 'Tipo di lavoro', placeholder: 'es. Video, spot AI, montaggio' },
    { name: 'stato', label: 'Stato', type: 'select', options: Object.entries(Core.STATI_PROGETTO), required: true, empty: false },
    { name: 'budget', label: 'Budget (€)', type: 'money' },
    { name: 'dataInizio', label: 'Data inizio', type: 'date' },
    { name: 'dataConsegna', label: 'Data consegna', type: 'date' },
    { name: 'note', label: 'Note', type: 'textarea', full: true },
  ];

  const ACTIVITY_FIELDS = [
    { name: 'tipo', label: 'Tipo', type: 'select', options: Object.entries(Core.TIPI_ATTIVITA), required: true, empty: false },
    { name: 'date', label: 'Data', type: 'date', required: true },
    { name: 'testo', label: 'Cosa è successo / cosa hai fatto', type: 'textarea', required: true, full: true },
  ];

  const FILE_FIELDS = [
    { name: 'file', label: 'File', type: 'file', required: true, full: true, hint: 'PDF, immagini, video… massimo 25 MB' },
    { name: 'kind', label: 'Tipo documento', type: 'select', options: Object.entries(Core.TIPI_DOCUMENTO), required: true, empty: false },
    { name: 'date', label: 'Data del documento', type: 'date', required: true },
    { name: 'scadenza', label: 'Scadenza (facoltativa)', type: 'date', hint: 'Utile per contratti con rinnovo' },
    { name: 'note', label: 'Note', full: true },
  ];

  /* ------------------------------ Helpers ------------------------------ */
  const clientName = (c) => (c.tipo === 'azienda' ? c.ragioneSociale || '(senza nome)' : `${c.nome || ''} ${c.cognome || ''}`.trim() || '(senza nome)');

  const clientOf = (id) => App.byId('clients', id);

  function clientIdentity(c) {
    return c.tipo === 'azienda' ? c.partitaIva || '' : c.codiceFiscale || '';
  }

  function clientOptions(selectedId) {
    return App.state.clients
      .filter((c) => !c.archiviato || c.id === selectedId)
      .slice()
      .sort((a, b) => clientName(a).localeCompare(clientName(b), 'it'))
      .map((c) => [c.id, clientName(c)]);
  }

  function normalizeClient(v) {
    const out = { ...v };
    for (const k of ['nome', 'cognome', 'ragioneSociale', 'email', 'pec', 'telefono', 'indirizzo', 'cap', 'citta', 'provincia', 'sdi', 'note']) {
      if (typeof out[k] === 'string') out[k] = out[k].trim();
    }
    out.partitaIva = (out.partitaIva || '').replace(/\s/g, '');
    out.codiceFiscale = (out.codiceFiscale || '').replace(/\s/g, '').toUpperCase();
    out.sdi = (out.sdi || '').toUpperCase();
    out.provincia = (out.provincia || '').toUpperCase();
    if (out.tipo === 'privato') {
      out.ragioneSociale = '';
      out.partitaIva = out.partitaIva || '';
    }
    return out;
  }

  function fileRow(f) {
    const kind = Core.TIPI_DOCUMENTO[f.kind] || 'Documento';
    const scad = f.scadenza ? ` · scade ${fmtDate(f.scadenza)}` : '';
    const size = f.size ? ` · ${(f.size / 1024 / 1024).toFixed(2).replace('.', ',')} MB` : '';
    return `<li class="file-row">
      <div><b>${esc(f.name)}</b><div class="muted small-note">${esc(kind)} · ${esc(fmtDate(f.date))}${esc(scad)}${esc(size)}</div>${f.note ? `<div class="small-note">${esc(f.note)}</div>` : ''}</div>
      <div class="row-actions">
        <button type="button" class="btn small" data-action="file-download" data-id="${esc(f.id)}">Apri / scarica</button>
        <button type="button" class="btn small danger ghost" data-action="file-delete" data-id="${esc(f.id)}">Elimina</button>
      </div></li>`;
  }

  /* ------------------------------ Elenco clienti ------------------------------ */
  function clientRows(search, showArchived) {
    const q = (search || '').trim().toLowerCase();
    const data = App.data();
    const rows = App.state.clients
      .filter((c) => showArchived || !c.archiviato)
      .filter((c) => !q || `${clientName(c)} ${clientIdentity(c)} ${c.email || ''} ${c.citta || ''}`.toLowerCase().includes(q))
      .map((c) => ({ c, b: Core.clientBalance(c.id, data) }))
      .sort((a, b) => clientName(a.c).localeCompare(clientName(b.c), 'it'));
    if (!rows.length) return `<tr><td colspan="6">${UI.empty(q ? 'Nessun cliente corrisponde alla ricerca.' : 'Nessun cliente. Aggiungine uno con “Nuovo cliente”.')}</td></tr>`;
    return rows.map(({ c, b }) => `
      <tr class="click" data-href="#/clienti/${esc(c.id)}">
        <td><a href="#/clienti/${esc(c.id)}">${esc(clientName(c))}</a>${c.archiviato ? ' ' + badge('muted', 'Archiviato') : ''}
          <div class="muted small-note">${esc(c.tipo === 'azienda' ? 'Azienda' : 'Privato')}${c.citta ? ' · ' + esc(c.citta) : ''}</div></td>
        <td class="mono">${esc(clientIdentity(c) || '—')}</td>
        <td class="num">${esc(Core.formatEuro(b.imponibile))}</td>
        <td class="num">${esc(Core.formatEuro(b.incassato))}</td>
        <td class="num ${b.saldo > 0 ? 'warn-text' : ''}">${esc(Core.formatEuro(b.saldo))}</td>
        <td class="num"><button type="button" class="btn small ghost" data-action="client-edit" data-id="${esc(c.id)}">Modifica</button></td>
      </tr>`).join('');
  }

  V.clientiList = () => {
    const hasArchived = App.state.clients.some((c) => c.archiviato);
    return `
      <header class="page-head">
        <div><p class="eyebrow">Anagrafica</p><h1>Clienti</h1>
          <p class="muted">${App.state.clients.filter((c) => !c.archiviato).length} clienti attivi</p></div>
        <div class="head-actions"><button type="button" class="btn primary" data-action="client-new">+ Nuovo cliente</button></div>
      </header>
      <div class="toolbar">
        <label class="field grow"><span class="lbl">Cerca</span>
          <input type="search" placeholder="Nome, P.IVA, email, città…" value="${esc(App.ui.clientSearch)}" data-input="client-search" aria-label="Cerca cliente"></label>
        ${hasArchived ? `<label class="check"><input type="checkbox" data-change="client-archived"${App.ui.showArchived ? ' checked' : ''}> Mostra archiviati</label>` : ''}
      </div>
      <div class="table-wrap"><table class="table">
        <thead><tr><th>Cliente</th><th>P.IVA / CF</th><th class="num">Fatturato</th><th class="num">Incassato</th><th class="num">Saldo</th><th></th></tr></thead>
        <tbody id="client-rows">${clientRows(App.ui.clientSearch, App.ui.showArchived)}</tbody>
      </table></div>
      <p class="muted small-note">Fatturato = imponibile delle fatture emesse. Saldo = fatturato lordo − incassato: positivo se ti deve ancora pagare, negativo se ha pagato in anticipo.</p>`;
  };

  App.inputs['client-search'] = (el) => {
    App.ui.clientSearch = el.value;
    const tbody = UI.$('#client-rows');
    if (tbody) tbody.innerHTML = clientRows(App.ui.clientSearch, App.ui.showArchived);
  };

  App.changes['client-archived'] = (el) => {
    App.ui.showArchived = el.checked;
    App.refresh();
  };

  // Riga cliccabile (senza rompere i link e i pulsanti interni)
  document.addEventListener('click', (e) => {
    const tr = e.target.closest('tr[data-href]');
    if (!tr || e.target.closest('a, button, input, select, textarea')) return;
    location.hash = tr.dataset.href.replace('#', '');
  });

  /* ------------------------------ Anagrafica (modale) ------------------------------ */
  function openClientModal(client) {
    const isNew = !client;
    const values = client ? client : { tipo: 'privato' };
    UI.modal({
      title: isNew ? 'Nuovo cliente' : `Modifica · ${clientName(client)}`,
      size: 'wide',
      body: `
        <form data-form="client" data-id="${esc(client ? client.id : '')}" novalidate>
          ${UI.fieldsHTML(CLIENT_FIELDS, values)}
          <div class="form-actions">
            <button type="button" class="btn ghost" data-modal-close>Annulla</button>
            <button type="submit" class="btn primary">Salva cliente</button>
          </div>
        </form>`,
    });
  }

  App.actions['client-new'] = () => openClientModal(null);
  App.actions['client-edit'] = (el, e) => {
    if (e) e.stopPropagation();
    openClientModal(clientOf(el.dataset.id));
  };

  App.forms.client = (form) =>
    UI.guard(form, async () => {
      const { values, errors } = UI.readFields(form, CLIENT_FIELDS);
      const existing = form.dataset.id ? clientOf(form.dataset.id) : null;
      const rec = normalizeClient({ ...values, ...(existing ? { archiviato: existing.archiviato } : {}), id: existing ? existing.id : undefined });
      const all = [...errors, ...Core.validateClient(rec)];
      if (all.length) return UI.showErrors(form, all);
      const saved = await App.save('clients', { ...(existing || {}), ...rec });
      UI.closeModalOf(form);
      UI.toast(existing ? 'Cliente aggiornato' : 'Cliente creato');
      App.refresh();
      location.hash = `#/clienti/${saved.id}`;
    });

  /* ------------------------------ Scheda cliente ------------------------------ */
  const TABS = [
    ['panoramica', 'Panoramica'],
    ['progetti', 'Progetti'],
    ['fatture', 'Fatture'],
    ['pagamenti', 'Pagamenti'],
    ['documenti', 'Documenti'],
    ['attivita', 'Attività'],
  ];

  function tabCount(tab, id) {
    const s = App.state;
    switch (tab) {
      case 'progetti': return s.projects.filter((p) => p.clientId === id).length;
      case 'fatture': return s.invoices.filter((i) => i.clientId === id).length;
      case 'pagamenti': return s.payments.filter((p) => p.clientId === id).length;
      case 'documenti': return s.files.filter((f) => f.clientId === id).length;
      case 'attivita': return s.activities.filter((a) => a.clientId === id).length;
      default: return null;
    }
  }

  function tabPanoramica(c) {
    const rows = [
      ['Tipo', c.tipo === 'azienda' ? 'Azienda / libero professionista' : 'Privato'],
      ['Ragione sociale', c.ragioneSociale],
      ['Partita IVA', c.partitaIva],
      ['Codice fiscale', c.codiceFiscale],
      ['Email', c.email],
      ['PEC', c.pec],
      ['Codice SDI', c.sdi],
      ['Telefono', c.telefono],
      ['Indirizzo', [c.indirizzo, [c.cap, c.citta, c.provincia].filter(Boolean).join(' ')].filter(Boolean).join(', ')],
    ].filter(([, v]) => v);
    return `
      <div class="two-col">
        <section class="card">
          <h3>Anagrafica</h3>
          ${rows.length ? `<dl class="dl">${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` : UI.empty('Nessun dato anagrafico. Usa “Modifica”.')}
        </section>
        <section class="card">
          <h3>Note</h3>
          <form data-form="client-note" data-id="${esc(c.id)}">
            <textarea name="note" rows="8" aria-label="Note cliente" placeholder="Preferenze, storia, cose da ricordare…">${esc(c.note || '')}</textarea>
            <div class="form-actions"><button type="submit" class="btn">Salva note</button></div>
          </form>
        </section>
      </div>`;
  }

  function tabProgetti(c) {
    const projects = App.state.projects.filter((p) => p.clientId === c.id).sort((a, b) => (a.dataInizio || '') < (b.dataInizio || '') ? 1 : -1);
    const rows = projects.map((p) => {
      const invs = App.state.invoices.filter((i) => i.projectId === p.id && i.stato !== 'bozza' && i.stato !== 'annullata');
      const imp = invs.reduce((s, i) => s + Core.invoiceTotals(i).imponibile, 0);
      const inc = invs.reduce((s, i) => s + Core.paidOnInvoice(i.id, App.state.payments), 0);
      return `<tr>
        <td><b>${esc(p.titolo)}</b><div class="muted small-note">${esc(p.servizio || '')}</div></td>
        <td>${badge(p.stato, Core.STATI_PROGETTO[p.stato] || p.stato)}</td>
        <td>${esc(fmtDate(p.dataInizio))} → ${esc(fmtDate(p.dataConsegna))}</td>
        <td class="num">${p.budgetCents ? esc(Core.formatEuro(p.budgetCents)) : '—'}</td>
        <td class="num">${esc(Core.formatEuro(imp))}</td>
        <td class="num">${esc(Core.formatEuro(inc))}</td>
        <td class="num row-actions">
          <button type="button" class="btn small ghost" data-action="project-edit" data-id="${esc(p.id)}">Modifica</button>
          <button type="button" class="btn small ghost danger" data-action="project-delete" data-id="${esc(p.id)}">Elimina</button>
        </td></tr>`;
    });
    return `
      <div class="section-head"><h3>Progetti</h3>
        <button type="button" class="btn primary small" data-action="project-new" data-client="${esc(c.id)}">+ Nuovo progetto</button></div>
      ${rows.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Progetto</th><th>Stato</th><th>Date</th><th class="num">Budget</th><th class="num">Fatturato</th><th class="num">Incassato</th><th></th></tr></thead><tbody>${rows.join('')}</tbody></table></div>` : UI.empty('Nessun progetto per questo cliente.')}`;
  }

  function tabFatture(c) {
    const list = App.state.invoices.filter((i) => i.clientId === c.id).sort((a, b) => (a.issueDate < b.issueDate ? 1 : -1));
    const today = App.today();
    const rows = list.map((i) => {
      const st = Core.invoiceState(i, App.state.payments, today);
      return `<tr class="click" data-href="#/fatture/${esc(i.id)}">
        <td><a href="#/fatture/${esc(i.id)}">${esc(i.number)}</a></td>
        <td>${esc(fmtDate(i.issueDate))}</td>
        <td>${esc(fmtDate(i.dueDate))}</td>
        <td class="num">${esc(Core.formatEuro(st.totale))}</td>
        <td class="num">${esc(Core.formatEuro(st.paid))}</td>
        <td>${badge(st.code, st.label)}</td></tr>`;
    });
    return `
      <div class="section-head"><h3>Fatture</h3>
        <a class="btn primary small" href="#/fatture/nuova" data-action="invoice-prefill" data-client="${esc(c.id)}">+ Nuova fattura</a></div>
      ${rows.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Numero</th><th>Emissione</th><th>Scadenza</th><th class="num">Totale</th><th class="num">Incassato</th><th>Stato</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>` : UI.empty('Nessuna fattura per questo cliente.')}`;
  }

  function tabPagamenti(c) {
    const list = App.state.payments.filter((p) => p.clientId === c.id).sort((a, b) => (a.date < b.date ? 1 : -1));
    const rows = list.map((p) => {
      const inv = p.invoiceId ? App.byId('invoices', p.invoiceId) : null;
      const files = App.state.files.filter((f) => f.relatedId === p.id).length;
      return `<tr>
        <td>${esc(fmtDate(p.date))}</td>
        <td>${inv ? `<a href="#/fatture/${esc(inv.id)}">${esc(inv.number)}</a>` : '<span class="muted">acconto generico</span>'}</td>
        <td>${esc(p.metodo || '—')}</td>
        <td class="num"><b>${esc(Core.formatEuro(p.amountCents))}</b></td>
        <td>${files ? `<span class="muted">${files} ricevuta</span>` : ''}</td>
        <td class="num row-actions">
          <button type="button" class="btn small ghost" data-action="payment-edit" data-id="${esc(p.id)}">Modifica</button>
          <button type="button" class="btn small ghost danger" data-action="payment-delete" data-id="${esc(p.id)}">Elimina</button>
        </td></tr>`;
    });
    return `
      <div class="section-head"><h3>Pagamenti ricevuti</h3>
        <button type="button" class="btn primary small" data-action="payment-new" data-client="${esc(c.id)}">+ Registra incasso</button></div>
      ${rows.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Data</th><th>Fattura</th><th>Metodo</th><th class="num">Importo</th><th></th><th></th></tr></thead><tbody>${rows.join('')}</tbody></table></div>` : UI.empty('Nessun pagamento registrato.')}`;
  }

  function tabDocumenti(c) {
    const invoices = App.state.invoices.filter((i) => i.clientId === c.id);
    const files = App.state.files.filter((f) => f.clientId === c.id).sort((a, b) => (a.date < b.date ? 1 : -1));
    const invOptions = invoices.map((i) => [i.id, `${i.number} · ${fmtDate(i.issueDate)}`]);
    const fields = [
      ...FILE_FIELDS,
      ...(invOptions.length ? [{ name: 'invoiceId', label: 'Collegato a una fattura (facoltativo)', type: 'select', options: invOptions, full: true, empty: '— nessuna —' }] : []),
    ];
    App.ui.fileFields = fields;
    return `
      <section class="card">
        <h3>Carica un documento</h3>
        <p class="muted small-note">Contratti firmati, brief, ricevute, fatture PDF. I file restano solo su questo computer, dentro il gestionale.</p>
        <form data-form="file-upload" data-client="${esc(c.id)}">
          ${UI.fieldsHTML(fields, { date: App.today(), kind: 'contratto' })}
          <div class="form-actions"><button type="submit" class="btn primary">Carica documento</button></div>
        </form>
      </section>
      <section class="card">
        <h3>Documenti (${files.length})</h3>
        ${files.length ? `<ul class="file-list">${files.map(fileRow).join('')}</ul>` : UI.empty('Nessun documento caricato.')}
      </section>`;
  }

  function tabAttivita(c) {
    const list = App.state.activities.filter((a) => a.clientId === c.id).sort((a, b) => (a.date < b.date ? 1 : -1) || (a.createdAt < b.createdAt ? 1 : -1));
    return `
      <div class="section-head"><h3>Attività e cronologia</h3>
        <button type="button" class="btn primary small" data-action="activity-new" data-client="${esc(c.id)}">+ Aggiungi attività</button></div>
      ${list.length ? `<ol class="timeline">${list.map((a) => `
        <li>
          <div class="tl-meta"><b>${esc(Core.TIPI_ATTIVITA[a.tipo] || a.tipo)}</b> · ${esc(fmtDate(a.date))}
            <button type="button" class="link-btn danger" data-action="activity-delete" data-id="${esc(a.id)}">elimina</button></div>
          <p>${esc(a.testo)}</p>
        </li>`).join('')}</ol>` : UI.empty('Nessuna attività registrata. Annota chiamate, email, riunioni e consegne.')}`;
  }

  V.clienteDetail = (id) => {
    const c = clientOf(id);
    if (!c) return `<div class="alert warn">Cliente non trovato. <a href="#/clienti">Torna all’elenco</a>.</div>`;
    const data = App.data();
    const b = Core.clientBalance(c.id, data);
    const tab = App.ui.clientTab || 'panoramica';
    const body = {
      panoramica: tabPanoramica,
      progetti: tabProgetti,
      fatture: tabFatture,
      pagamenti: tabPagamenti,
      documenti: tabDocumenti,
      attivita: tabAttivita,
    }[tab](c);
    return `
      <nav class="crumbs"><a href="#/clienti">Clienti</a> / <span>${esc(clientName(c))}</span></nav>
      <header class="page-head">
        <div>
          <p class="eyebrow">${esc(c.tipo === 'azienda' ? 'Azienda' : 'Privato')}${c.archiviato ? ' · archiviato' : ''}</p>
          <h1>${esc(clientName(c))}</h1>
          <p class="muted">${esc([clientIdentity(c) && `${c.tipo === 'azienda' ? 'P.IVA' : 'CF'} ${clientIdentity(c)}`, c.email, c.telefono].filter(Boolean).join(' · ') || 'Nessun contatto')}</p>
        </div>
        <div class="head-actions">
          <button type="button" class="btn" data-action="client-edit" data-id="${esc(c.id)}">Modifica</button>
          <button type="button" class="btn" data-action="client-archive" data-id="${esc(c.id)}">${c.archiviato ? 'Riattiva' : 'Archivia'}</button>
          <button type="button" class="btn danger ghost" data-action="client-delete" data-id="${esc(c.id)}">Elimina</button>
        </div>
      </header>
      <section class="kpi-grid small">
        <article class="kpi"><span class="kpi-label">Fatturato (netto IVA)</span><strong class="kpi-value">${esc(Core.formatEuro(b.imponibile))}</strong></article>
        <article class="kpi"><span class="kpi-label">Fatturato lordo</span><strong class="kpi-value">${esc(Core.formatEuro(b.totale))}</strong></article>
        <article class="kpi"><span class="kpi-label">Incassato</span><strong class="kpi-value">${esc(Core.formatEuro(b.incassato))}</strong></article>
        <article class="kpi ${b.saldo > 0 ? 'warn' : ''}"><span class="kpi-label">${b.saldo < 0 ? 'Acconto a credito' : 'Da incassare'}</span><strong class="kpi-value">${esc(Core.formatEuro(Math.abs(b.saldo)))}</strong></article>
      </section>
      <nav class="tabs" role="tablist">
        ${TABS.map(([k, label]) => {
          const n = tabCount(k, c.id);
          return `<button type="button" role="tab" aria-selected="${k === tab}" class="tab${k === tab ? ' active' : ''}" data-action="client-tab" data-tab="${k}">${esc(label)}${n !== null ? ` <span class="count">${n}</span>` : ''}</button>`;
        }).join('')}
      </nav>
      <section class="tab-body" role="tabpanel">${body}</section>`;
  };

  App.actions['client-tab'] = (el) => {
    App.ui.clientTab = el.dataset.tab;
    App.refresh();
  };

  App.actions['client-archive'] = async (el) => {
    const c = clientOf(el.dataset.id);
    if (!c) return;
    await App.save('clients', { ...c, archiviato: !c.archiviato });
    UI.toast(c.archiviato ? 'Cliente riattivato' : 'Cliente archiviato. Lo storico resta disponibile.');
    App.refresh();
  };

  App.actions['client-delete'] = async (el) => {
    const c = clientOf(el.dataset.id);
    if (!c) return;
    const hasMoney = App.state.invoices.some((i) => i.clientId === c.id) || App.state.payments.some((p) => p.clientId === c.id);
    if (hasMoney) {
      UI.toast('Questo cliente ha fatture o incassi: non si può eliminare. Usa “Archivia”.', 'err');
      return;
    }
    const ok = await UI.confirmDialog({
      title: 'Eliminare il cliente?',
      message: `Eliminerai ${clientName(c)} insieme a progetti, attività e documenti collegati. Operazione non reversibile.`,
      confirmText: 'Elimina definitivamente',
      danger: true,
    });
    if (!ok) return;
    const projects = App.state.projects.filter((p) => p.clientId === c.id);
    const activities = App.state.activities.filter((a) => a.clientId === c.id);
    const files = App.state.files.filter((f) => f.clientId === c.id);
    for (const f of files) await App.removeFile(f.id);
    for (const a of activities) await App.remove('activities', a.id);
    for (const p of projects) await App.remove('projects', p.id);
    await App.remove('clients', c.id);
    UI.toast('Cliente eliminato');
    location.hash = '#/clienti';
  };

  /* ------------------------------ Note ------------------------------ */
  App.forms['client-note'] = (form) =>
    UI.guard(form, async () => {
      const c = clientOf(form.dataset.id);
      if (!c) return;
      await App.save('clients', { ...c, note: form.elements.note.value });
      UI.toast('Note salvate');
      App.refresh();
    });

  /* ------------------------------ Progetti ------------------------------ */
  function openProjectModal(project, clientId) {
    const values = project || { stato: 'in_corso', clientId };
    UI.modal({
      title: project ? 'Modifica progetto' : 'Nuovo progetto',
      size: 'wide',
      body: `
        <form data-form="project" data-id="${esc(project ? project.id : '')}" data-client="${esc(project ? project.clientId : clientId)}" novalidate>
          ${UI.fieldsHTML(PROJECT_FIELDS, { ...values, budget: values.budgetCents })}
          <div class="form-actions"><button type="button" class="btn ghost" data-modal-close>Annulla</button><button type="submit" class="btn primary">Salva progetto</button></div>
        </form>`,
    });
  }

  App.actions['project-new'] = (el) => openProjectModal(null, el.dataset.client);
  App.actions['project-edit'] = (el) => openProjectModal(App.byId('projects', el.dataset.id), null);
  App.actions['project-delete'] = async (el) => {
    const p = App.byId('projects', el.dataset.id);
    if (!p) return;
    if (App.state.invoices.some((i) => i.projectId === p.id)) {
      UI.toast('Il progetto è collegato a delle fatture: non si può eliminare.', 'err');
      return;
    }
    const ok = await UI.confirmDialog({ title: 'Eliminare il progetto?', message: `“${p.titolo}” verrà eliminato.`, confirmText: 'Elimina', danger: true });
    if (!ok) return;
    await App.remove('projects', p.id);
    UI.toast('Progetto eliminato');
    App.refresh();
  };

  App.forms.project = (form) =>
    UI.guard(form, async () => {
      const { values, errors } = UI.readFields(form, PROJECT_FIELDS);
      const existing = form.dataset.id ? App.byId('projects', form.dataset.id) : null;
      const rec = {
        ...(existing || {}),
        clientId: form.dataset.client,
        titolo: values.titolo,
        servizio: values.servizio || '',
        stato: values.stato,
        budgetCents: values.budget === null ? 0 : values.budget,
        dataInizio: values.dataInizio || '',
        dataConsegna: values.dataConsegna || '',
        note: values.note || '',
      };
      // Un lavoro consegnato o chiuso senza data prende la data di oggi: serve per i report dei lavori chiusi
      if (['consegnato', 'chiuso'].includes(rec.stato) && !rec.dataConsegna) rec.dataConsegna = App.today();
      const all = [...errors, ...Core.validateProject(rec, { clients: App.state.clients })];
      if (all.length) return UI.showErrors(form, all);
      await App.save('projects', rec);
      UI.closeModalOf(form);
      UI.toast('Progetto salvato');
      App.refresh();
    });

  /* ------------------------------ Attività ------------------------------ */
  App.actions['activity-new'] = (el) => {
    UI.modal({
      title: 'Nuova attività',
      body: `
        <form data-form="activity" data-client="${esc(el.dataset.client)}" novalidate>
          ${UI.fieldsHTML(ACTIVITY_FIELDS, { tipo: 'nota', date: App.today() })}
          <div class="form-actions"><button type="button" class="btn ghost" data-modal-close>Annulla</button><button type="submit" class="btn primary">Salva</button></div>
        </form>`,
    });
  };

  App.forms.activity = (form) =>
    UI.guard(form, async () => {
      const { values, errors } = UI.readFields(form, ACTIVITY_FIELDS);
      const all = [...errors, ...Core.validateActivity(values)];
      if (all.length) return UI.showErrors(form, all);
      await App.save('activities', { ...values, clientId: form.dataset.client });
      UI.closeModalOf(form);
      UI.toast('Attività salvata');
      App.refresh();
    });

  App.actions['activity-delete'] = async (el) => {
    const ok = await UI.confirmDialog({ title: 'Eliminare l’attività?', message: 'La voce verrà rimossa dalla cronologia.', confirmText: 'Elimina', danger: true });
    if (!ok) return;
    await App.remove('activities', el.dataset.id);
    App.refresh();
  };

  /* ------------------------------ Documenti ------------------------------ */
  App.forms['file-upload'] = (form) =>
    UI.guard(form, async () => {
      const fields = App.ui.fileFields || FILE_FIELDS;
      const { values, errors } = UI.readFields(form, fields);
      const all = [...errors, ...Core.validateFile(values.file)];
      if (values.date && !Core.isValidISODate(values.date)) all.push('Data non valida.');
      if (values.scadenza && !Core.isValidISODate(values.scadenza)) all.push('Scadenza non valida.');
      if (all.length) return UI.showErrors(form, all);
      await App.addFile(
        {
          name: values.file.name,
          kind: values.kind,
          date: values.date,
          scadenza: values.scadenza || '',
          note: values.note || '',
          clientId: form.dataset.client,
          invoiceId: values.invoiceId || '',
          relatedId: values.invoiceId || '',
          relatedType: values.invoiceId ? 'invoice' : 'client',
        },
        values.file
      );
      UI.toast('Documento caricato');
      App.refresh();
    });

  App.actions['file-download'] = async (el) => {
    const f = App.byId('files', el.dataset.id) || App.state.files.find((x) => x.id === el.dataset.id);
    if (!f) return;
    const blob = await DB.getBlob(f.id);
    if (!blob) {
      UI.toast('Contenuto del documento non trovato', 'err');
      return;
    }
    UI.downloadBlob(f.name, blob);
  };

  App.actions['file-delete'] = async (el) => {
    const f = App.state.files.find((x) => x.id === el.dataset.id);
    if (!f) return;
    const ok = await UI.confirmDialog({ title: 'Eliminare il documento?', message: `“${f.name}” verrà cancellato dal computer. Scaricalo prima se ti serve.`, confirmText: 'Elimina', danger: true });
    if (!ok) return;
    await App.removeFile(f.id);
    UI.toast('Documento eliminato');
    App.refresh();
  };

  App.clientName = clientName;
  App.clientIdentity = clientIdentity;
  App.clientOptions = clientOptions;
  App.normalizeClient = normalizeClient;
  App.fileRow = fileRow;
  App.clientOf = clientOf;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
  <script>
/* js/views-fatture.js */
/*
 * Fatture, incassi (pagamenti) e spese.
 * Regole chiave (applicate in core.js):
 *  - una fattura emessa non si cancella: si annulla (il numero resta bruciato);
 *  - si cancella solo una bozza senza incassi;
 *  - un incasso collegato a una fattura non può superare il residuo;
 *  - i numeri fattura sono progressivi per anno e unici.
 */
(function (root) {
  'use strict';

  const { Core, UI, App } = root;
  const { esc, fmtDate, badge } = UI;
  const V = App.views;

  const STATO_FILTRI = [
    ['', 'Tutte'],
    ['emessa', 'Da pagare'],
    ['parziale', 'Pagate in parte'],
    ['scaduta', 'Scadute'],
    ['pagata', 'Pagate'],
    ['bozza', 'Bozze'],
    ['annullata', 'Annullate'],
  ];

  const currentYear = () => new Date().getFullYear();

  function yearChoices() {
    const ys = new Set([currentYear(), currentYear() + 1]);
    for (const i of App.state.invoices) ys.add(Number(i.issueDate.slice(0, 4)));
    for (const p of App.state.payments) ys.add(Number(p.date.slice(0, 4)));
    for (const e of App.state.expenses) ys.add(Number(e.date.slice(0, 4)));
    return [...ys].sort((a, b) => b - a);
  }

  function yearSelect(name, value, changeKey, withAll) {
    const opts = yearChoices().map((y) => `<option value="${y}"${String(y) === String(value) ? ' selected' : ''}>${y}</option>`);
    if (withAll) opts.unshift(`<option value=""${value === '' ? ' selected' : ''}>Tutti gli anni</option>`);
    return `<label class="field"><span class="lbl">Anno</span><select name="${name}" data-change="${changeKey}">${opts.join('')}</select></label>`;
  }

  const invoiceOf = (id) => App.byId('invoices', id);

  function paymentsOf(invoiceId) {
    return App.state.payments.filter((p) => p.invoiceId === invoiceId);
  }

  function projectOptions(clientId) {
    return App.state.projects
      .filter((p) => p.clientId === clientId)
      .map((p) => [p.id, p.titolo]);
  }

  /* ------------------------------ Elenco fatture ------------------------------ */
  function invoiceRows() {
    const today = App.today();
    const year = App.ui.invYear === null ? currentYear() : App.ui.invYear;
    const stato = App.ui.invStato;
    const q = (App.ui.invSearch || '').trim().toLowerCase();
    const list = App.state.invoices
      .filter((i) => year === '' || Number(i.issueDate.slice(0, 4)) === Number(year))
      .map((i) => {
        const c = App.clientOf(i.clientId);
        return { i, c, st: Core.invoiceState(i, App.state.payments, today) };
      })
      .filter(({ st }) => !stato || st.code === stato)
      .filter(({ i, c }) => !q || `${i.number} ${c ? App.clientName(c) : ''}`.toLowerCase().includes(q))
      .sort((a, b) => (a.i.issueDate < b.i.issueDate ? 1 : a.i.issueDate > b.i.issueDate ? -1 : (a.i.number < b.i.number ? 1 : -1)));
    if (!list.length) return `<tr><td colspan="8">${UI.empty('Nessuna fattura con questi filtri.')}</td></tr>`;
    return list.map(({ i, c, st }) => `
      <tr class="click" data-href="#/fatture/${esc(i.id)}">
        <td><a href="#/fatture/${esc(i.id)}"><b>${esc(i.number)}</b></a></td>
        <td>${esc(fmtDate(i.issueDate))}</td>
        <td>${esc(c ? App.clientName(c) : '—')}</td>
        <td>${esc(fmtDate(i.dueDate))}</td>
        <td class="num">${esc(Core.formatEuro(st.totale))}</td>
        <td class="num">${esc(Core.formatEuro(st.paid))}</td>
        <td class="num">${esc(Core.formatEuro(st.residuo > 0 ? st.residuo : 0))}</td>
        <td>${badge(st.code, st.label)}</td>
      </tr>`).join('') + `<tr class="total-row"><td colspan="4"><b>Totale elenco</b></td>${totalsCells(list)}</tr>`;
  }

  function totalsCells(list) {
    const tot = list.reduce((s, x) => s + x.st.totale, 0);
    const paid = list.reduce((s, x) => s + x.st.paid, 0);
    const res = list.reduce((s, x) => s + (x.st.residuo > 0 ? x.st.residuo : 0), 0);
    return `<td class="num"><b>${esc(Core.formatEuro(tot))}</b></td><td class="num"><b>${esc(Core.formatEuro(paid))}</b></td><td class="num"><b>${esc(Core.formatEuro(res))}</b></td><td></td>`;
  }

  V.fattureList = () => {
    const year = App.ui.invYear === null ? currentYear() : App.ui.invYear;
    return `
      <header class="page-head">
        <div><p class="eyebrow">Fatturazione</p><h1>Fatture</h1>
          <p class="muted">Numerazione progressiva per anno. Le fatture annullate restano nell’elenco.</p></div>
        <div class="head-actions"><a class="btn primary" href="#/fatture/nuova">+ Nuova fattura</a></div>
      </header>
      <div class="toolbar">
        ${yearSelect('year', year, 'inv-year', true)}
        <label class="field"><span class="lbl">Stato</span>
          <select name="stato" data-change="inv-stato">${STATO_FILTRI.map(([v, l]) => `<option value="${v}"${v === App.ui.invStato ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></label>
        <label class="field grow"><span class="lbl">Cerca</span>
          <input type="search" value="${esc(App.ui.invSearch)}" placeholder="Numero o cliente…" data-input="inv-search" aria-label="Cerca fattura"></label>
      </div>
      <div class="table-wrap"><table class="table">
        <thead><tr><th>Numero</th><th>Emissione</th><th>Cliente</th><th>Scadenza</th><th class="num">Totale</th><th class="num">Incassato</th><th class="num">Residuo</th><th>Stato</th></tr></thead>
        <tbody id="inv-rows">${invoiceRows()}</tbody>
      </table></div>`;
  };

  App.changes['inv-year'] = (el) => {
    App.ui.invYear = el.value === '' ? '' : Number(el.value);
    App.refresh();
  };
  App.changes['inv-stato'] = (el) => {
    App.ui.invStato = el.value;
    App.refresh();
  };
  App.inputs['inv-search'] = (el) => {
    App.ui.invSearch = el.value;
    const tb = UI.$('#inv-rows');
    if (tb) tb.innerHTML = invoiceRows();
  };

  /* ------------------------------ Form fattura ------------------------------ */
  function rowHTML(r = {}) {
    const qta = r.quantita === undefined || r.quantita === null ? '1' : String(r.quantita).replace('.', ',');
    const prezzo = r.prezzoCents === undefined || r.prezzoCents === null ? '' : Core.centsToPlain(r.prezzoCents);
    return `
      <div class="riga">
        <label class="field grow"><span class="lbl">Descrizione</span>
          <input name="rdesc" value="${esc(r.descrizione || '')}" placeholder="es. Spot video 30 secondi, montaggio, ore AI…" data-required-row></label>
        <label class="field narrow"><span class="lbl">Quantità</span>
          <input name="rqta" value="${esc(qta)}" inputmode="decimal"></label>
        <label class="field narrow"><span class="lbl">Prezzo unitario (€)</span>
          <input name="rprezzo" data-type="money" value="${esc(prezzo)}" inputmode="decimal" placeholder="0,00"></label>
        <div class="riga-tot"><span class="lbl">Importo</span><b data-riga-tot>—</b></div>
        <button type="button" class="btn small ghost danger" data-action="invoice-row-remove" aria-label="Rimuovi riga">✕</button>
      </div>`;
  }

  function parseQta(txt) {
    const s = String(txt || '').trim().replace(',', '.');
    if (s === '') return null;
    const n = Number(s);
    return Number.isFinite(n) ? n : null;
  }

  // Legge le righe dal DOM. Le righe vuote vengono ignorate.
  function rowsFromForm(form) {
    return [...form.querySelectorAll('.riga')]
      .map((row) => ({
        descrizione: row.querySelector('[name="rdesc"]').value.trim(),
        quantita: parseQta(row.querySelector('[name="rqta"]').value),
        prezzoCents: Core.parseEuroToCents(row.querySelector('[name="rprezzo"]').value),
        _raw: row,
      }))
      .filter((r) => r.descrizione || r.quantita !== null || r.prezzoCents !== null);
  }

  function updateTotals(form) {
    const rows = rowsFromForm(form);
    for (const r of rows) {
      const cell = r._raw.querySelector('[data-riga-tot]');
      if (r.quantita !== null && r.prezzoCents !== null) cell.textContent = Core.formatEuro(Math.round(r.quantita * r.prezzoCents));
      else cell.textContent = '—';
    }
    const rate = parseQta(form.elements.ivaRate.value);
    const valid = rows.filter((r) => r.quantita !== null && r.prezzoCents !== null);
    const t = Core.invoiceTotals({ righe: valid, ivaRate: rate === null ? 0 : rate });
    const box = form.querySelector('[data-totals]');
    if (box) {
      box.innerHTML = `
        <div><span>Imponibile</span><b>${esc(Core.formatEuro(t.imponibile))}</b></div>
        <div><span>IVA ${esc(String(rate === null ? 0 : rate).replace('.', ','))}%</span><b>${esc(Core.formatEuro(t.iva))}</b></div>
        <div class="grand"><span>Totale fattura</span><b>${esc(Core.formatEuro(t.totale))}</b></div>`;
    }
  }

  function invoiceFields(clients) {
    return [
      { name: 'clientId', label: 'Cliente', type: 'select', options: clients, required: true, full: false },
      { name: 'projectId', label: 'Progetto (facoltativo)', type: 'select', options: [], empty: '— nessuno —' },
      { name: 'number', label: 'Numero', required: true, hint: 'Formato AAAA/001, progressivo' },
      { name: 'issueDate', label: 'Data emissione', type: 'date', required: true },
      { name: 'dueDate', label: 'Scadenza pagamento', type: 'date', required: true },
      { name: 'ivaRate', label: 'Aliquota IVA %', type: 'number', step: '0.01', min: 0, required: true, hint: 'Usa 0 se in regime forfettario' },
    ];
  }

  V.fatturaForm = (id) => {
    const existing = id ? invoiceOf(id) : null;
    if (id && !existing) return `<div class="alert warn">Fattura non trovata. <a href="#/fatture">Torna all’elenco</a>.</div>`;
    if (existing && existing.stato === 'annullata') return `<div class="alert warn">Le fatture annullate non si modificano. <a href="#/fatture/${esc(existing.id)}">Torna alla fattura</a>.</div>`;
    const s = App.settings();
    const pre = App.ui.prefillClient || '';
    App.ui.prefillClient = null;
    const today = App.today();
    const issueDate = existing ? existing.issueDate : today;
    const clientId = existing ? existing.clientId : pre;
    const values = existing
      ? { ...existing, ivaRate: existing.ivaRate, stato: existing.stato === 'bozza' }
      : {
          clientId,
          projectId: '',
          number: Core.nextInvoiceNumber(Number(issueDate.slice(0, 4)), App.state.invoices),
          issueDate,
          dueDate: Core.addDays(issueDate, s.giorniScadenza || 30),
          ivaRate: s.ivaDefault,
          stato: false,
        };
    const righe = existing ? existing.righe : [{ descrizione: '', quantita: 1, prezzoCents: null }];
    const fields = invoiceFields(App.clientOptions(clientId)).map((f) =>
      f.name === 'projectId' ? { ...f, options: projectOptions(clientId) } : f
    );
    const rowsHTML = righe.map((r) => rowHTML(r)).join('');
    const payments = existing ? paymentsOf(existing.id) : [];
    const paid = payments.reduce((x, p) => x + p.amountCents, 0);
    return `
      <nav class="crumbs"><a href="#/fatture">Fatture</a> / <span>${existing ? esc(existing.number) : 'Nuova'}</span></nav>
      <header class="page-head"><div><p class="eyebrow">${existing ? 'Modifica' : 'Nuova fattura'}</p><h1>${existing ? `Fattura ${esc(existing.number)}` : 'Nuova fattura'}</h1></div></header>
      ${paid > 0 ? `<div class="alert info">Su questa fattura ci sono già incassi per ${esc(Core.formatEuro(paid))}: il totale non può scendere sotto questa cifra.</div>` : ''}
      <form data-form="invoice" data-id="${esc(existing ? existing.id : '')}" data-input="invoice-totals" data-new="${existing ? '0' : '1'}" novalidate class="card">
        ${UI.fieldsHTML(fields, values)}
        <label class="field check"><input type="checkbox" name="stato"${values.stato ? ' checked' : ''}> <span>Salva come bozza (non conta ancora nel fatturato)</span></label>
        <h3 class="mt">Righe</h3>
        <div id="righe">${rowsHTML}</div>
        <div class="form-actions left"><button type="button" class="btn small" data-action="invoice-row-add">+ Aggiungi riga</button></div>
        <div class="totals" data-totals></div>
        <label class="field full"><span class="lbl">Note in fattura (facoltativo)</span>
          <textarea name="note" rows="2" placeholder="es. Pagamento tramite bonifico sul conto indicato">${esc(existing ? existing.note || '' : '')}</textarea></label>
        <div class="form-actions">
          <a class="btn ghost" href="${existing ? `#/fatture/${esc(existing.id)}` : '#/fatture'}">Annulla</a>
          <button type="submit" class="btn primary">${existing ? 'Salva modifiche' : 'Crea fattura'}</button>
        </div>
      </form>
      <template id="riga-tpl">${rowHTML({})}</template>`;
  };

  App.actions['invoice-prefill'] = (el) => {
    App.ui.prefillClient = el.dataset.client;
  };

  App.actions['invoice-row-add'] = (el) => {
    const form = el.closest('form');
    const box = form.querySelector('#righe');
    box.insertAdjacentHTML('beforeend', rowHTML({}));
    updateTotals(form);
    const inputs = box.querySelectorAll('.riga');
    const last = inputs[inputs.length - 1];
    if (last) last.querySelector('[name="rdesc"]').focus();
  };

  App.actions['invoice-row-remove'] = (el) => {
    const form = el.closest('form');
    const rows = form.querySelectorAll('.riga');
    if (rows.length <= 1) {
      el.closest('.riga').querySelectorAll('input').forEach((i) => { i.value = ''; });
    } else {
      el.closest('.riga').remove();
    }
    updateTotals(form);
  };

  // L'handler riceve il form stesso (data-input sul form), non un singolo campo
  App.inputs['invoice-totals'] = (el) => {
    updateTotals(el.tagName === 'FORM' ? el : el.form);
  };

  App.changes['invoice-client'] = (el) => {
    const form = el.form;
    const sel = form.elements.projectId;
    const opts = projectOptions(el.value).map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`);
    sel.innerHTML = `<option value="">— nessuno —</option>${opts.join('')}`;
  };

  // Su nuova fattura: cambiando la data di emissione aggiorniamo numero (anno) e scadenza
  App.changes['invoice-issue'] = (el) => {
    const form = el.form;
    if (form.dataset.new !== '1' || !Core.isValidISODate(el.value)) return;
    const y = Number(el.value.slice(0, 4));
    form.elements.number.value = Core.nextInvoiceNumber(y, App.state.invoices);
    form.elements.dueDate.value = Core.addDays(el.value, App.settings().giorniScadenza || 30);
  };

  App.forms.invoice = (form) =>
    UI.guard(form, async () => {
      const header = UI.readFields(form, invoiceFields([]));
      const existing = form.dataset.id ? invoiceOf(form.dataset.id) : null;
      const rows = rowsFromForm(form);
      const righe = rows.map((r) => ({
        descrizione: r.descrizione,
        quantita: r.quantita,
        prezzoCents: r.prezzoCents,
      }));
      const bozza = form.elements.stato.checked;
      let stato = 'emessa';
      if (existing && existing.stato === 'annullata') stato = 'annullata';
      else if (bozza) stato = 'bozza';
      const rec = {
        ...(existing || {}),
        id: existing ? existing.id : undefined,
        clientId: header.values.clientId,
        projectId: header.values.projectId || '',
        number: header.values.number,
        issueDate: header.values.issueDate,
        dueDate: header.values.dueDate,
        ivaRate: header.values.ivaRate,
        stato,
        righe,
        note: form.elements.note.value.trim(),
      };
      // Le righe vuote non sono un errore a sé: se restano senza dati, validateInvoice lo segnala
      const errors = [...header.errors, ...Core.validateInvoice(rec, {
        clients: App.state.clients,
        invoices: App.state.invoices,
        payments: App.state.payments,
      })];
      if (rows.some((r) => !r.descrizione && (r.quantita !== null || r.prezzoCents !== null))) {
        errors.push('Una riga ha quantità o prezzo ma manca la descrizione.');
      }
      if (rows.some((r) => r.quantita === null && r.prezzoCents === null && !r.descrizione)) {
        // riga completamente vuota: la ignoriamo, ma nessun errore
      }
      if (rec.projectId && !App.state.projects.some((p) => p.id === rec.projectId && p.clientId === rec.clientId)) {
        errors.push('Il progetto selezionato non appartiene al cliente.');
      }
      if (errors.length) return UI.showErrors(form, errors);
      const saved = await App.save('invoices', rec);
      UI.toast(existing ? 'Fattura aggiornata' : `Fattura ${saved.number} creata`);
      location.hash = `#/fatture/${saved.id}`;
    });

  /* ------------------------------ Dettaglio fattura ------------------------------ */
  // Dati dell'emittente che una fattura valida deve riportare
  function issuerMissing() {
    const s = App.settings();
    const missing = [];
    const hasName = s.tipoAttivita === 'azienda' ? !!(s.ragioneSociale || '').trim() : !!((s.nome || '').trim() && (s.cognome || '').trim());
    if (!hasName) missing.push(s.tipoAttivita === 'azienda' ? 'ragione sociale' : 'nome e cognome');
    if (!(s.partitaIva || '').trim()) missing.push('partita IVA');
    if (!(s.indirizzo || '').trim()) missing.push('indirizzo');
    return missing;
  }

  function issuerBanner() {
    const m = issuerMissing();
    if (!m.length) return '';
    return `<div class="alert warn"><strong>Mancano i tuoi dati nella fattura:</strong> ${esc(m.join(', '))}.
      Senza questi dati la fattura stampata non è valida. <a href="#/impostazioni">Completa le Impostazioni</a>.</div>`;
  }
  function printHTML(inv) {
    const s = App.settings();
    const c = App.clientOf(inv.clientId);
    const t = Core.invoiceTotals(inv);
    const emittente = s.tipoAttivita === 'azienda' ? s.ragioneSociale : `${s.nome || ''} ${s.cognome || ''}`.trim();
    const righe = (inv.righe || []).map((r) => `<tr>
      <td>${esc(r.descrizione)}</td>
      <td class="r">${esc(String(r.quantita).replace('.', ','))}</td>
      <td class="r">${esc(Core.formatEuro(r.prezzoCents))}</td>
      <td class="r">${esc(Core.formatEuro(Math.round(r.quantita * r.prezzoCents)))}</td></tr>`).join('');
    return `
      <div class="print-page">
        <header class="p-head">
          <div><h1>FATTURA ${esc(inv.number)}</h1><p>Data emissione: ${esc(fmtDate(inv.issueDate))}<br>Scadenza: ${esc(fmtDate(inv.dueDate))}</p></div>
          <div class="p-from"><b>${esc(emittente || '')}</b><br>${esc(s.indirizzo || '')}${s.cap || s.citta ? '<br>' + esc([s.cap, s.citta, s.provincia].filter(Boolean).join(' ')) : ''}<br>${s.partitaIva ? 'P.IVA ' + esc(s.partitaIva) : ''}${s.codiceFiscale ? '<br>C.F. ' + esc(s.codiceFiscale) : ''}${s.email ? '<br>' + esc(s.email) : ''}</div>
        </header>
        <section class="p-to"><span class="muted">Spettabile</span><br><b>${esc(c ? App.clientName(c) : '—')}</b><br>${esc(c ? [c.indirizzo, [c.cap, c.citta, c.provincia].filter(Boolean).join(' ')].filter(Boolean).join(', ') : '')}${c && c.partitaIva ? '<br>P.IVA ' + esc(c.partitaIva) : ''}${c && c.codiceFiscale ? '<br>C.F. ' + esc(c.codiceFiscale) : ''}</section>
        <table class="p-table"><thead><tr><th>Descrizione</th><th class="r">Q.tà</th><th class="r">Prezzo</th><th class="r">Importo</th></tr></thead><tbody>${righe}</tbody></table>
        <table class="p-totals"><tr><td>Imponibile</td><td class="r">${esc(Core.formatEuro(t.imponibile))}</td></tr>
          <tr><td>IVA ${esc(String(inv.ivaRate).replace('.', ','))}%</td><td class="r">${esc(Core.formatEuro(t.iva))}</td></tr>
          <tr class="grand"><td>Totale</td><td class="r">${esc(Core.formatEuro(t.totale))}</td></tr></table>
        ${inv.note ? `<p class="p-note">${esc(inv.note)}</p>` : ''}
        <footer class="p-foot">
          ${s.iban ? `<p>Pagamento tramite bonifico · IBAN ${esc(s.iban)}</p>` : ''}
          ${s.regimeFiscale ? `<p>${esc(s.regimeFiscale)}</p>` : ''}
        </footer>
      </div>`;
  }

  V.fatturaDetail = (id) => {
    const inv = invoiceOf(id);
    if (!inv) return `<div class="alert warn">Fattura non trovata. <a href="#/fatture">Torna all’elenco</a>.</div>`;
    const c = App.clientOf(inv.clientId);
    const today = App.today();
    const st = Core.invoiceState(inv, App.state.payments, today);
    const t = Core.invoiceTotals(inv);
    const payments = paymentsOf(inv.id).sort((a, b) => (a.date < b.date ? 1 : -1));
    const project = inv.projectId ? App.byId('projects', inv.projectId) : null;
    const files = App.state.files.filter((f) => f.relatedId === inv.id);
    const hasPayments = payments.length > 0;
    const canPay = inv.stato === 'emessa' && st.residuo > 0;
    const rows = (inv.righe || []).map((r) => `<tr>
        <td>${esc(r.descrizione)}</td>
        <td class="num">${esc(String(r.quantita).replace('.', ','))}</td>
        <td class="num">${esc(Core.formatEuro(r.prezzoCents))}</td>
        <td class="num">${esc(Core.formatEuro(Math.round(r.quantita * r.prezzoCents)))}</td></tr>`).join('');
    // La stampa usa un’area separata: la pagina dell’app non viene stampata
    App.ui.printInvoiceId = inv.id;
    return `
      <nav class="crumbs"><a href="#/fatture">Fatture</a> / <span>${esc(inv.number)}</span></nav>
      <header class="page-head">
        <div>
          <p class="eyebrow">Fattura ${esc(fmtDate(inv.issueDate))}</p>
          <h1>${esc(inv.number)} · ${esc(c ? App.clientName(c) : '—')}</h1>
          <p>${badge(st.code, st.label)} ${project ? `<span class="muted">· progetto: ${esc(project.titolo)}</span>` : ''}</p>
        </div>
        <div class="head-actions">
          ${inv.stato === 'bozza' ? `<button type="button" class="btn primary" data-action="invoice-issue" data-id="${esc(inv.id)}">Emetti fattura</button>` : ''}
          ${canPay ? `<button type="button" class="btn primary" data-action="payment-new" data-invoice="${esc(inv.id)}" data-client="${esc(inv.clientId)}">Registra incasso</button>` : ''}
          ${inv.stato !== 'annullata' ? `<a class="btn" href="#/fatture/${esc(inv.id)}/modifica">Modifica</a>` : ''}
          <button type="button" class="btn" data-action="invoice-print">Stampa / PDF</button>
          ${inv.stato === 'emessa' && !hasPayments ? `<button type="button" class="btn danger ghost" data-action="invoice-cancel" data-id="${esc(inv.id)}">Annulla fattura</button>` : ''}
          ${inv.stato === 'bozza' ? `<button type="button" class="btn danger ghost" data-action="invoice-delete" data-id="${esc(inv.id)}">Elimina bozza</button>` : ''}
        </div>
      </header>
      ${issuerBanner()}
      ${inv.stato === 'annullata' ? `<div class="alert warn">Fattura annullata: non entra nel fatturato. Il numero resta riservato.</div>` : ''}
      ${inv.stato === 'emessa' && hasPayments ? `<p class="muted small-note">Per annullare questa fattura prima elimina i suoi incassi.</p>` : ''}
      <section class="kpi-grid small">
        <article class="kpi"><span class="kpi-label">Imponibile</span><strong class="kpi-value">${esc(Core.formatEuro(t.imponibile))}</strong></article>
        <article class="kpi"><span class="kpi-label">IVA ${esc(String(inv.ivaRate).replace('.', ','))}%</span><strong class="kpi-value">${esc(Core.formatEuro(t.iva))}</strong></article>
        <article class="kpi"><span class="kpi-label">Totale</span><strong class="kpi-value">${esc(Core.formatEuro(t.totale))}</strong></article>
        <article class="kpi ${st.residuo > 0 && inv.stato === 'emessa' ? 'warn' : ''}"><span class="kpi-label">Residuo da incassare</span><strong class="kpi-value">${esc(Core.formatEuro(Math.max(0, st.residuo)))}</strong></article>
      </section>
      <div class="two-col">
        <section class="card">
          <h3>Righe</h3>
          <div class="table-wrap"><table class="table"><thead><tr><th>Descrizione</th><th class="num">Q.tà</th><th class="num">Prezzo</th><th class="num">Importo</th></tr></thead><tbody>${rows}</tbody></table></div>
          ${inv.dueDate ? `<p class="muted small-note">Scadenza: ${esc(fmtDate(inv.dueDate))}${inv.note ? ' · ' + esc(inv.note) : ''}</p>` : ''}
        </section>
        <section class="card">
          <h3>Dati</h3>
          <dl class="dl">
            <dt>Cliente</dt><dd>${c ? `<a href="#/clienti/${esc(c.id)}">${esc(App.clientName(c))}</a>` : '—'}</dd>
            <dt>Emissione</dt><dd>${esc(fmtDate(inv.issueDate))}</dd>
            <dt>Scadenza</dt><dd>${esc(fmtDate(inv.dueDate))}</dd>
            <dt>Incassato</dt><dd>${esc(Core.formatEuro(st.paid))}</dd>
          </dl>
        </section>
      </div>
      <section class="card">
        <div class="section-head"><h3>Incassi collegati (${payments.length})</h3></div>
        ${payments.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Data</th><th>Metodo</th><th class="num">Importo</th><th></th></tr></thead><tbody>${payments.map((p) => `<tr>
          <td>${esc(fmtDate(p.date))}</td><td>${esc(p.metodo || '—')}</td><td class="num">${esc(Core.formatEuro(p.amountCents))}</td>
          <td class="num row-actions"><button type="button" class="btn small ghost" data-action="payment-edit" data-id="${esc(p.id)}">Modifica</button>
          <button type="button" class="btn small ghost danger" data-action="payment-delete" data-id="${esc(p.id)}">Elimina</button></td></tr>`).join('')}</tbody></table></div>` : UI.empty('Nessun incasso collegato a questa fattura.')}
      </section>
      <section class="card">
        <h3>Documenti collegati (${files.length})</h3>
        ${files.length ? `<ul class="file-list">${files.map(App.fileRow).join('')}</ul>` : UI.empty('Nessun documento. Puoi allegarli dalla scheda cliente, sezione Documenti.')}
      </section>
`;
  };

  App.actions['invoice-print'] = () => {
    const id = App.ui.printInvoiceId;
    const inv = id ? invoiceOf(id) : null;
    if (!inv) return;
    const m = issuerMissing();
    if (m.length) UI.toast(`Attenzione: nella fattura mancano ${m.join(', ')}. Completali in Impostazioni.`, 'err');
    // Unica area di stampa: quella fuori dall'app (un secondo id uguale la rendeva vuota)
    const area = document.getElementById('print-area');
    if (area) area.innerHTML = printHTML(inv);
    root.print();
  };

  App.actions['invoice-issue'] = async (el) => {
    const inv = invoiceOf(el.dataset.id);
    if (!inv) return;
    const errs = Core.validateInvoice({ ...inv, stato: 'emessa' }, { clients: App.state.clients, invoices: App.state.invoices, payments: App.state.payments });
    if (errs.length) {
      UI.toast(errs[0], 'err');
      return;
    }
    await App.save('invoices', { ...inv, stato: 'emessa' });
    UI.toast('Fattura emessa: ora conta nel fatturato del mese di emissione');
    App.refresh();
  };

  App.actions['invoice-cancel'] = async (el) => {
    const inv = invoiceOf(el.dataset.id);
    if (!inv) return;
    if (paymentsOf(inv.id).length) {
      UI.toast('La fattura ha incassi collegati: eliminali prima di annullarla.', 'err');
      return;
    }
    const ok = await UI.confirmDialog({
      title: 'Annullare la fattura?',
      message: `La fattura ${inv.number} uscirà dal fatturato. Il numero resta riservato e non verrà riutilizzato.`,
      confirmText: 'Annulla fattura',
      danger: true,
    });
    if (!ok) return;
    await App.save('invoices', { ...inv, stato: 'annullata' });
    UI.toast('Fattura annullata');
    App.refresh();
  };

  App.actions['invoice-delete'] = async (el) => {
    const inv = invoiceOf(el.dataset.id);
    if (!inv || inv.stato !== 'bozza') return;
    const ok = await UI.confirmDialog({ title: 'Eliminare la bozza?', message: `La bozza ${inv.number} verrà eliminata. Il numero tornerà disponibile.`, confirmText: 'Elimina', danger: true });
    if (!ok) return;
    await App.remove('invoices', inv.id);
    UI.toast('Bozza eliminata');
    location.hash = '#/fatture';
  };

  /* ------------------------------ Incassi ------------------------------ */
  function paymentFields(clientId, invoiceId, editing) {
    const clients = App.clientOptions(clientId);
    return [
      { name: 'clientId', label: 'Cliente', type: 'select', options: clients, required: true },
      { name: 'invoiceId', label: 'Fattura collegata', type: 'select', options: invoiceChoices(clientId, invoiceId, editing), empty: '— acconto generico, senza fattura —', hint: 'Solo fatture emesse con residuo' },
      { name: 'amount', label: 'Importo (€)', type: 'money', required: true },
      { name: 'date', label: 'Data incasso', type: 'date', required: true },
      { name: 'metodo', label: 'Metodo', type: 'select', options: Core.METODI_PAGAMENTO.map((m) => [m, m]), empty: '— seleziona —' },
      { name: 'note', label: 'Riferimento / note', full: false, placeholder: 'es. CRO bonifico, causale…' },
      { name: 'receipt', label: 'Ricevuta o screenshot (facoltativo)', type: 'file', full: true, hint: 'Allega la ricevuta del bonifico: resta collegata a questo incasso' },
    ];
  }

  function invoiceChoices(clientId, selectedId, editing) {
    if (!clientId) return [];
    return App.state.invoices
      .filter((i) => i.clientId === clientId && i.stato === 'emessa')
      .filter((i) => {
        if (i.id === selectedId) return true;
        return Core.invoiceState(i, App.state.payments, App.today()).residuo > 0;
      })
      .sort((a, b) => (a.issueDate < b.issueDate ? 1 : -1))
      .map((i) => [i.id, `${i.number} · residuo ${Core.formatEuro(Core.invoiceState(i, App.state.payments, App.today()).residuo)}`]);
  }

  function openPaymentModal({ payment = null, clientId = '', invoiceId = '' } = {}) {
    const existingInvoice = payment && payment.invoiceId ? invoiceOf(payment.invoiceId) : null;
    const cid = payment ? payment.clientId : clientId || (existingInvoice ? existingInvoice.clientId : '');
    const iid = payment ? payment.invoiceId || '' : invoiceId || '';
    const values = payment
      ? { clientId: cid, invoiceId: iid, amount: payment.amountCents, date: payment.date, metodo: payment.metodo || '', note: payment.note || '' }
      : { clientId: cid, invoiceId: iid, amount: null, date: App.today(), metodo: 'Bonifico', note: '' };
    UI.modal({
      title: payment ? 'Modifica incasso' : 'Registra incasso',
      size: 'wide',
      body: `
        <form data-form="payment" data-id="${esc(payment ? payment.id : '')}" data-input="payment-amount" novalidate>
          ${UI.fieldsHTML(paymentFields(cid, iid, !!payment).map((f) => (f.name === 'invoiceId' ? { ...f, attrs: 'data-change="payment-invoice"' } : f.name === 'clientId' ? { ...f, attrs: 'data-change="payment-client"' } : f)), values)}
          <div class="form-actions"><button type="button" class="btn ghost" data-modal-close>Annulla</button><button type="submit" class="btn primary">Salva incasso</button></div>
        </form>`,
    });
  }

  App.openPaymentModal = openPaymentModal;

  App.actions['payment-new'] = (el) => {
    openPaymentModal({ clientId: el.dataset.client || '', invoiceId: el.dataset.invoice || '' });
  };

  App.actions['payment-edit'] = (el) => {
    const p = App.byId('payments', el.dataset.id);
    if (p) openPaymentModal({ payment: p });
  };

  App.actions['payment-delete'] = async (el) => {
    const p = App.byId('payments', el.dataset.id);
    if (!p) return;
    const ok = await UI.confirmDialog({
      title: 'Eliminare l’incasso?',
      message: `Eliminerai l’incasso di ${Core.formatEuro(p.amountCents)} del ${fmtDate(p.date)}. Le ricevute allegate verranno eliminate.`,
      confirmText: 'Elimina',
      danger: true,
    });
    if (!ok) return;
    await App.removeWithFiles('payments', p.id);
    UI.toast('Incasso eliminato');
    App.refresh();
  };

  App.changes['payment-client'] = (el) => {
    const form = el.form;
    const sel = form.elements.invoiceId;
    const choices = invoiceChoices(el.value, '', false);
    sel.innerHTML = `<option value="">— acconto generico, senza fattura —</option>${choices.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('')}`;
  };

  // Scegliendo una fattura, l'importo si propone pari al residuo
  App.changes['payment-invoice'] = (el) => {
    const form = el.form;
    const inv = el.value ? invoiceOf(el.value) : null;
    if (!inv) return;
    const st = Core.invoiceState(inv, App.state.payments, App.today());
    const editing = form.dataset.id;
    const residuo = editing ? st.residuo + (App.byId('payments', editing)?.amountCents || 0) : st.residuo;
    form.elements.amount.value = Core.centsToPlain(Math.max(0, residuo));

  App.inputs['payment-amount'] = () => {};

  V.incassi = () => {

      .filter((p) => !month || Number(p.date.slice(5, 7)) === Number(month))
      .filter((p) => !client || p.clientId === client)
      .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
    const total = list.reduce((s, p) => s + p.amountCents, 0);
    const rows = list.map((p) => {
      const c = App.clientOf(p.clientId);

      return `<tr>
        <td>${esc(fmtDate(p.date))}</td>
        <td>${c ? `<a href="#/clienti/${esc(c.id)}">${esc(App.clientName(c))}</a>` : '—'}</td>
        <td>${inv ? `<a href="#/fatture/${esc(inv.id)}">${esc(inv.number)}</a>` : '<span class="muted">acconto</span>'}</td>

    const months = Core.MESI.map((m, i) => [i + 1, m.charAt(0).toUpperCase() + m.slice(1)]);

        <div><p class="eyebrow">Cassa</p><h1>Incassi</h1><p class="muted">Pagamenti ricevuti. Il mese è quello della data di pagamento.</p></div>

        <label class="field"><span class="lbl">Cliente</span>
          <select name="client" data-change="pay-client"><option value="">Tutti i clienti</option>${clientOpts.map(([v, l]) => `<option value="${esc(v)}"${v === client ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></label>

        <tbody>${rows.length ? rows.join('') : `<tr><td colspan="7">${UI.empty('Nessun incasso con questi filtri.')}</td></tr>`}</tbody>
      </table></div>`;
  };

  App.changes['pay-year'] = (el) => {
    App.ui.payYear = el.value === '' ? '' : Number(el.value);
    App.refresh();
  };
  App.changes['pay-month'] = (el) => {
    App.ui.payMonth = el.value;
    App.refresh();
  };
  App.changes['pay-client'] = (el) => {
    App.ui.payClient = el.value;
    App.refresh();
  };

  App.forms.payment = (form) =>
    UI.guard(form, async () => {
      const { values, errors } = UI.readFields(form, paymentFields('', '', false));
      const existing = form.dataset.id ? App.byId('payments', form.dataset.id) : null;
      const rec = {
        ...(existing || {}),
        id: existing ? existing.id : undefined,
        clientId: values.clientId,
        invoiceId: values.invoiceId || null,
        date: values.date,
        amountCents: values.amount === null ? 0 : values.amount,
        metodo: values.metodo || '',
        note: values.note || '',

      const all = [...errors, ...Core.validatePayment(rec, {
        clients: App.state.clients,
        invoices: App.state.invoices,
        payments: App.state.payments,
      })];
      if (values.receipt) all.push(...Core.validateFile(values.receipt));
      if (all.length) return UI.showErrors(form, all);
      const saved = await App.save('payments', rec);
      if (values.receipt) {
        await App.addFile({ name: values.receipt.name, kind: 'ricevuta', date: rec.date, clientId: rec.clientId, relatedId: saved.id, relatedType: 'payment', note: rec.note }, values.receipt);

      UI.toast('Incasso registrato');

  /* ------------------------------ Spese ------------------------------ */
  const EXPENSE_FIELDS = [
    { name: 'date', label: 'Data', type: 'date', required: true },
    { name: 'descrizione', label: 'Descrizione', required: true, full: true, placeholder: 'es. Abbonamento editing, crediti generazione video' },
    { name: 'categoria', label: 'Categoria', type: 'select', options: Core.CATEGORIE_SPESA.map((c) => [c, c]), required: true },
    { name: 'fornitore', label: 'Fornitore', placeholder: 'es. Adobe, Higgsfield…' },
    { name: 'amount', label: 'Importo (€)', type: 'money', required: true },
    { name: 'note', label: 'Note', full: true },
    { name: 'receipt', label: 'Ricevuta / fattura del fornitore (facoltativo)', type: 'file', full: true },
  ];

  App.ui.expYear = App.ui.expYear ?? null;

  V.spese = () => {

    const list = App.state.expenses
      .filter((e) => year === '' || Number(e.date.slice(0, 4)) === Number(year))

      .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
    const total = list.reduce((s, e) => s + e.amountCents, 0);

        <td>${esc(fmtDate(e.date))}</td>
        <td><b>${esc(e.descrizione)}</b>${e.fornitore ? `<div class="muted small-note">${esc(e.fornitore)}</div>` : ''}</td>

          <button type="button" class="btn small ghost danger" data-action="expense-delete" data-id="${esc(e.id)}">Elimina</button></td>
      </tr>`;
    });
    return `
      <header class="page-head">
        <div><p class="eyebrow">Costi</p><h1>Spese</h1><p class="muted">Ogni spesa va registrata con la data in cui l’hai sostenuta.</p></div>
        <div class="head-actions"><button type="button" class="btn primary" data-action="expense-new">+ Nuova spesa</button></div>
      </header>
      <div class="toolbar">
        ${yearSelect('year', year, 'exp-year', true)}
        <label class="field"><span class="lbl">Categoria</span>
          <select name="cat" data-change="exp-cat"><option value="">Tutte</option>${Core.CATEGORIE_SPESA.map((c) => `<option${c === cat ? ' selected' : ''}>${esc(c)}</option>`).join('')}</select></label>
      </div>
      <div class="two-col">
        <section class="card">
          <h3>Per categoria</h3>
