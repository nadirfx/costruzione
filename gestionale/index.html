<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07090f">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <title>Gestionale · Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235ee7ff'/%3E%3Cstop offset='1' stop-color='%239b7bff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Ctext x='16' y='22' font-size='16' font-family='Arial' font-weight='700' text-anchor='middle' fill='%2305070c'%3EG%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Navigazione principale">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span>G</span></div>
        <div>
          <div class="brand-name">Gestionale</div>
          <div class="brand-sub">privato · locale</div>
        </div>
      </div>
      <nav class="nav">
        <a href="#/dashboard" data-nav="dashboard"><span class="ico" aria-hidden="true">◐</span>Dashboard</a>
        <a href="#/andamento" data-nav="andamento"><span class="ico" aria-hidden="true">↗</span>Andamento</a>
        <a href="#/settimana" data-nav="settimana"><span class="ico" aria-hidden="true">▦</span>Settimana</a>
        <a href="#/task" data-nav="task"><span class="ico" aria-hidden="true">✓</span>Task</a>
        <div class="nav-sep"></div>
        <a href="#/clienti" data-nav="clienti"><span class="ico" aria-hidden="true">◎</span>Clienti</a>
        <a href="#/fatture" data-nav="fatture"><span class="ico" aria-hidden="true">▤</span>Fatture</a>
        <a href="#/incassi" data-nav="incassi"><span class="ico" aria-hidden="true">⬇</span>Incassi</a>
        <a href="#/spese" data-nav="spese"><span class="ico" aria-hidden="true">⬆</span>Spese</a>
        <div class="nav-sep"></div>
        <a href="#/risparmi" data-nav="risparmi"><span class="ico" aria-hidden="true">◍</span>Risparmi</a>
        <a href="#/etf" data-nav="etf"><span class="ico" aria-hidden="true">◈</span>ETF</a>
        <div class="nav-sep"></div>
        <a href="#/fiscale" data-nav="fiscale"><span class="ico" aria-hidden="true">€</span>Fiscale</a>
        <a href="#/esporta" data-nav="esporta"><span class="ico" aria-hidden="true">⇅</span>Esporta</a>
        <a href="#/impostazioni" data-nav="impostazioni"><span class="ico" aria-hidden="true">⚙</span>Impostazioni</a>
        <a href="#" data-action="logout"><span class="ico" aria-hidden="true">⏻</span>Esci</a>
      </nav>
      <div class="sidebar-foot"><span class="ok-dot"></span>Dati salvati in questo browser</div>
    </aside>

    <main class="main">
      <div id="backup-banner" class="alert warn" hidden></div>
      <div id="view" aria-live="polite"><div class="empty">Caricamento…</div></div>
    </main>
  </div>

  <section id="login" class="login" hidden aria-labelledby="login-title">
    <div class="login-bg" aria-hidden="true"><i></i><i></i><i></i></div>
    <form class="login-card" data-form="login" novalidate autocomplete="on">
      <div class="brand-mark big" aria-hidden="true"><span>G</span></div>
      <h1 id="login-title">Gestionale</h1>
      <p class="muted">Accesso riservato</p>
      <label class="field"><span class="lbl">Utente</span>
        <input id="login-user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label class="field"><span class="lbl">Password</span>
        <input id="login-pass" name="password" type="password" autocomplete="current-password" required></label>
      <label class="check"><input type="checkbox" name="remember" checked> Resta connesso su questo dispositivo (30 giorni)</label>
      <p id="login-msg" class="login-msg" role="status" aria-live="polite"></p>
      <button id="login-submit" type="submit" class="btn primary wide">Entra</button>
      <p class="small-note muted">I dati non lasciano questo dispositivo.</p>
    </form>
  </section>

  <div id="print-area" aria-hidden="true"></div>
  <div id="toasts" aria-live="polite"></div>

  <!-- Ordine importante: la logica prima, poi storage, UI, viste e avvio -->
  <script src="js/core.js"></script>
  <script src="js/fiscale.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
  <script src="js/views-dashboard.js"></script>
  <script src="js/views-clienti.js"></script>
  <script src="js/views-fatture.js"></script>
  <script src="js/views-altro.js"></script>
  <script src="js/risparmi.js"></script>
  <script src="js/views-risparmi.js"></script>
</body>
</html>
