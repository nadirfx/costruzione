<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor o Claude</title>
<style>
  @font-face{font-family:Int;font-style:normal;font-weight:100 900;src:url(fonts/Inter.ttf)}
  @font-face{font-family:Int;font-style:italic;font-weight:100 900;src:url(fonts/Inter-Italic.ttf)}
  body{margin:0;background:#111;color:#EEE;font-family:Int,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px}
  canvas{width:min(100%,calc(80vh*9/16));aspect-ratio:9/16;border-radius:18px;background:#fff}
  .ctrl{display:flex;gap:8px;align-items:center;width:min(100%,calc(80vh*9/16))}
  button{background:#1A1A1F;color:#EEE;border:1px solid #333;border-radius:10px;height:38px;min-width:38px;font:700 14px Int,sans-serif;cursor:pointer}
  input{flex:1;accent-color:#E8173A}
  span{font:500 13px Int,monospace;color:#999;min-width:90px;text-align:right}
</style>
</head>
<body>
<canvas id="cv" width="1080" height="1920"></canvas>
<div class="ctrl"><button id="play">▶</button><input id="scrub" type="range" min="0" max="34.4" step="0.01" value="0"><span id="tm">0.00 / 34.4</span></div>
<script>
const W=1080,H=1920,DUR=34.4,CX=540;
const C={ink:'#0E0E12',red:'#E8173A',deep:'#7A0010',orange:'#FF6A2B',green:'#19C37D',purple:'#6E4BFF',pink:'#FF3D8B',grey:'#9A9AA2',light:'#F2F2F4'};
const cv=document.getElementById('cv'),MAIN=cv.getContext('2d');let x=MAIN;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),p=(t,a,b)=>clamp((t-a)/(b-a)),L=(a,b,k)=>a+(b-a)*k;
const eo=k=>1-Math.pow(1-k,3),ex=k=>k>=1?1:1-Math.pow(2,-10*k),ei=k=>k*k*k,eio=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const back=k=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};
function rr(X,Y,w,h,r){x.beginPath();x.roundRect(X,Y,w,h,r)}
function font(size,weight=700,ital=false){return `${ital?'italic ':''}${weight} ${size}px Int`}
function txt(s,X,Y,o={}){const{size=60,weight=600,ital=false,color=C.ink,align='center',alpha=1,ls=0,maxW=0}=o;if(alpha<=0)return;
  x.save();x.globalAlpha*=alpha;x.textAlign=align;x.textBaseline='middle';let sz=size;x.font=font(sz,weight,ital);x.letterSpacing=ls+'px';
  if(maxW){const w=x.measureText(s).width;if(w>maxW){sz=size*maxW/w;x.font=font(sz,weight,ital)}}
  x.fillStyle=color;x.fillText(s,X,Y);x.restore()}
function tw(s,size,weight=700,ital=false,ls=0){x.save();x.font=font(size,weight,ital);x.letterSpacing=ls+'px';const w=x.measureText(s).width;x.restore();return w}
function typed(s,t0,cps,T){return s.slice(0,Math.max(0,Math.floor((T-t0)*cps)))}

/* ---------- camera (no roll: everything stays level) ---------- */
function camera(T){let s=1.0+.02*Math.sin(T*.9),tx=Math.sin(T*1.1)*12,ty=Math.cos(T*.9)*14;
  const B=[0,4.5,7.85,9.1,10.5,15.45,17.2,22.4,24.95,28.9,30.15,31.4,34.4];for(let i=0;i<B.length-1;i++)if(T>=B[i]&&T<B[i+1])s+=.07*eio(p(T,B[i],B[i+1]));
  for(const t0 of[.05,1.3,3.96,5.9,7.85,9.8,11.5,12.3,12.9,13.6,14.2,15.5,16.25,18.45,20.85,21.3,21.85,24.0,25.6,27.3,28.15,29.0,30.24,32.55,33.25])if(T>=t0)s+=.03*Math.exp(-(T-t0)*8);
  if(T>=14.65&&T<15.45){s+=.18*ei(p(T,14.65,15.45));tx+=(Math.random()-.5)*14*p(T,14.65,15.45);ty+=(Math.random()-.5)*14*p(T,14.65,15.45)}
  return{s,tx,ty}}

/* ---------- backgrounds ---------- */
function sweep(T){const q=(T*.55)%1,bx=L(-900,W+900,q);x.save();x.translate(bx,H/2);x.rotate(.38);const lg=x.createLinearGradient(-320,0,320,0);lg.addColorStop(0,'rgba(255,255,255,0)');lg.addColorStop(.5,'rgba(255,255,255,.75)');lg.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=lg;x.fillRect(-320,-1600,640,3200);x.restore()}
function bgWhite(T){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#FBFBFC');g.addColorStop(1,'#E9E9EC');x.fillStyle=g;x.fillRect(-300,-400,W+600,H+800);
  // soft moving shadow (like the reference)
  for(const[a,b,r,o]of[[.3,.4,760,.13],[.8,.7,680,.11],[.5,.15,520,.08]]){const X=W*(a+.22*Math.sin(T*.9+a*9)),Y=H*(b+.14*Math.cos(T*.8+b*7));const rg=x.createRadialGradient(X,Y,0,X,Y,r);rg.addColorStop(0,`rgba(0,0,0,${o})`);rg.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=rg;x.fillRect(-300,-400,W+600,H+800)}sweep(T)}
function bgRed(T){x.fillStyle='#B0001A';x.fillRect(-300,-400,W+600,H+800);
  const blobs=[['255,40,60',.25,.3,900],['60,0,8',.75,.55,800],['255,90,100',.6,.15,600],['40,0,6',.2,.85,900],['220,0,30',.8,.9,700]];
  blobs.forEach(([c,a,b,r],i)=>{const X=W*(a+.18*Math.sin(T*.6+i*2)),Y=H*(b+.12*Math.cos(T*.5+i*3));const rg=x.createRadialGradient(X,Y,0,X,Y,r);rg.addColorStop(0,`rgba(${c},.85)`);rg.addColorStop(1,`rgba(${c},0)`);x.fillStyle=rg;x.fillRect(-300,-400,W+600,H+800)})}

function marquee(T,word,col,y,speed,size=420){x.save();x.font=font(size,900);x.letterSpacing='-12px';x.textBaseline='middle';x.fillStyle=col;const w=x.measureText(word+'  ').width;let off=-((T*speed)%w);for(let X=off-w;X<W+w;X+=w)x.fillText(word+'  ',X,y);x.restore()}
/* ---------- UI pieces ---------- */
function cursor(X,Y,click=0){x.save();x.translate(X,Y);const s=1-.12*Math.sin(clamp(click)*Math.PI);x.scale(1.5*s,1.5*s);
  x.shadowColor='rgba(0,0,0,.35)';x.shadowBlur=10;x.shadowOffsetY=4;x.fillStyle='#fff';x.beginPath();x.moveTo(0,0);x.lineTo(0,34);x.lineTo(9,26);x.lineTo(15,40);x.lineTo(21,37);x.lineTo(15,24);x.lineTo(26,24);x.closePath();x.fill();x.shadowBlur=0;x.shadowOffsetY=0;
  x.strokeStyle='#111';x.lineWidth=2.2;x.lineJoin='round';x.stroke();x.restore();
  if(click>0&&click<1){x.save();x.strokeStyle=`rgba(255,255,255,${1-click})`;x.lineWidth=4;x.beginPath();x.arc(X,Y,10+click*60,0,7);x.stroke();x.strokeStyle=`rgba(0,0,0,${.25*(1-click)})`;x.lineWidth=2;x.beginPath();x.arc(X,Y,14+click*60,0,7);x.stroke();x.restore()}}
function icon(kind,col,X,Y,r=26){x.save();x.translate(X,Y);const g=x.createLinearGradient(0,-r,0,r);g.addColorStop(0,col);g.addColorStop(1,shade(col));x.fillStyle=g;x.beginPath();x.arc(0,0,r,0,7);x.fill();
  x.strokeStyle='#fff';x.fillStyle='#fff';x.lineWidth=r*.13;x.lineCap='round';x.lineJoin='round';const u=r*.48;
  if(kind==='clock'){x.beginPath();x.arc(0,0,u,0,7);x.stroke();x.beginPath();x.moveTo(0,0);x.lineTo(0,-u*.65);x.moveTo(0,0);x.lineTo(u*.45,u*.2);x.stroke()}
  else if(kind==='stack'){for(let i=0;i<3;i++){rr(-u,-u*.8+i*u*.6,u*2,u*.4,3);x.fill()}}
  else if(kind==='user'){x.beginPath();x.arc(0,-u*.35,u*.38,0,7);x.fill();x.beginPath();x.arc(0,u*.75,u*.75,Math.PI,0);x.fill()}
  else if(kind==='cal'){rr(-u,-u*.8,u*2,u*1.7,4);x.stroke();x.beginPath();x.moveTo(-u,-u*.25);x.lineTo(u,-u*.25);x.stroke()}
  else if(kind==='spark'){x.beginPath();for(let i=0;i<8;i++){const rr2=i%2?u*.32:u*1.05,a=i*Math.PI/4-Math.PI/2;x.lineTo(Math.cos(a)*rr2,Math.sin(a)*rr2)}x.closePath();x.fill()}
  else if(kind==='bolt'){x.beginPath();x.moveTo(u*.2,-u);x.lineTo(-u*.55,u*.12);x.lineTo(0,u*.12);x.lineTo(-u*.2,u);x.lineTo(u*.6,-u*.15);x.lineTo(u*.05,-u*.15);x.closePath();x.fill()}
  else if(kind==='euro'){txt('€',0,2,{size:r*1.1,weight:800,color:'#fff'})}
  else if(kind==='x'){x.beginPath();x.moveTo(-u*.6,-u*.6);x.lineTo(u*.6,u*.6);x.moveTo(u*.6,-u*.6);x.lineTo(-u*.6,u*.6);x.stroke()}
  else if(kind==='check'){x.beginPath();x.moveTo(-u*.6,0);x.lineTo(-u*.15,u*.45);x.lineTo(u*.65,-u*.45);x.stroke()}
  x.restore()}
function shade(hex){const n=parseInt(hex.slice(1),16);const r=(n>>16)*.7|0,g=((n>>8)&255)*.7|0,b=(n&255)*.7|0;return `rgb(${r},${g},${b})`}
function pill(s,X,Y,ic,col,k=1,o={}){const{size=40,dark=false}=o;if(k<=0)return;x.save();x.translate(X,Y);const sc=back(clamp(k));x.scale(sc,sc);x.globalAlpha*=clamp(k*2);
  const h=size*2.25,w=tw(s,size,600)+h+14+size*1.1;
  x.shadowColor='rgba(0,0,0,.28)';x.shadowBlur=30;x.shadowOffsetY=12;const g=x.createLinearGradient(0,-h/2,0,h/2);g.addColorStop(0,'#FFFFFF');g.addColorStop(1,'#E4E4E9');x.fillStyle=g;rr(-w/2,-h/2,w,h,h/2);x.fill();x.shadowBlur=0;x.shadowOffsetY=0;
  x.strokeStyle='rgba(255,255,255,.9)';x.lineWidth=2;rr(-w/2+2,-h/2+2,w-4,h-4,h/2);x.stroke();
  icon(ic,col,-w/2+h/2+4,0,h*.32);txt(s,-w/2+h+14,2,{size,weight:600,color:'#1C1C22',align:'left'});x.restore();return w}
function connector(x1,y1,x2,y2,k,col){if(k<=0)return;x.save();x.strokeStyle=col;x.lineWidth=3;x.lineCap='round';x.beginPath();
  const n=24;for(let i=0;i<=n*k;i++){const q=i/n,xx=L(x1,x2,q)+Math.sin(q*Math.PI)*60,yy=L(y1,y2,q);i?x.lineTo(xx,yy):x.moveTo(xx,yy)}x.stroke();x.fillStyle=col;x.beginPath();x.arc(x1,y1,6,0,7);x.fill();x.restore()}

/* ---------- transitions (whip with streaks / hard cuts) ---------- */
function streaks(T,a,b,col){const k=p(T,a,b);if(k<=0||k>=1)return;const s=Math.sin(k*Math.PI);x.save();x.globalAlpha=s;for(let i=0;i<26;i++){const y=(i*83)%H,h=6+(i*37)%40;x.fillStyle=i%3?col:'rgba(255,255,255,.8)';x.fillRect(L(-W,W,k)+((i*131)%400)-200,y,W*1.3,h)}x.restore()}
function seg(T,a,b,fn,tin,tout){if(T<a||T>=b)return;let dx=0;const ri=1-ex(p(T,a,a+.3)),ro=ei(p(T,b-.25,b));if(tin==='whip')dx+=ri*W;if(tout==='whip')dx-=ro*W;x.save();x.translate(dx,0);
  const pr=p(T,a,b),sc=1+.09*pr;x.translate(CX,860);x.scale(sc,sc);x.translate(-CX+Math.sin(T*.8+a)*22,-860+Math.cos(T*.7+a)*14);fn(T);x.restore()}
function asterisk(X,Y,r,T){x.save();x.translate(X,Y);x.rotate(T*.5);x.strokeStyle=C.orange;x.lineCap='round';x.lineWidth=r*.2;const ls=[1,.78,.95,.7,1,.82,.9,.74,.96,.8,.88,.76];x.beginPath();for(let i=0;i<12;i++){const a=i*Math.PI/6;x.moveTo(Math.cos(a)*r*.18,Math.sin(a)*r*.18);x.lineTo(Math.cos(a)*r*ls[i],Math.sin(a)*r*ls[i])}x.stroke();x.restore()}
/* ---------- SCENES synced to the voice (MarcoTrox, timings_marco.json) ---------- */
const P=[[0.05,1.76],[2.2,2.56],[2.703,3.514],[3.964,4.388],[4.69,7.574],[7.85,8.454],[9.154,10.304],[10.542,12.143],[12.377,14.648],[15.498,16.714],[17.264,19.061],[19.287,20.021],[20.111,22.197],[22.571,23.722],[23.958,24.789],[25.02,26.626],[26.798,28.316],[29.016,29.739],[30.239,30.931],[31.481,32.158],[32.458,33.241],[33.31,33.933]];
function rise(T,t0,d=.4){return ex(p(T,t0,t0+d))}
function lineIn(s,X,Y,T,t0,o){const k=rise(T,t0,.45);if(k<=0)return;x.save();x.translate(0,(1-k)*36);x.globalAlpha=k;txt(s,X,Y,o);x.restore()}
function boxWord(s,X,Y,T,t0,size,col,txtCol='#fff',align='center'){const k=p(T,t0,t0+.22);if(k<=0)return;const w=tw(s,size,800,true,-3);const bx=align==='center'?X-w/2:X;x.save();x.fillStyle=col;x.fillRect(bx-24,Y-size*.62,(w+48)*eo(k),size*1.2);txt(s,X,Y,{size,weight:800,ital:true,color:txtCol,align,ls:-3,alpha:Math.min(1,k*2)});x.restore()}
/* A · 0-4.5 hook (white) */
function sA(T){bgWhite(T);
  txt(typed('Ho licenziato',-.6,16,T),130,520,{size:124,weight:800,align:'left',ls:-4});
  txt(typed('il mio video editor.',.55,20,T),132,650,{size:90,weight:700,color:C.red,align:'left',ls:-2});
  {const st=ex(p(T,1.35,1.6));if(st>0){x.save();x.strokeStyle=C.red;x.lineWidth=9;x.lineCap='round';const w=tw('il mio video editor.',90,700,false,-2);x.beginPath();x.moveTo(128,650);x.lineTo(128+(w+8)*st,650);x.stroke();x.restore()}}
  const sk=p(T,1.3,1.46);if(sk>0){x.save();x.translate(600,330);x.rotate(-.08);const s=L(2.6,1,eo(sk));x.scale(s,s);x.globalAlpha=Math.min(1,sk*2);x.strokeStyle=C.red;x.lineWidth=12;rr(-330,-80,660,160,22);x.stroke();txt('LICENZIATO',0,4,{size:104,weight:900,color:C.red,ls:4});x.restore()}
  lineIn('E no,',130,830,T,2.2,{size:72,weight:300,color:C.grey,align:'left',ls:-2});
  lineIn('non era scarso.',130,925,T,2.72,{size:92,weight:700,color:C.ink,align:'left',ls:-3});
  boxWord('Anzi.',130+tw('Anzi.',140,800,true,-3)/2+24,1100,T,3.96,140,C.ink,'#fff');
  const cx=L(L(980,700,eo(p(T,0,1.2))),300,eo(p(T,3.4,3.95))),cy=L(L(1250,700,eo(p(T,0,1.2))),1090,eo(p(T,3.4,3.95)));cursor(cx,cy,p(T,3.95,4.3))}
/* B · 4.5-7.85 money (red) */
function sB(T){bgRed(T);
  lineIn('Lo pagavo',CX,300,T,4.69,{size:64,weight:300,color:'rgba(255,255,255,.85)',ls:-1});
  const v=1400*ex(p(T,4.9,5.9)),pop=1+.1*Math.exp(-Math.max(0,T-5.9)*8)*(T>5.9);
  x.save();x.translate(CX,450);x.scale(pop,pop);x.globalAlpha=rise(T,4.8,.3);txt('€'+String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g,'.'),0,0,{size:200,weight:900,color:'#fff',ls:-8});x.restore();
  lineIn('al mese',CX,575,T,5.4,{size:50,weight:600,color:'rgba(255,255,255,.85)',ls:2});
  for(let i=0;i<20;i++){const c=i%5,r=Math.floor(i/5),X=CX-300+c*150,Y=720+r*130;const k=back(p(T,6.2+i*.04,6.5+i*.04));if(k<=0)continue;
    x.save();x.translate(X,Y+Math.sin(T*2+i)*4);x.scale(k,k);x.fillStyle='rgba(255,255,255,.95)';x.shadowColor='rgba(0,0,0,.3)';x.shadowBlur=16;rr(-58,-48,116,96,16);x.fill();x.shadowBlur=0;
    x.fillStyle=C.red;x.beginPath();x.moveTo(-14,-18);x.lineTo(20,0);x.lineTo(-14,18);x.fill();x.restore()}
  const pk=p(T,7.05,7.45);if(pk>0){x.save();x.translate(CX,1290);pill('= 70 € a video',0,0,'euro',C.red,pk,{size:50});x.restore()}}
/* C · 7.85-9.1 "Il problema?" (white, hard cut) */
function sC(T){bgWhite(T);
  const k=p(T,7.85,7.95);x.save();x.translate(CX,800);const s=L(1.3,1,eo(k))*(1+.14*(T-7.85));x.scale(s,s);txt('Il problema?',0,0,{size:150,weight:800,color:C.ink,ls:-6,maxW:940});x.restore()}
/* D · 9.1-10.5 waiting */
function sD(T){bgWhite(T);
  x.save();x.translate(CX,640);x.fillStyle='#fff';x.shadowColor='rgba(0,0,0,.18)';x.shadowBlur=30;x.shadowOffsetY=10;rr(-400,-110,800,220,40);x.fill();x.shadowBlur=0;x.shadowOffsetY=0;
  txt('Render video…',-340,-48,{size:40,weight:600,color:C.ink,align:'left'});x.save();x.translate(320,-48);x.rotate(T*6);x.strokeStyle=C.red;x.lineWidth=7;x.lineCap='round';x.beginPath();x.arc(0,0,22,0,4.5);x.stroke();x.restore();
  const pr=Math.min(.99,.8+.19*ex(p(T,9.15,9.6)));x.fillStyle='#EDEDF0';rr(-340,20,680,30,15);x.fill();x.fillStyle=C.red;rr(-340,20,680*pr,30,15);x.fill();
  txt(Math.floor(pr*100)+'%',340,-48,{size:34,weight:800,color:C.red,align:'right',alpha:Math.sin(T*10)>0?1:.4});x.restore();
  const k=p(T,9.75,9.95);if(k>0){x.save();x.translate(CX,1000);const s=L(1.6,1,eo(k));x.scale(s,s);x.globalAlpha=k;txt('ASPETTARE.',0,0,{size:150,weight:900,color:C.red,ls:-6,maxW:940});x.restore()}}
/* E · 10.5-15.45 the trend dies (red) */
function sE(T){bgRed(T);
  const X0=110,X1=970,Y0=1050,pts=[];for(let i=0;i<=60;i++){const q=i/60;let y;if(q<.55)y=Y0-(Math.pow(q/.55,1.6))*520;else y=Y0-520+Math.pow((q-.55)/.45,.7)*560;pts.push([L(X0,X1,q),y])}
  const grow=L(0,.55,eio(p(T,10.6,12.3)))+L(0,.45,eio(p(T,12.3,13.7)));const n=Math.floor(grow*60);
  x.strokeStyle='rgba(255,255,255,.25)';x.lineWidth=3;x.beginPath();x.moveTo(X0,Y0+40);x.lineTo(X1,Y0+40);x.stroke();
  if(n>0){x.save();x.strokeStyle='#fff';x.lineWidth=12;x.lineCap='round';x.lineJoin='round';x.shadowColor='rgba(0,0,0,.3)';x.shadowBlur=20;x.beginPath();pts.slice(0,n+1).forEach((q,i)=>i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));x.stroke();const e=pts[n];x.fillStyle='#fff';x.beginPath();x.arc(e[0],e[1],16,0,7);x.fill();x.restore()}
  {const Tq=Math.floor(T*12)/12,up=eio(p(Tq,10.6,12.3)),dn=eio(p(Tq,12.3,13.7));const views=Math.round(L(1200,1250000,up)*L(1,.004,dn));const a=p(T,10.6,10.9);
   x.save();x.globalAlpha=a;txt('visualizzazioni',CX,170,{size:32,weight:500,color:'rgba(255,255,255,.8)',ls:4});txt(String(views).replace(/\B(?=(\d{3})+(?!\d))/g,'.'),CX,245,{size:96,weight:900,color:'#fff',ls:-3});x.restore()}
  lineIn('Esce un trend',130,380,T,10.55,{size:78,weight:800,color:'#fff',align:'left',ls:-3});
  const ik=p(T,11.5,11.9);if(ik>0){x.save();x.translate(560,470);pill("Mi viene l'idea",0,0,'spark',C.orange,ik,{size:44});x.restore()}
  const mk=p(T,13.75,14.05);if(mk>0){const e=pts[60];x.save();x.translate(e[0]-300,e[1]-90);pill('Il mio video arriva qui',0,0,'x',C.ink,mk,{size:36});x.restore();x.strokeStyle='#fff';x.lineWidth=3;x.setLineDash([8,8]);x.beginPath();x.moveTo(e[0],e[1]-50);x.lineTo(e[0],e[1]-12);x.stroke();x.setLineDash([])}
  const dk=p(T,14.15,14.35);if(dk>0){x.save();x.translate(CX,1280);const s=L(1.6,1,eo(dk))*(1+.04*p(T,14.65,15.45));x.scale(s,s);x.globalAlpha=dk;txt('GIÀ MORTO.',0,0,{size:150,weight:900,color:'#fff',ls:-6,maxW:960});x.restore()}}
/* F · 15.45-17.2 "Allora ho cambiato tutto" (white) */
