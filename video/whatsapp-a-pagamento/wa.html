<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WhatsApp a pagamento</title>
<style>
  @font-face{font-family:Beb;font-weight:400;src:url(fonts/BebasNeue-Regular.ttf)}
  @font-face{font-family:Int;font-style:normal;font-weight:100 900;src:url(fonts/Inter.ttf)}
  @font-face{font-family:Int;font-style:italic;font-weight:100 900;src:url(fonts/Inter-Italic.ttf)}
  body{margin:0;background:#111;color:#EEE;font-family:Int,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px}
  canvas{width:min(100%,calc(80vh*9/16));aspect-ratio:9/16;border-radius:18px;background:#fff}
  .ctrl{display:flex;gap:8px;align-items:center;width:min(100%,calc(80vh*9/16))}
  button{background:#1A1A1F;color:#EEE;border:1px solid #333;border-radius:10px;height:38px;min-width:38px;font:700 14px Int,sans-serif;cursor:pointer}
  input{flex:1;accent-color:#E8173A}
  span{font:500 13px Int,monospace;color:#999;min-width:90px;text-align:right}
</style>
</head>
<body>
<canvas id="cv" width="1080" height="1920"></canvas>
<div class="ctrl"><button id="play">▶</button><input id="scrub" type="range" min="0" max="37.5" step="0.01" value="0"><span id="tm">0.00 / 37.8</span></div>
<script>
const W=1080,H=1920,DUR=37.5,CX=540;
const C={ink:'#0E0E12',red:'#E8173A',deep:'#7A0010',orange:'#FF6A2B',green:'#19C37D',purple:'#6E4BFF',pink:'#FF3D8B',grey:'#9A9AA2',light:'#F2F2F4'};
const cv=document.getElementById('cv'),MAIN=cv.getContext('2d');let x=MAIN;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),p=(t,a,b)=>clamp((t-a)/(b-a)),L=(a,b,k)=>a+(b-a)*k;
const eo=k=>1-Math.pow(1-k,3),ex=k=>k>=1?1:1-Math.pow(2,-10*k),ei=k=>k*k*k,eio=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const back=k=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};
function rr(X,Y,w,h,r){x.beginPath();x.roundRect(X,Y,w,h,r)}
function font(size,weight=700,ital=false){return `${ital?'italic ':''}${weight} ${size}px Int`}
function txt(s,X,Y,o={}){const{size=60,weight=600,ital=false,color=C.ink,align='center',alpha=1,ls=0,maxW=0}=o;if(alpha<=0)return;
  x.save();x.globalAlpha*=alpha;x.textAlign=align;x.textBaseline='middle';let sz=size;x.font=font(sz,weight,ital);x.letterSpacing=ls+'px';
  if(maxW){const w=x.measureText(s).width;if(w>maxW){sz=size*maxW/w;x.font=font(sz,weight,ital)}}
  x.fillStyle=color;x.fillText(s,X,Y);x.restore()}
function tw(s,size,weight=700,ital=false,ls=0){x.save();x.font=font(size,weight,ital);x.letterSpacing=ls+'px';const w=x.measureText(s).width;x.restore();return w}
function typed(s,t0,cps,T){return s.slice(0,Math.max(0,Math.floor((T-t0)*cps)))}

/* ---------- camera (no roll: everything stays level) ---------- */
/* ---------- backgrounds ---------- */
function sweep(T){const q=(T*.55)%1,bx=L(-900,W+900,q);x.save();x.translate(bx,H/2);x.rotate(.38);const lg=x.createLinearGradient(-320,0,320,0);lg.addColorStop(0,'rgba(255,255,255,0)');lg.addColorStop(.5,'rgba(255,255,255,.75)');lg.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=lg;x.fillRect(-320,-1600,640,3200);x.restore()}
function bgWhite(T){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#FBFBFC');g.addColorStop(1,'#E9E9EC');x.fillStyle=g;x.fillRect(-300,-400,W+600,H+800);
  // soft moving shadow (like the reference)
  for(const[a,b,r,o]of[[.3,.4,760,.13],[.8,.7,680,.11],[.5,.15,520,.08]]){const X=W*(a+.22*Math.sin(T*.9+a*9)),Y=H*(b+.14*Math.cos(T*.8+b*7));const rg=x.createRadialGradient(X,Y,0,X,Y,r);rg.addColorStop(0,`rgba(0,0,0,${o})`);rg.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=rg;x.fillRect(-300,-400,W+600,H+800)}sweep(T)}
function bgRed(T){x.fillStyle='#B0001A';x.fillRect(-300,-400,W+600,H+800);
  const blobs=[['255,40,60',.25,.3,900],['60,0,8',.75,.55,800],['255,90,100',.6,.15,600],['40,0,6',.2,.85,900],['220,0,30',.8,.9,700]];
  blobs.forEach(([c,a,b,r],i)=>{const X=W*(a+.18*Math.sin(T*.6+i*2)),Y=H*(b+.12*Math.cos(T*.5+i*3));const rg=x.createRadialGradient(X,Y,0,X,Y,r);rg.addColorStop(0,`rgba(${c},.85)`);rg.addColorStop(1,`rgba(${c},0)`);x.fillStyle=rg;x.fillRect(-300,-400,W+600,H+800)})}

function marquee(T,word,col,y,speed,size=420){x.save();x.font=font(size,900);x.letterSpacing='-12px';x.textBaseline='middle';x.fillStyle=col;const w=x.measureText(word+'  ').width;let off=-((T*speed)%w);for(let X=off-w;X<W+w;X+=w)x.fillText(word+'  ',X,y);x.restore()}
/* ---------- UI pieces ---------- */
function cursor(X,Y,click=0){x.save();x.translate(X,Y);const s=1-.12*Math.sin(clamp(click)*Math.PI);x.scale(2.5*s,2.5*s);
  x.shadowColor='rgba(0,0,0,.35)';x.shadowBlur=10;x.shadowOffsetY=4;x.fillStyle='#fff';x.beginPath();x.moveTo(0,0);x.lineTo(0,34);x.lineTo(9,26);x.lineTo(15,40);x.lineTo(21,37);x.lineTo(15,24);x.lineTo(26,24);x.closePath();x.fill();x.shadowBlur=0;x.shadowOffsetY=0;
  x.strokeStyle='#111';x.lineWidth=2.2;x.lineJoin='round';x.stroke();x.restore();
  if(click>0&&click<1){x.save();x.strokeStyle=`rgba(255,255,255,${1-click})`;x.lineWidth=4;x.beginPath();x.arc(X,Y,10+click*60,0,7);x.stroke();x.strokeStyle=`rgba(0,0,0,${.25*(1-click)})`;x.lineWidth=2;x.beginPath();x.arc(X,Y,14+click*60,0,7);x.stroke();x.restore()}}
function icon(kind,col,X,Y,r=26){x.save();x.translate(X,Y);const g=x.createLinearGradient(0,-r,0,r);g.addColorStop(0,col);g.addColorStop(1,shade(col));x.fillStyle=g;x.beginPath();x.arc(0,0,r,0,7);x.fill();
  x.strokeStyle='#fff';x.fillStyle='#fff';x.lineWidth=r*.13;x.lineCap='round';x.lineJoin='round';const u=r*.48;
  if(kind==='clock'){x.beginPath();x.arc(0,0,u,0,7);x.stroke();x.beginPath();x.moveTo(0,0);x.lineTo(0,-u*.65);x.moveTo(0,0);x.lineTo(u*.45,u*.2);x.stroke()}
  else if(kind==='stack'){for(let i=0;i<3;i++){rr(-u,-u*.8+i*u*.6,u*2,u*.4,3);x.fill()}}
  else if(kind==='user'){x.beginPath();x.arc(0,-u*.35,u*.38,0,7);x.fill();x.beginPath();x.arc(0,u*.75,u*.75,Math.PI,0);x.fill()}
  else if(kind==='cal'){rr(-u,-u*.8,u*2,u*1.7,4);x.stroke();x.beginPath();x.moveTo(-u,-u*.25);x.lineTo(u,-u*.25);x.stroke()}
  else if(kind==='spark'){x.beginPath();for(let i=0;i<8;i++){const rr2=i%2?u*.32:u*1.05,a=i*Math.PI/4-Math.PI/2;x.lineTo(Math.cos(a)*rr2,Math.sin(a)*rr2)}x.closePath();x.fill()}
  else if(kind==='bolt'){x.beginPath();x.moveTo(u*.2,-u);x.lineTo(-u*.55,u*.12);x.lineTo(0,u*.12);x.lineTo(-u*.2,u);x.lineTo(u*.6,-u*.15);x.lineTo(u*.05,-u*.15);x.closePath();x.fill()}
  else if(kind==='euro'){txt('€',0,2,{size:r*1.1,weight:800,color:'#fff'})}
  else if(kind==='x'){x.beginPath();x.moveTo(-u*.6,-u*.6);x.lineTo(u*.6,u*.6);x.moveTo(u*.6,-u*.6);x.lineTo(-u*.6,u*.6);x.stroke()}
  else if(kind==='check'){x.beginPath();x.moveTo(-u*.6,0);x.lineTo(-u*.15,u*.45);x.lineTo(u*.65,-u*.45);x.stroke()}
  x.restore()}
function shade(hex){const n=parseInt(hex.slice(1),16);const r=(n>>16)*.7|0,g=((n>>8)&255)*.7|0,b=(n&255)*.7|0;return `rgb(${r},${g},${b})`}
function pill(s,X,Y,ic,col,k=1,o={}){const{size=40,dark=false}=o;if(k<=0)return;x.save();x.translate(X,Y);const sc=back(clamp(k));x.scale(sc,sc);x.globalAlpha*=clamp(k*2);
  const h=size*2.25,w=tw(s,size,600)+h+14+size*1.1;
  x.shadowColor='rgba(0,0,0,.28)';x.shadowBlur=30;x.shadowOffsetY=12;const g=x.createLinearGradient(0,-h/2,0,h/2);g.addColorStop(0,'#FFFFFF');g.addColorStop(1,'#E4E4E9');x.fillStyle=g;rr(-w/2,-h/2,w,h,h/2);x.fill();x.shadowBlur=0;x.shadowOffsetY=0;
  x.strokeStyle='rgba(255,255,255,.9)';x.lineWidth=2;rr(-w/2+2,-h/2+2,w-4,h-4,h/2);x.stroke();
  icon(ic,col,-w/2+h/2+4,0,h*.32);txt(s,-w/2+h+14,2,{size,weight:600,color:'#1C1C22',align:'left'});x.restore();return w}
function connector(x1,y1,x2,y2,k,col){if(k<=0)return;x.save();x.strokeStyle=col;x.lineWidth=3;x.lineCap='round';x.beginPath();
  const n=24;for(let i=0;i<=n*k;i++){const q=i/n,xx=L(x1,x2,q)+Math.sin(q*Math.PI)*60,yy=L(y1,y2,q);i?x.lineTo(xx,yy):x.moveTo(xx,yy)}x.stroke();x.fillStyle=col;x.beginPath();x.arc(x1,y1,6,0,7);x.fill();x.restore()}

/* ---------- transitions (whip with streaks / hard cuts) ---------- */
function streaks(T,a,b,col){const k=p(T,a,b);if(k<=0||k>=1)return;const s=Math.sin(k*Math.PI);x.save();x.globalAlpha=s;for(let i=0;i<26;i++){const y=(i*83)%H,h=6+(i*37)%40;x.fillStyle=i%3?col:'rgba(255,255,255,.8)';x.fillRect(L(-W,W,k)+((i*131)%400)-200,y,W*1.3,h)}x.restore()}
/* ===== v6: synced to the user's own voice (word timestamps) ===== */
/* ===== GLOW edition: dark premium (YouMotion-like), synced to the user's voice ===== */
const G={blue:'#3D7BFF',cyan:'#3FE0FF',purple:'#8B5CFF',violet:'#B44BFF',green:'#3CFF8F',orange:'#FF7A2F',red:'#FF3355',white:'#F4F6FF',dim:'#8E96B8'};
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`}
/* background: near-black with slow moving coloured light */
function bgDark(T,mood){x.fillStyle='#04050C';x.fillRect(-300,-400,W+600,H+800);
  const L1=mood==='green'?['#25D366','#3D7BFF','#8B5CFF']:mood==='red'?['#FF2244','#7A0A2A','#3D7BFF']:mood==='warm'?['#FF7A2F','#8B5CFF','#3D7BFF']:['#3D7BFF','#8B5CFF','#3CFF8F'];
  [[.25,.3,900,L1[0],.32],[.8,.55,800,L1[1],.30],[.45,.95,900,L1[2],.22]].forEach(([a,b,r,c,o],i)=>{const X=W*(a+.18*Math.sin(T*.5+i*2)),Y=H*(b+.1*Math.cos(T*.4+i*3));const g=x.createRadialGradient(X,Y,0,X,Y,r);g.addColorStop(0,hexA(c,o));g.addColorStop(1,hexA(c,0));x.fillStyle=g;x.fillRect(-300,-400,W+600,H+800)});
  // floating dust
  for(let i=0;i<40;i++){const px=(i*137.5)%W,py=((i*271)%H-T*(10+i%7*4)+H*4)%H;x.fillStyle=`rgba(200,210,255,${.10+.25*(.5+.5*Math.sin(T*2+i))})`;x.beginPath();x.arc(px+Math.sin(T*.6+i)*14,py,1+(i%3),0,7);x.fill()}}
function glowText(s,X,Y,o={}){const{size=86,weight=600,color=G.white,align='center',alpha=1,glow=24,ls=-2,maxW=860}=o;if(alpha<=0)return;x.save();x.globalAlpha*=alpha;x.textAlign=align;x.textBaseline='middle';let sz=size;x.font=`${weight} ${sz}px Int`;x.letterSpacing=ls+'px';const w=x.measureText(s).width;if(w>maxW){sz=size*maxW/w;x.font=`${weight} ${sz}px Int`}
  x.shadowColor=color;x.shadowBlur=glow;x.fillStyle=color;x.fillText(s,X,Y);x.shadowBlur=0;x.fillText(s,X,Y);x.restore();return sz}
/* typed line, last letters lit green (like the reference) */
function typeLit(s,X,Y,T,t0,cps,o={}){cps*=2.4;const n=Math.max(0,Math.min(s.length,Math.floor((T-t0)*cps)));if(n<=0)return;const done=n>=s.length&&T>t0+s.length/cps+.25;const{size=86,weight=600,align='center',lit=G.green,maxW=840}=o;
  const vis=s.slice(0,n),head=done?vis:vis.slice(0,Math.max(0,n-2)),tail=done?'':vis.slice(Math.max(0,n-2));
  x.save();x.font=`${weight} ${size}px Int`;x.letterSpacing='-2px';let sz=size;const full=x.measureText(s).width;if(full>maxW){sz=size*maxW/full;x.font=`${weight} ${sz}px Int`}const wFull=x.measureText(s).width,wHead=x.measureText(head).width;x.restore();
  const left=align==='center'?X-wFull/2:X;glowText(head,left,Y,{size:sz,weight,align:'left',maxW:9999});if(tail)glowText(tail,left+wHead,Y,{size:sz,weight,align:'left',color:lit,glow:30,maxW:9999})}
/* glass card with neon rim */
function glass(X,Y,w,h,r,o={}){const{rim=[G.cyan,G.purple],alpha=1,fill=.07,glowA=.55}=o;x.save();x.globalAlpha*=alpha;x.translate(X,Y);
  x.shadowColor=hexA(rim[1],glowA);x.shadowBlur=60;x.fillStyle=`rgba(255,255,255,${fill})`;rr(-w/2,-h/2,w,h,r);x.fill();x.shadowBlur=0;
  const g=x.createLinearGradient(0,-h/2,0,h/2);g.addColorStop(0,'rgba(255,255,255,.10)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;rr(-w/2,-h/2,w,h,r);x.fill();
  const lg=x.createLinearGradient(-w/2,-h/2,w/2,h/2);lg.addColorStop(0,rim[0]);lg.addColorStop(1,rim[1]);x.strokeStyle=lg;x.lineWidth=3;rr(-w/2,-h/2,w,h,r);x.stroke();
  x.strokeStyle='rgba(255,255,255,.55)';x.lineWidth=1.5;x.beginPath();x.moveTo(-w/2+r,-h/2+1.5);x.lineTo(w/2-r,-h/2+1.5);x.stroke();x.restore()}
/* 3D-looking glass icon (rim light, inner gradient glyph, specular) */
function gIcon(kind,X,Y,s,T,o={}){const{rot=0,blur=0,alpha=1,tilt=0,cols=[G.green,G.cyan,G.purple]}=o;if(alpha<=0||s<=0)return;x.save();x.globalAlpha*=alpha;if(blur>.5)x.filter=`blur(${blur}px)`;x.translate(X,Y);x.rotate(rot);x.transform(1,tilt*.25,0,1-Math.abs(tilt)*.15,0,0);
  x.shadowColor=hexA(G.purple,.8);x.shadowBlur=s*.5;x.fillStyle='#0A0A12';rr(-s/2,-s/2,s,s,s*.27);x.fill();x.shadowBlur=0;
  const rim=x.createLinearGradient(-s/2,-s/2,s/2,s/2);rim.addColorStop(0,'#FFFFFF');rim.addColorStop(.35,G.violet);rim.addColorStop(1,G.blue);x.strokeStyle=rim;x.lineWidth=s*.035;rr(-s/2,-s/2,s,s,s*.27);x.stroke();
  const ig=x.createLinearGradient(-s*.3,-s*.3,s*.3,s*.3);ig.addColorStop(0,cols[0]);ig.addColorStop(.5,cols[1]);ig.addColorStop(1,cols[2]);x.fillStyle=ig;x.strokeStyle=ig;x.lineCap='round';x.lineJoin='round';const u=s*.22;x.lineWidth=s*.075;
  if(kind==='play'){x.beginPath();x.moveTo(-u*.7,-u);x.lineTo(u*1.1,0);x.lineTo(-u*.7,u);x.closePath();x.fill()}
  else if(kind==='spark'){x.beginPath();for(let i=0;i<8;i++){const r=i%2?u*.3:u*1.2,a=i*Math.PI/4-Math.PI/2;x.lineTo(Math.cos(a)*r,Math.sin(a)*r)}x.closePath();x.fill()}
  else if(kind==='note'){x.beginPath();x.arc(-u*.4,u*.6,u*.42,0,7);x.fill();x.fillRect(-u*.05,-u*1.0,u*.22,u*1.6);x.beginPath();x.moveTo(-u*.05,-u);x.quadraticCurveTo(u*.7,-u*.9,u*.8,-u*.2);x.stroke()}
  else if(kind==='eye'){x.beginPath();x.moveTo(-u*1.2,0);x.quadraticCurveTo(0,-u*1.1,u*1.2,0);x.quadraticCurveTo(0,u*1.1,-u*1.2,0);x.fill();x.fillStyle='#0A0A12';x.beginPath();x.arc(0,0,u*.42,0,7);x.fill()}
  else if(kind==='wave'){x.beginPath();x.moveTo(-u*1.1,u*.2);x.bezierCurveTo(-u*.5,-u*1.1,0,u*1.1,u*.5,-u*.3);x.lineTo(u*1.1,-u*.1);x.stroke()}
  else if(kind==='star'){x.beginPath();for(let i=0;i<10;i++){const r=i%2?u*.45:u*1.1,a=i*Math.PI/5-Math.PI/2;x.lineTo(Math.cos(a)*r,Math.sin(a)*r)}x.closePath();x.fill()}
  else if(kind==='euro'){x.font=`800 ${s*.5}px Int`;x.textAlign='center';x.textBaseline='middle';x.fillText('€',0,s*.02)}
  else if(kind==='up'){x.beginPath();x.moveTo(0,u*1.1);x.lineTo(0,-u*1.0);x.moveTo(-u*.8,-u*.2);x.lineTo(0,-u*1.0);x.lineTo(u*.8,-u*.2);x.stroke()}
  else if(kind==='check'){x.beginPath();x.moveTo(-u*.8,0);x.lineTo(-u*.2,u*.6);x.lineTo(u*.9,-u*.6);x.stroke()}
  else if(kind==='msg'){x.beginPath();x.roundRect(-u*1.15,-u*.95,u*2.3,u*1.6,u*.5);x.fill();x.beginPath();x.moveTo(-u*.6,u*.5);x.lineTo(-u*.9,u*1.15);x.lineTo(-u*.05,u*.6);x.fill()}
  else if(kind==='mic'){x.beginPath();x.roundRect(-u*.42,-u*1.15,u*.84,u*1.45,u*.42);x.fill();x.beginPath();x.arc(0,-u*.1,u*.8,.15*Math.PI,.85*Math.PI);x.stroke();x.beginPath();x.moveTo(0,u*.7);x.lineTo(0,u*1.1);x.stroke()}
  else if(kind==='phone'){x.save();x.rotate(-.6);x.beginPath();x.arc(0,0,u*.95,Math.PI*.62,Math.PI*1.38);x.lineWidth=s*.11;x.stroke();x.restore()}
  else if(kind==='photo'){x.beginPath();x.roundRect(-u*1.1,-u*.85,u*2.2,u*1.7,u*.25);x.stroke();x.beginPath();x.moveTo(-u*.9,u*.6);x.lineTo(-u*.25,-u*.1);x.lineTo(u*.2,u*.35);x.lineTo(u*.45,u*.1);x.lineTo(u*.9,u*.6);x.closePath();x.fill();x.beginPath();x.arc(u*.5,-u*.38,u*.2,0,7);x.fill()}
  else if(kind==='trash'){x.beginPath();x.moveTo(-u,-u*.6);x.lineTo(u,-u*.6);x.stroke();x.beginPath();x.moveTo(-u*.75,-u*.4);x.lineTo(-u*.55,u*1.05);x.lineTo(u*.55,u*1.05);x.lineTo(u*.75,-u*.4);x.closePath();x.fill();x.beginPath();x.moveTo(-u*.3,-u*.6);x.lineTo(-u*.3,-u);x.lineTo(u*.3,-u);x.lineTo(u*.3,-u*.6);x.stroke()}
  else if(kind==='building'){x.beginPath();x.roundRect(-u*.85,-u*1.05,u*1.7,u*2.1,u*.12);x.stroke();for(let r=0;r<3;r++)for(let c=0;c<2;c++){x.fillRect(-u*.5+c*u*.62,-u*.72+r*u*.55,u*.38,u*.3)}}
  else if(kind==='user'){x.beginPath();x.arc(0,-u*.4,u*.45,0,7);x.fill();x.beginPath();x.arc(0,u*.95,u*.9,Math.PI,0);x.fill()}
  else if(kind==='film'){x.beginPath();x.roundRect(-u*1.1,-u*.6,u*2.2,u*1.5,u*.18);x.fill();x.save();x.translate(0,-u*.62);x.rotate(-.25);x.fillRect(-u*1.1,-u*.42,u*2.2,u*.34);x.restore()}
  else if(kind==='x'){x.beginPath();x.moveTo(-u*.75,-u*.75);x.lineTo(u*.75,u*.75);x.moveTo(u*.75,-u*.75);x.lineTo(-u*.75,u*.75);x.stroke()}

function w9(T){bgDark(T,'warm');rbeams(CX,1450,T,K.e2-.3,[G.orange,G.violet],(T-K.e2)*.28-.45,9,1250,.7);sparks(T,CX,1350,900,G.orange,30,280,K.e2,.8);typeLit('Vuoi il metodo?',CX,260,T,K.e2,22,{size:100,weight:700,lit:G.orange});
  const t0=K.e2,cl=ei(p(T,t0+.5,t0+1.1));['msg','spark','note','eye','wave','star'].forEach((kd,i)=>{const a=T*1.6+i*Math.PI/3,r=L(380,0,cl);const depth=(Math.sin(a)+1)/2;gIcon(kd,CX+Math.cos(a)*r,680+Math.sin(a)*r*.5,L(80,140,depth)*(1-cl*.9)*eo(p(T,t0,t0+.4)),T,{blur:(1-depth)*6,alpha:1-cl})});
  if(T>=t0+1.1){const k=back(p(T,t0+1.1,t0+1.4));x.save();x.translate(CX,680);x.scale(k,k);glass(0,0,200,200,54,{rim:[G.orange,G.violet],fill:.06});asterisk(0,0,60,T,G.orange);x.restore();flare(CX,680,500,Math.max(0,1-p(T,t0+1.1,t0+1.7)),G.orange)}
  glowText('Commenta',CX,900,{size:64,weight:400,color:G.dim,glow:0,alpha:p(T,K.e3,K.e3+.15)});
  if(T>=K.e3+.1){const k=p(T,K.e3+.1,K.e3+.3);x.save();x.translate(CX,1030);x.scale(L(1.5,1,eo(k)),L(1.5,1,eo(k)));glowText('CLAUDE',0,0,{size:170,weight:900,color:'#FFB07A',glow:60,ls:4,maxW:760,alpha:Math.min(1,k*2.5)});x.restore()}
  const tS=K.e3+.15,tC=K.e3+.75,bk=p(T,K.e3-.3,K.e3);if(bk>0){const sent=p(T,tC+.07,tC+.3);x.save();x.globalAlpha=bk;glass(CX,1230,800,124,62,{rim:sent>0?[G.green,G.cyan]:[G.cyan,G.purple],fill:.08});
    if(sent<=0){const ty=typed('CLAUDE',tS,14,T);glowText(ty||'Aggiungi un commento…',CX-350,1232,{size:ty?46:40,weight:ty?700:400,align:'left',color:ty?G.white:G.dim,glow:ty?12:0,maxW:9999})}else{glowText('Commento inviato',CX-350,1232,{size:44,weight:600,color:G.green,align:'left',glow:20,alpha:sent,maxW:9999})}
    gIcon(sent>0?'check':'up',CX+330,1230,86,T,{cols:sent>0?[G.green,G.cyan,G.green]:[G.cyan,G.purple,G.blue]});x.restore()}
  if(T>=K.e3b)typeLit('Te lo mando.',CX,1400,T,K.e3b,22,{size:96,weight:700,lit:G.green});
  const cx=L(L(1300,860,eo(p(T,K.e3-.3,K.e3+.3))),874,eo(p(T,tC-.25,tC))),cy=L(L(1750,1290,eo(p(T,K.e3-.3,K.e3+.3))),1235,eo(p(T,tC-.25,tC)));if(T>=K.e3-.3)cursor(cx,cy,p(T,tC,tC+.3))}

function scenes(T){
  seg(T,0,K.h4,w1,'','L',[.14,-50]);seg(T,K.h4,K.t1,w2,'L','L');seg(T,K.t1,K.rw,w3,'L','',[.08,0]);
  seg(T,K.rw,K.c1,w4,'','U');seg(T,K.c1,K.c3,w5,'U','L');seg(T,K.c3,K.c4,w6,'L','L');seg(T,K.c4,K.e1,w7,'L','L');seg(T,K.e1,K.e2,w8,'L','Zin');seg(T,K.e2,DUR+.1,w9,'Zin','',[.16,-40],true)}
function world(T){
  if(T>=K.rw&&T<K.r1){const q=p(T,K.rw,K.r1),Tr=L(K.rw-.05,.4,eio(q));x.save();x.filter='saturate(1.6) hue-rotate(-12deg)';scenes(Tr);x.restore();rewindFX(T);return}
  scenes(T);
  if(T>=K.r2-.05&&T<K.c1+.9){const k=p(T,K.r2,K.r2+.3)*(1-p(T,K.c1+.6,K.c1+.9));x.save();x.globalAlpha=k;glass(CX,1390,700,92,46,{rim:['#FFFFFF','#FF8899'],fill:.12,glowA:.4});glowText('NON È UNA NOTIZIA REALE',CX,1392,{size:40,weight:800,ls:3,glow:8});x.restore()}}

/* ---------- render ---------- */
let MB=1,OFF=null,NP=null;const noise=document.createElement('canvas');noise.width=noise.height=256;{const n=noise.getContext('2d'),d=n.createImageData(256,256);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}n.putImageData(d,0,0)}
function frameContent(T){const cam=camera(T);x.save();x.fillStyle='#04050C';x.fillRect(0,0,W,H);x.translate(CX,960);x.scale(cam.s,cam.s);x.translate(-CX+cam.tx,-960+cam.ty);
  x.save();x.translate(CX,740);x.scale(.86,.86);x.translate(-CX,-740);world(T);x.restore();x.restore()}
function render(T){x=MAIN;x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;
  if(MB<=1)frameContent(T);else{if(!OFF){OFF=document.createElement('canvas');OFF.width=W;OFF.height=H}
    for(let i=0;i<MB;i++){const tt=T+(i/(MB-1)-.5)/60;x=OFF.getContext('2d');x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;frameContent(Math.max(0,tt));x=MAIN;x.setTransform(1,0,0,1,0,0);x.globalAlpha=1/(i+1);x.drawImage(OFF,0,0)}x.globalAlpha=1}
  if(!NP)NP=x.createPattern(noise,'repeat');x.save();x.globalAlpha=.035;x.globalCompositeOperation='overlay';x.translate(Math.random()*256,Math.random()*256);x.fillStyle=NP;x.fillRect(-256,-256,W+512,H+512);x.restore()}

/* ---------- audio ---------- */
let AC=null,MG=null;
function initAudio(){if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.55;const c=AC.createDynamicsCompressor();MG.connect(c);c.connect(AC.destination)}
function nb(d){const b=AC.createBuffer(1,Math.ceil(AC.sampleRate*d),AC.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=b;return s}
function env(g,t,a,d,v){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
function sfx(type,at,arg){if(!AC)return;const t=at??AC.currentTime,g=AC.createGain();g.connect(MG);
  const osc=(tp,f0,f1,d,st=0)=>{const o=AC.createOscillator();o.type=tp;o.frequency.setValueAtTime(f0,t+st);o.frequency.exponentialRampToValueAtTime(f1,t+st+d);o.connect(g);o.start(t+st);o.stop(t+st+d+.05);return o};
  const nf=(d,ft,f0,f1,q=1)=>{const s=nb(d),f=AC.createBiquadFilter();f.type=ft;f.Q.value=q;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+d);s.connect(f);f.connect(g);s.start(t);s.stop(t+d)};
  switch(type){
    case'key':env(g,t,.001,.035,.2);nf(.04,'bandpass',3800,2600,3);break;
    case'click':env(g,t,.001,.05,.45);nf(.05,'bandpass',2500,1800,4);osc('sine',1200,800,.03);break;
    case'pop':env(g,t,.001,.14,.35);osc('sine',arg||520,(arg||520)*2,.1);break;
    case'whoosh':env(g,t,.1,.3,.35);nf(.42,'bandpass',250,3000,1.2);break;
    case'wipe':env(g,t,.05,.35,.3);nf(.4,'lowpass',400,3000,1);break;
    case'thud':env(g,t,.002,.35,.8);osc('sine',110,40,.35);nf(.12,'lowpass',1200,200);break;
    case'boom':env(g,t,.005,.9,.8);osc('sine',120,32,.9);break;
    case'chime':env(g,t,.005,1.1,.25);[1046,1318,1568,2093].forEach((f,i)=>osc('sine',f,f,1,i*.06));break;
    case'ding':env(g,t,.005,.7,.28);osc('sine',1568,1568,.7);osc('sine',2349,2349,.6);break;
    case'kick':env(g,t,.002,.2,.5);osc('sine',140,45,.2);break;
    case'hat':env(g,t,.001,.035,.06);nf(.04,'highpass',8000,9000);break;
    case'pad':{g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.08,t+1);g.gain.setValueAtTime(.08,t+arg-.8);g.gain.exponentialRampToValueAtTime(.0001,t+arg);[110,138.6,164.8].forEach(f=>osc('sine',f,f,arg));break}
    case'tension':{g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+1);g.gain.setValueAtTime(.12,t+arg-.5);g.gain.exponentialRampToValueAtTime(.0001,t+arg);[55,58.3].forEach(f=>osc('sawtooth',f,f,arg));break}
  }}
const CUES=[];
function fire(a,b){for(const e of CUES)if(e[0]>=a&&e[0]<b)sfx(e[1],undefined,e[2])}

/* ---------- loop ---------- */
let t=0,playing=false,last=performance.now();
const pb=document.getElementById('play'),sc=document.getElementById('scrub'),tm=document.getElementById('tm');
pb.onclick=()=>{initAudio();if(AC.state==='suspended')AC.resume();playing=!playing;pb.textContent=playing?'❚❚':'▶'};
sc.oninput=()=>{t=+sc.value};
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(playing){const pr=t;t+=dt;if(t>=DUR){fire(pr,DUR);t-=DUR;fire(0,t)}else fire(pr,t);sc.value=t}
  render(t);tm.textContent=`${t.toFixed(2)} / ${DUR}`;requestAnimationFrame(frame)}
Promise.all(['300 50px Int','400 50px Int','600 50px Int','700 50px Int','800 50px Int','900 50px Int','italic 800 50px Int','400 50px Beb'].map(f=>document.fonts.load(f))).finally(()=>requestAnimationFrame(frame));
