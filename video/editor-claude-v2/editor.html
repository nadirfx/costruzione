<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ho licenziato il mio video editor</title>
<style>
  @font-face{font-family:Bric;font-weight:500;src:url(fonts/BricolageGrotesque-500.ttf)}
  @font-face{font-family:Bric;font-weight:700;src:url(fonts/BricolageGrotesque-700.ttf)}
  @font-face{font-family:Bric;font-weight:800;src:url(fonts/BricolageGrotesque-800.ttf)}
  @font-face{font-family:Unb;font-weight:700;src:url(fonts/Unbounded-700.ttf)}
  @font-face{font-family:Unb;font-weight:900;src:url(fonts/Unbounded-900.ttf)}
  @font-face{font-family:Spc;font-weight:500;src:url(fonts/SpaceGrotesk-500.ttf)}
  @font-face{font-family:Spc;font-weight:700;src:url(fonts/SpaceGrotesk-700.ttf)}
  body{margin:0;background:#07070D;color:#EEE;font-family:Bric,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px}
  canvas{width:min(100%,calc(80vh*9/16));aspect-ratio:9/16;border-radius:18px;background:#000}
  .ctrl{display:flex;gap:8px;align-items:center;width:min(100%,calc(80vh*9/16))}
  button{background:#12121A;color:#EEE;border:1px solid #2A2A36;border-radius:10px;height:38px;min-width:38px;font:700 14px Bric,sans-serif;cursor:pointer}
  input{flex:1;accent-color:#FF8F5A}
  span{font:500 13px Spc,monospace;color:#999;min-width:90px;text-align:right}
</style>
</head>
<body>
<canvas id="cv" width="1080" height="1920"></canvas>
<div class="ctrl"><button id="play">▶</button><input id="scrub" type="range" min="0" max="25.5" step="0.01" value="0"><span id="tm">0.00 / 25.5</span></div>
<script>
const W=1080,H=1920,DUR=25.5,CX=540;
const C={blue:'#5B8CFF',red:'#FF3B5C',orange:'#FF8F5A',green:'#35E08A',white:'#F3F1FA',muted:'#9A98B0',purple:'#9B8CFF'};
const RGB={blue:[91,140,255],red:[255,59,92],orange:[255,143,90],green:[53,224,138],purple:[120,90,255]};
const cv=document.getElementById('cv'),MAIN=cv.getContext('2d');let x=MAIN;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),p=(t,a,b)=>clamp((t-a)/(b-a)),L=(a,b,k)=>a+(b-a)*k;
const eo=k=>1-Math.pow(1-k,3),ex=k=>k>=1?1:1-Math.pow(2,-10*k),ei=k=>k*k*k,eio=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const back=k=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};
function rng(s){return()=>(s=(s*16807)%2147483647)/2147483647}
const fmt=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
function rr(X,Y,w,h,r){x.beginPath();x.roundRect(X,Y,w,h,r)}
function lerpC(a,b,k){return a.map((v,i)=>Math.round(L(v,b[i],k)))}
const css=(c,a=1)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
function txt(s,X,Y,o={}){const{size=60,weight=500,font='Bric',color=C.white,align='center',alpha=1,ls=0,maxW=0,glow=0}=o;if(alpha<=0)return size;
  x.save();x.globalAlpha*=alpha;x.textAlign=align;x.textBaseline='middle';let sz=size;x.font=`${weight} ${sz}px ${font}`;x.letterSpacing=ls+'px';
  if(maxW){const w=x.measureText(s).width;if(w>maxW){sz=size*maxW/w;x.font=`${weight} ${sz}px ${font}`}}
  if(glow){x.shadowColor=color;x.shadowBlur=glow}x.fillStyle=color;x.fillText(s,X,Y);x.restore();return sz}
function tw(s,size,weight=500,font='Bric'){x.save();x.font=`${weight} ${size}px ${font}`;const w=x.measureText(s).width;x.restore();return w}
// neon stroke helper: path built by fn
function neon(fn,col,w=6,glow=34,alpha=1){if(alpha<=0)return;x.save();x.globalAlpha*=alpha;x.lineCap='round';x.lineJoin='round';
  x.strokeStyle=col;x.lineWidth=w;x.shadowColor=col;x.shadowBlur=glow;fn();x.stroke();x.shadowBlur=0;x.strokeStyle='rgba(255,255,255,.55)';x.lineWidth=w*.3;fn();x.stroke();x.restore()}

/* ---------- mood colour over time ---------- */
const MOOD=[[0,'blue'],[1.2,'blue'],[1.45,'red'],[8.0,'red'],[8.6,'orange'],[10.6,'orange'],[10.9,'green'],[12.7,'green'],[13.1,'orange'],[14.9,'orange'],[15.3,'orange'],[17.3,'orange'],[17.6,'green'],[19.3,'green'],[19.7,'orange'],[25.5,'orange']];
function mood(T){for(let i=0;i<MOOD.length-1;i++){const[a,ca]=MOOD[i],[b,cb]=MOOD[i+1];if(T<=b)return lerpC(RGB[ca],RGB[cb],eio(p(T,a,b)))}return RGB.orange}

/* ---------- background ---------- */
let BOKEH=null;
function makeBokeh(){const c=document.createElement('canvas');c.width=W+200;c.height=H+200;const g=c.getContext('2d');g.filter='blur(46px)';const r=rng(5);
  const cols=['rgba(110,80,255,.35)','rgba(60,90,230,.32)','rgba(255,120,90,.18)','rgba(160,90,255,.28)'];
  for(let i=0;i<20;i++){const s=120+r()*200;g.fillStyle=cols[i%4];g.beginPath();g.roundRect(r()*(W+200)-s/2,r()*(H+200)-s/2,s,s,s*.28);g.fill()}return c}
const DUST=Array.from({length:46},(_,i)=>{const r=rng(100+i);return{x:r()*W,y:r()*H,s:1+r()*2.6,v:8+r()*26,o:r()}});
function bg(T){
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#08081A');g.addColorStop(.45,'#141030');g.addColorStop(1,'#07070F');x.fillStyle=g;x.fillRect(0,0,W,H);
  if(!BOKEH)BOKEH=makeBokeh();x.save();x.globalAlpha=.95;x.drawImage(BOKEH,-100+Math.sin(T*.25)*40,-100+Math.cos(T*.2)*50);x.restore();
  const m=mood(T),rg=x.createRadialGradient(CX,820,40,CX,820,1050);rg.addColorStop(0,css(m,.26));rg.addColorStop(1,css(m,0));x.fillStyle=rg;x.fillRect(0,0,W,H);
  for(const d of DUST){const y=((d.y-T*d.v)%H+H)%H;x.fillStyle=`rgba(255,255,255,${.12+.25*(.5+.5*Math.sin(T*2+d.o*9))})`;x.beginPath();x.arc(d.x+Math.sin(T*.5+d.o*6)*12,y,d.s,0,7);x.fill()}
}

/* ---------- desk + omino ---------- */
function desk(T,col,alpha=1){
  const c=css(col);x.save();x.globalAlpha*=alpha;
  const fg=x.createLinearGradient(0,1040,0,1330);fg.addColorStop(0,css(col,.22));fg.addColorStop(1,css(col,0));x.fillStyle=fg;x.fillRect(70,1040,940,290);
  // perspective grid on floor
  x.strokeStyle=css(col,.16);x.lineWidth=2;x.beginPath();const vp=[CX,760];
  for(let i=-9;i<=9;i++){const bx=CX+i*120;x.moveTo(L(vp[0],bx,(1330-vp[1])>0?1:1),1330);x.lineTo(L(bx,vp[0],(1330-1060)/(1330-vp[1])),1060)}
  for(let j=0;j<6;j++){const q=Math.pow((j+((T*.3)%1))/6,1.7),y=L(1060,1330,q);x.moveTo(80,y);x.lineTo(1000,y)}x.stroke();
  x.restore();
  neon(()=>{x.beginPath();x.moveTo(70,1040);x.lineTo(1010,1040)},c,6,30,alpha);
}
function laptop(T,col,alpha=1,logo=0){
  x.save();x.globalAlpha*=alpha;x.fillStyle='#0A0912';rr(405,842,270,178,16);x.fill();x.restore();
  neon(()=>{rr(405,842,270,178,16)},css(col),6,34,alpha);
  neon(()=>{x.beginPath();x.moveTo(372,1026);x.lineTo(708,1026)},css(col),8,30,alpha);
  if(logo>0)asterisk(CX,931,46*logo,C.orange,logo*alpha,T);
}
function asterisk(X,Y,r,col,alpha=1,T=0){if(alpha<=0||r<=0)return;x.save();x.globalAlpha*=alpha;x.translate(X,Y);x.rotate(T*.4);x.strokeStyle=col;x.lineCap='round';x.lineWidth=r*.16;x.shadowColor=col;x.shadowBlur=r*.8;
  const ls=[1,.78,.95,.7,1,.82,.9,.74,.96,.8,.88,.76];x.beginPath();for(let i=0;i<12;i++){const a=i*Math.PI/6;x.moveTo(Math.cos(a)*r*.14,Math.sin(a)*r*.14);x.lineTo(Math.cos(a)*r*ls[i],Math.sin(a)*r*ls[i])}x.stroke();x.restore()}
function omino(T,col,face,alpha=1,sweat=0){
  if(alpha<=0)return;const c=css(col);const nod=Math.sin(T*6)*3*(face==='work'?1:.3);
  // body dome
  neon(()=>{x.beginPath();x.arc(CX,912,150,Math.PI,0)},c,6,30,alpha);
  // head
  const hy=650+nod;x.save();x.globalAlpha*=alpha;x.fillStyle='#0B0A14';x.beginPath();x.arc(CX,hy,80,0,7);x.fill();
  // screen light on face
  if(face==='work'){const fl=.5+.5*Math.sin(T*11)*Math.sin(T*3.7);const g=x.createRadialGradient(CX,hy+50,10,CX,hy+20,110);g.addColorStop(0,css(col,.18+.12*fl));g.addColorStop(1,css(col,0));x.fillStyle=g;x.beginPath();x.arc(CX,hy,80,0,7);x.fill()}
  x.restore();
  neon(()=>{x.beginPath();x.arc(CX,hy,80,0,7)},c,6,32,alpha);
  // face
  neon(()=>{x.beginPath();
    if(face==='work'){x.moveTo(510,hy-6);x.lineTo(528,hy-6);x.moveTo(552,hy-6);x.lineTo(570,hy-6);x.moveTo(528,hy+30);x.lineTo(552,hy+30)}
    else if(face==='shock'){x.moveTo(531,hy-10);x.arc(519,hy-10,12,0,7);x.moveTo(573,hy-10);x.arc(561,hy-10,12,0,7);x.moveTo(551,hy+32);x.arc(540,hy+32,11,0,7)}
    else{x.moveTo(505,hy-16);x.lineTo(526,hy-25);x.moveTo(575,hy-16);x.lineTo(554,hy-25);x.moveTo(520,hy);x.arc(520,hy-2,3,0,7);x.moveTo(563,hy);x.arc(560,hy-2,3,0,7);x.moveTo(518,hy+40);x.quadraticCurveTo(540,hy+18,562,hy+40)}
  },c,5,16,alpha);
  if(sweat>0){const q=(T*1.1)%1;x.save();x.globalAlpha=alpha*sweat*(1-q);x.fillStyle='#7FD2FF';x.shadowColor='#7FD2FF';x.shadowBlur=14;x.beginPath();const sx=618,sy=hy-40+q*90;x.moveTo(sx,sy-18);x.quadraticCurveTo(sx+12,sy,sx,sy+8);x.quadraticCurveTo(sx-12,sy,sx,sy-18);x.fill();x.restore()}
  // typing: keycaps popping up from laptop
  if(face==='work'){const keys=['⌘','Z','C','V','⇧','X'];for(let i=0;i<6;i++){const q=((T*1.6)+i/6)%1;const kx=430+((i*97)%220),ky=840-q*170;x.save();x.globalAlpha=alpha*Math.sin(q*Math.PI)*.85;x.fillStyle='rgba(20,22,40,.85)';rr(kx-22,ky-22,44,44,10);x.fill();x.strokeStyle=css(col,.8);x.lineWidth=2;x.stroke();txt(keys[i],kx,ky+1,{size:22,weight:700,font:'Spc',color:'#DDE6FF'});x.restore()}}
}
function appIcon(X,Y,s,label,col,alpha=1,T=0){if(alpha<=0)return;x.save();x.globalAlpha*=alpha;x.translate(X,Y+Math.sin(T*1.6+X)*10);x.rotate(Math.sin(T*.9+Y)*.06);
  x.shadowColor=col;x.shadowBlur=26;const g=x.createLinearGradient(0,-s/2,0,s/2);g.addColorStop(0,'#2A2840');g.addColorStop(1,'#110F1E');x.fillStyle=g;rr(-s/2,-s/2,s,s,s*.26);x.fill();x.shadowBlur=0;
  x.strokeStyle=col;x.lineWidth=3;rr(-s/2,-s/2,s,s,s*.26);x.stroke();
  if(label==='Da'){x.fillStyle=col;[[-1,.6],[1,.6],[0,-.6]].forEach(([a,b])=>{x.beginPath();x.arc(a*s*.13,b*s*.12,s*.11,0,7);x.fill()})}else txt(label,0,2,{size:s*.36,weight:700,font:'Spc',color:col});x.restore()}
function holoTimeline(T,alpha){if(alpha<=0)return;x.save();x.globalAlpha*=alpha;x.translate(CX,345);
  x.fillStyle='rgba(18,20,44,.62)';rr(-380,-120,760,240,22);x.fill();x.strokeStyle='rgba(130,160,255,.35)';x.lineWidth=2;x.stroke();
  txt('progetto_FINALE_v12_def.prproj',-350,-88,{size:24,weight:500,font:'Spc',color:C.muted,align:'left'});
  const tc=Math.floor(T*30);txt(`00:00:${String(10+Math.floor(T)).padStart(2,'0')}:${String(tc%30).padStart(2,'0')}`,350,-88,{size:24,weight:700,font:'Spc',color:'#AFC3FF',align:'right'});
  const tracks=[[['#5B8CFF',0,180],['#5B8CFF',200,140],['#5B8CFF',360,260]],[['#9B8CFF',40,240],['#9B8CFF',300,180],['#9B8CFF',500,180]],[['#FF8F5A',0,700]]];
  tracks.forEach((tr,j)=>tr.forEach(([c,a,w],i)=>{const off=j===0&&i===1?Math.sin(T*3)*20:0;x.fillStyle=c;x.globalAlpha=alpha*(j===2?.45:.8);rr(-350+a+off,-45+j*52,w-8,40,8);x.fill()}));
  x.globalAlpha=alpha;const ph=-350+((T*260)%700);x.strokeStyle='#FF3B5C';x.lineWidth=3;x.beginPath();x.moveTo(ph,-60);x.lineTo(ph,110);x.stroke();x.fillStyle='#FF3B5C';x.beginPath();x.moveTo(ph-10,-66);x.lineTo(ph+10,-66);x.lineTo(ph,-54);x.fill();
  x.restore()}

/* ---------- scenes A-D: the editor at the desk ---------- */
function stamp(T){const k=p(T,1.22,1.4);if(k<=0)return;const out=p(T,2.5,2.9);if(out>=1)return;
  x.save();x.translate(CX,520);x.rotate(-.12);const s=L(2.6,1,eo(k))*L(1,.8,eo(out));x.scale(s,s);x.globalAlpha=k*(1-out);
  x.shadowColor=C.red;x.shadowBlur=30;x.strokeStyle=C.red;x.lineWidth=11;rr(-300,-72,600,144,20);x.stroke();x.shadowBlur=0;
  txt('LICENZIATO',0,4,{size:96,weight:800,color:C.red,glow:24,ls:2});x.restore()}
function counter(T,alpha){if(alpha<=0)return;x.save();x.globalAlpha*=alpha;
  txt('il mio editor',CX,200,{size:34,weight:500,color:C.muted});
  const v=2000*ex(p(T,2.55,3.4));const pop=1+.08*Math.exp(-Math.max(0,T-3.4)*8)*(T>3.4);
  x.save();x.translate(CX,300);x.scale(pop,pop);txt(`€${fmt(v)}`,0,0,{size:150,weight:900,font:'Unb',color:C.white,glow:20});x.restore();
  txt('/ mese',CX,395,{size:40,weight:700,color:C.red,glow:12});
  // 4 x 500 split
  for(let i=0;i<4;i++){const k=back(p(T,3.9+i*.16,4.2+i*.16));if(k<=0)continue;const X=CX-330+i*220;x.save();x.translate(X,500);x.scale(k,k);
    x.fillStyle='rgba(40,14,24,.85)';rr(-95,-48,190,96,18);x.fill();x.strokeStyle=C.red;x.lineWidth=3;x.shadowColor=C.red;x.shadowBlur=16;x.stroke();x.shadowBlur=0;
    x.fillStyle=C.red;x.beginPath();x.moveTo(-62,-12);x.lineTo(-40,0);x.lineTo(-62,12);x.fill();txt('500 €',15,2,{size:36,weight:800,color:C.white});x.restore()}
  x.restore()}
function calendar(T,alpha){if(alpha<=0)return;x.save();x.globalAlpha*=alpha;
  txt('21 GIORNI · 4 VIDEO',CX,190,{size:36,weight:700,font:'Spc',color:C.white,ls:6});
  const n=Math.floor(ex(p(T,5.15,7.7))*21.99);
  for(let i=0;i<21;i++){const c=i%7,r=Math.floor(i/7),X=CX-287+c*84,Y=240+r*72;const on=i<n;
    x.fillStyle=on?'rgba(255,59,92,.32)':'rgba(255,255,255,.05)';rr(X,Y,74,60,12);x.fill();x.strokeStyle=on?C.red:'rgba(255,255,255,.14)';x.lineWidth=on?3:2;if(on){x.shadowColor=C.red;x.shadowBlur=14}x.stroke();x.shadowBlur=0;
    txt(String(i+1),X+37,Y+31,{size:26,weight:700,font:'Spc',color:on?'#fff':C.muted})}
  // render card
  const rp=3+24*p(T,5.2,7.9);x.save();x.translate(200,600);x.rotate(-.06+Math.sin(T*1.3)*.02);x.fillStyle='rgba(22,20,40,.85)';rr(-130,-55,260,110,18);x.fill();x.strokeStyle='rgba(255,255,255,.18)';x.lineWidth=2;x.stroke();
  txt('Render video 1/4',-105,-20,{size:26,weight:700,align:'left'});x.fillStyle='rgba(255,255,255,.1)';rr(-105,14,210,12,6);x.fill();x.fillStyle=C.red;rr(-105,14,210*rp/100,12,6);x.fill();txt(`${Math.floor(rp)}%`,105,-20,{size:22,weight:700,font:'Spc',color:C.red,align:'right'});x.restore();
  // clock
  x.save();x.translate(880,600);x.fillStyle='rgba(22,20,40,.85)';rr(-60,-60,120,120,26);x.fill();x.strokeStyle=C.red;x.lineWidth=3;x.shadowColor=C.red;x.shadowBlur=14;x.stroke();x.shadowBlur=0;
  x.strokeStyle='#fff';x.lineWidth=5;x.lineCap='round';x.beginPath();x.arc(0,0,30,0,7);x.stroke();x.save();x.rotate(T*9);x.beginPath();x.moveTo(0,0);x.lineTo(0,-22);x.stroke();x.restore();x.save();x.rotate(T*.8);x.beginPath();x.moveTo(0,0);x.lineTo(14,0);x.stroke();x.restore();x.restore();
  x.restore()}
const PARTS=Array.from({length:70},(_,i)=>{const r=rng(300+i);const a=r()*Math.PI*2,d=r();return{x:CX+Math.cos(a)*d*150,y:650+Math.sin(a)*d*160+(r()<.5?200:0),v:200+r()*500,s:2+r()*5}});
function deskScene(T){
  const col=mood(T),c=css(col);
  // camera push into laptop 9.7-10.6
  const push=ei(p(T,9.75,10.6));x.save();if(push>0){x.translate(CX,931);x.scale(1+push*7,1+push*7);x.translate(-CX,-931)}
  desk(T,col);
  const om=1-p(T,8.05,8.6);
  if(om>0)omino(T,col,T<1.25?'work':T<2.4?'shock':'sad',om,p(T,5.4,6));
  if(T>=8.05&&T<9.6){const k=p(T,8.05,9.4);for(const q of PARTS){x.fillStyle=css(col,(1-k)*.9);x.beginPath();x.arc(q.x+Math.sin(k*6+q.v)*20,q.y-k*q.v,q.s*(1-k*.5),0,7);x.fill()}}
  laptop(T,col,1,back(p(T,8.45,8.9)));
  holoTimeline(T,1-p(T,1.22,1.5));
  const ia=1-p(T,1.3,1.8);appIcon(160,440,120,'Pr','#9999FF',ia,T);appIcon(925,400,120,'Ae','#B7A6FF',ia,T);appIcon(925,610,110,'Da','#FF9D5C',ia,T);
  x.restore();
  if(push>0){x.save();x.globalAlpha=push;for(let i=0;i<60;i++){const a=i/60*Math.PI*2+i,r0=L(500,60,push)+((i*37)%200);x.strokeStyle=i%3?C.orange:'#fff';x.lineWidth=3;x.beginPath();x.moveTo(CX+Math.cos(a)*r0,931+Math.sin(a)*r0);x.lineTo(CX+Math.cos(a)*(r0+400*push),931+Math.sin(a)*(r0+400*push));x.stroke()}
    const g=x.createRadialGradient(CX,931,10,CX,931,900);g.addColorStop(0,`rgba(255,170,120,${push*.9})`);g.addColorStop(1,'rgba(255,143,90,0)');x.fillStyle=g;x.fillRect(0,0,W,H);x.restore()}
  stamp(T);
  counter(T,eo(p(T,2.45,2.8))*(1-p(T,4.85,5.1)));
  calendar(T,eo(p(T,5.0,5.35))*(1-p(T,7.85,8.15)));
}

/* ---------- E: animated charts ---------- */
function iconCard(X,Y,s,col,g,alpha=1,T=0){if(alpha<=0)return;x.save();x.globalAlpha*=alpha;x.translate(X,Y);
  x.shadowColor=col;x.shadowBlur=40;const gr=x.createLinearGradient(0,-s/2,0,s/2);gr.addColorStop(0,'#2B2938');gr.addColorStop(1,'#0E0D16');x.fillStyle=gr;rr(-s/2,-s/2,s,s,s*.27);x.fill();x.shadowBlur=0;
  x.strokeStyle=col;x.lineWidth=4;rr(-s/2,-s/2,s,s,s*.27);x.stroke();
  const gl=x.createLinearGradient(0,-s/2,0,0);gl.addColorStop(0,'rgba(255,255,255,.14)');gl.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=gl;rr(-s/2,-s/2,s,s/2,[s*.27,s*.27,0,0]);x.fill();
  x.strokeStyle=col;x.fillStyle=col;x.lineWidth=s*.07;x.lineCap='round';x.lineJoin='round';x.shadowColor=col;x.shadowBlur=18;const u=s*.22;

    case'riser':g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+arg-.05);g.gain.exponentialRampToValueAtTime(.0001,t+arg);osc('sawtooth',110,1500,arg);nf(arg,'bandpass',300,6000,2);break;
    case'boom':env(g,t,.005,1,.9);osc('sine',120,30,1);break;
    case'kick':env(g,t,.002,.22,.6);osc('sine',140,45,.22);break;
    case'hat':env(g,t,.001,.04,.08);nf(.05,'highpass',8000,9000);break;
    case'grow':g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.3);g.gain.exponentialRampToValueAtTime(.0001,t+.8);osc('triangle',arg||300,(arg||300)*2,.8);break;
    case'ding':env(g,t,.005,.7,.3);osc('sine',1568,1568,.7);osc('sine',2349,2349,.6);break;
    case'zip':env(g,t,.01,.3,.3);osc('sawtooth',400,2400,.3);break;
  }}
const CUES=[[0,'pad',8],[1.25,'stamp'],[1.27,'down'],[2.45,'swoosh'],[3.42,'cash'],[5.0,'swoosh'],[6.6,'down'],[8.05,'swoosh'],[8.5,'chime'],[9.6,'riser',1.0],[10.6,'boom'],[10.6,'swoosh'],
  [10.85,'grow',260],[11.65,'grow',520],[12.15,'ding'],[12.9,'swoosh'],[13.15,'grow',220],[13.95,'grow',520],[14.35,'ding'],[15.1,'swoosh'],[15.75,'zip'],[16.1,'ding'],[17.4,'swoosh'],[18.4,'cash'],[17.9,'grow',300],[18.7,'ding'],
  [19.4,'swoosh'],[20.55,'chime'],[21.8,'swoosh'],[23.45,'pop',700],[23.5,'chime']];
for(let tt=.05;tt<1.2;tt+=.085+((tt*7)%1)*.05)CUES.push([tt,'key']);
for(let tt=2.55;tt<3.4;tt+=.055)CUES.push([tt,'tick']);
for(let i=0;i<4;i++)CUES.push([3.9+i*.16,'pop',400+i*120]);
for(let i=0;i<21;i++)CUES.push([5.15+Math.log(1-(i+1)/22.5)/-10*2.55,'tick2',700+i*12]);
for(let i=0;i<4;i++)CUES.push([19.8+i*.18,'pop',380+i*90]);
for(let i=0;i<6;i++)CUES.push([22.65+i*.1,'key']);
for(let tt=10.6;tt<21.8;tt+=.5){CUES.push([tt,'kick']);CUES.push([tt+.25,'hat'])}
for(let tt=22.0;tt<25.5;tt+=1){CUES.push([tt,'kick'])}
function fire(a,b){for(const e of CUES)if(e[0]>=a&&e[0]<b)sfx(e[1],undefined,e[2])}

/* ---------- loop ---------- */
let t=0,playing=false,last=performance.now();
const pb=document.getElementById('play'),sc=document.getElementById('scrub'),tm=document.getElementById('tm');
pb.onclick=()=>{initAudio();if(AC.state==='suspended')AC.resume();playing=!playing;pb.textContent=playing?'❚❚':'▶'};
sc.oninput=()=>{t=+sc.value};
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(playing){const pr=t;t+=dt;if(t>=DUR){fire(pr,DUR);t-=DUR;fire(0,t)}else fire(pr,t);sc.value=t}
  render(t);tm.textContent=`${t.toFixed(2)} / 25.5`;requestAnimationFrame(frame)}
Promise.all(['500 50px Bric','700 50px Bric','800 50px Bric','700 50px Unb','900 50px Unb','500 50px Spc','700 50px Spc'].map(f=>document.fonts.load(f))).finally(()=>requestAnimationFrame(frame));
