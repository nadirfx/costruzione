<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>30 video: 240 ore</title>
<style>
  @font-face{font-family:Bric;font-weight:500;src:url(fonts/BricolageGrotesque-500.ttf)}
  @font-face{font-family:Bric;font-weight:700;src:url(fonts/BricolageGrotesque-700.ttf)}
  @font-face{font-family:Bric;font-weight:800;src:url(fonts/BricolageGrotesque-800.ttf)}
  @font-face{font-family:Unb;font-weight:700;src:url(fonts/Unbounded-700.ttf)}
  @font-face{font-family:Unb;font-weight:900;src:url(fonts/Unbounded-900.ttf)}
  @font-face{font-family:Spc;font-weight:500;src:url(fonts/SpaceGrotesk-500.ttf)}
  @font-face{font-family:Spc;font-weight:700;src:url(fonts/SpaceGrotesk-700.ttf)}
  body{margin:0;background:#07070D;color:#EEE;font-family:Bric,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px}
  canvas{width:min(100%,calc(80vh*9/16));aspect-ratio:9/16;border-radius:18px;background:#000}
  .ctrl{display:flex;gap:8px;align-items:center;width:min(100%,calc(80vh*9/16))}
  button{background:#12121A;color:#EEE;border:1px solid #2A2A36;border-radius:10px;height:38px;min-width:38px;font:700 14px Bric,sans-serif;cursor:pointer}
  input{flex:1;accent-color:#FF8F5A}
  span{font:500 13px Spc,monospace;color:#999;min-width:90px;text-align:right}
</style>
</head>
<body>
<canvas id="cv" width="1080" height="1920"></canvas>
<div class="ctrl"><button id="play">▶</button><input id="scrub" type="range" min="0" max="25" step="0.01" value="0"><span id="tm">0.00 / 25</span></div>
<script>
const W=1080,H=1920,DUR=25,CX=540;
const MADE_IN='meno di 2 ore'; // tempo reale di produzione di questo video (misurato)
const C={blue:'#5B8CFF',red:'#FF3B5C',orange:'#FF8F5A',green:'#35E08A',white:'#F3F1FA',muted:'#9A98B0',purple:'#9B8CFF',yellow:'#FFD45A'};
const RGB={blue:[91,140,255],red:[255,59,92],orange:[255,143,90],green:[53,224,138],purple:[140,100,255]};
const cv=document.getElementById('cv'),MAIN=cv.getContext('2d');let x=MAIN;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),p=(t,a,b)=>clamp((t-a)/(b-a)),L=(a,b,k)=>a+(b-a)*k;
const eo=k=>1-Math.pow(1-k,3),ex=k=>k>=1?1:1-Math.pow(2,-10*k),ei=k=>k*k*k,eio=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const back=k=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};
const spring=k=>k<=0?0:1-Math.exp(-6*k)*Math.cos(9*k);
function rng(s){return()=>(s=(s*16807)%2147483647)/2147483647}
function rr(X,Y,w,h,r){x.beginPath();x.roundRect(X,Y,w,h,r)}
function lerpC(a,b,k){return a.map((v,i)=>Math.round(L(v,b[i],k)))}
const css=(c,a=1)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
function txt(s,X,Y,o={}){const{size=60,weight=500,font='Bric',color=C.white,align='center',alpha=1,ls=0,maxW=0,glow=0}=o;if(alpha<=0)return size;
  x.save();x.globalAlpha*=alpha;x.textAlign=align;x.textBaseline='middle';let sz=size;x.font=`${weight} ${sz}px ${font}`;x.letterSpacing=ls+'px';
  if(maxW){const w=x.measureText(s).width;if(w>maxW){sz=size*maxW/w;x.font=`${weight} ${sz}px ${font}`}}
  if(glow){x.shadowColor=color;x.shadowBlur=glow}x.fillStyle=color;x.fillText(s,X,Y);x.restore();return sz}
function tw(s,size,weight=500,font='Bric'){x.save();x.font=`${weight} ${size}px ${font}`;const w=x.measureText(s).width;x.restore();return w}
function neon(fn,col,w=6,glow=34,alpha=1){if(alpha<=0)return;x.save();x.globalAlpha*=alpha;x.lineCap='round';x.lineJoin='round';
  x.strokeStyle=col;x.lineWidth=w;x.shadowColor=col;x.shadowBlur=glow;fn();x.stroke();x.shadowBlur=0;x.strokeStyle='rgba(255,255,255,.55)';x.lineWidth=w*.3;fn();x.stroke();x.restore()}

/* ---------- mood ---------- */
const MOOD=[[0,'purple'],[2.0,'purple'],[2.4,'red'],[8.6,'red'],[9.0,'orange'],[12.0,'orange'],[12.2,'blue'],[17.8,'green'],[18.2,'orange'],[25,'orange']];
function mood(T){for(let i=0;i<MOOD.length-1;i++){const[a,ca]=MOOD[i],[b,cb]=MOOD[i+1];if(T<=b)return lerpC(RGB[ca],RGB[cb],eio(p(T,a,b)))}return RGB.orange}

/* ---------- camera ---------- */
const BEATS=[];for(let tt=9.4;tt<25;tt+=.5)BEATS.push(tt);
function beatPulse(T){let a=0;for(const b of BEATS)if(T>=b&&T<b+.5)a+=Math.exp(-(T-b)*9);return a}
const IMPACT=[[0.9,16],[6.0,10],[8.6,30],[9.4,26],[10.2,18],[18.0,10],[21.2,12]];
const WHIPS=[[2.2,-1,0],[6.6,0,-1],[12,-1,0],[14,-1,0],[16,-1,0]];
function camera(T){let s=1.02+.03*Math.sin(T*.6),tx=Math.sin(T*.95)*46+Math.sin(T*2.3)*14,ty=Math.cos(T*.8)*36+Math.sin(T*1.7)*12,r=Math.sin(T*.62)*.028+Math.sin(T*1.9)*.006;
  {const q=1-eo(p(T,0,.9));s+=.3*q;r+=.08*q}
  const B=[0,2.2,4.2,6.6,8.6,9.4,12,14,16,18,21,25];for(let i=0;i<B.length-1;i++)if(T>=B[i]&&T<B[i+1])s+=.07*eio(p(T,B[i],B[i+1]));
  s+=.045*beatPulse(T);for(const[t0,a]of IMPACT)if(T>=t0)s+=a*.0015*Math.exp(-(T-t0)*7);
  for(const[b,dx,dy]of WHIPS)if(T>=b-.25&&T<b+.3){const q=Math.sin(p(T,b-.25,b+.3)*Math.PI);tx+=dx*q*160;ty+=dy*q*160}
  return{s,tx,ty,r}}
function shakeAmt(T){let a=0;for(const[t0,s]of IMPACT)if(T>=t0)a+=s*Math.exp(-(T-t0)*10);if(T>=8.6&&T<9.4)a+=10;return a}

/* ---------- background ---------- */
let BOKEH=null;
function makeBokeh(){const c=document.createElement('canvas');c.width=W+300;c.height=H+300;const g=c.getContext('2d');g.filter='blur(46px)';const r=rng(5);
  const cols=['rgba(110,80,255,.35)','rgba(60,90,230,.32)','rgba(255,120,90,.18)','rgba(160,90,255,.28)'];
  for(let i=0;i<22;i++){const s=120+r()*200;g.fillStyle=cols[i%4];g.beginPath();g.roundRect(r()*(W+300)-s/2,r()*(H+300)-s/2,s,s,s*.28);g.fill()}return c}
const DUST=Array.from({length:46},(_,i)=>{const r=rng(100+i);return{x:r()*W,y:r()*H,s:1+r()*2.6,v:8+r()*26,o:r()}});
function bg(T){
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#08081A');g.addColorStop(.45,'#141030');g.addColorStop(1,'#07070F');x.fillStyle=g;x.fillRect(0,0,W,H);
  if(!BOKEH)BOKEH=makeBokeh();const cm=camera(T);x.drawImage(BOKEH,-150+Math.sin(T*.25)*40-cm.tx*.9,-150+Math.cos(T*.2)*50-cm.ty*.9);
  x.save();x.translate(CX,860);x.rotate(cm.r*1.6);x.scale(cm.s*1.1,cm.s*1.1);x.translate(-CX-cm.tx*1.4,-860-cm.ty*1.4);x.strokeStyle='rgba(255,255,255,.035)';x.lineWidth=2;x.beginPath();for(let gx=-300;gx<W+300;gx+=120){x.moveTo(gx,-300);x.lineTo(gx,H+300)}for(let gy=-300;gy<H+300;gy+=120){x.moveTo(-300,gy);x.lineTo(W+300,gy)}x.stroke();x.restore();
  {const q=(T*.45)%1,bx=L(-700,W+700,q);const lg=x.createLinearGradient(bx-260,0,bx+260,0);lg.addColorStop(0,'rgba(255,255,255,0)');lg.addColorStop(.5,'rgba(255,255,255,.07)');lg.addColorStop(1,'rgba(255,255,255,0)');x.save();x.translate(bx,H/2);x.rotate(.35);x.translate(-bx,-H/2);x.fillStyle=lg;x.fillRect(bx-260,-400,520,H+800);x.restore()}
  const m=mood(T),rg=x.createRadialGradient(CX,820,40,CX,820,1050);rg.addColorStop(0,css(m,.26));rg.addColorStop(1,css(m,0));x.fillStyle=rg;x.fillRect(0,0,W,H);
  for(const d of DUST){const y=((d.y-T*d.v)%H+H)%H;x.fillStyle=`rgba(255,255,255,${.12+.25*(.5+.5*Math.sin(T*2+d.o*9))})`;x.beginPath();x.arc(d.x+Math.sin(T*.5+d.o*6)*12,y,d.s,0,7);x.fill()}
}
const FG=Array.from({length:12},(_,i)=>{const r=rng(900+i);return{x:r()*W,y:r()*H,s:30+r()*70,v:40+r()*90}});
let FGS=null;function foreground(T,cam){if(!FGS){FGS=document.createElement('canvas');FGS.width=FGS.height=200;const g=FGS.getContext('2d');const rg=g.createRadialGradient(100,100,0,100,100,100);rg.addColorStop(0,'rgba(255,220,200,.22)');rg.addColorStop(1,'rgba(255,220,200,0)');g.fillStyle=rg;g.fillRect(0,0,200,200)}
  for(const f of FG){const X=((f.x+T*f.v*1.4-cam.tx*1.8)%(W+300)+W+300)%(W+300)-150,Y=((f.y-T*f.v*.6-cam.ty*1.8)%(H+300)+H+300)%(H+300)-150;x.drawImage(FGS,X-f.s,Y-f.s,f.s*2,f.s*2)}}

/* ---------- shared drawings ---------- */
const HUES=[[91,140,255],[255,59,92],[255,143,90],[53,224,138],[155,140,255],[255,212,90]];
function miniVideo(X,Y,w,h,i,T,done=0){ // a small phone playing a mini motion piece
  x.save();x.translate(X,Y);
  x.fillStyle='#0B0A14';rr(-w/2,-h/2,w,h,w*.16);x.fill();
  x.save();rr(-w/2+5,-h/2+5,w-10,h-10,w*.13);x.clip();
  const c=HUES[i%6],c2=HUES[(i+2)%6];const g=x.createLinearGradient(0,-h/2,0,h/2);g.addColorStop(0,css(c,.55));g.addColorStop(1,css(c2,.2));x.fillStyle=g;x.fillRect(-w/2,-h/2,w,h);
  const k=i%4,ph=T*2.2+i;
  x.fillStyle='rgba(255,255,255,.9)';
  if(k===0){x.beginPath();x.arc(Math.sin(ph)*w*.25,Math.cos(ph*1.3)*h*.2,w*.13,0,7);x.fill()}
  else if(k===1){x.save();x.rotate(ph);x.fillRect(-w*.15,-w*.15,w*.3,w*.3);x.restore()}
  else if(k===2){for(let j=0;j<3;j++){const bh=h*.15*(1+Math.sin(ph*2+j));x.fillRect(-w*.25+j*w*.2,h*.25-bh,w*.12,bh)}}
  else{x.lineWidth=5;x.strokeStyle='#fff';x.beginPath();for(let j=0;j<=12;j++){const xx=-w*.35+j*w*.06,yy=Math.sin(ph*2+j*.7)*h*.08;j?x.lineTo(xx,yy):x.moveTo(xx,yy)}x.stroke()}
  x.fillStyle='rgba(255,255,255,.7)';x.fillRect(-w*.3,h*.32,w*.6*(.4+.6*((ph*.2)%1)),4);
  x.restore();
  x.strokeStyle=css(c,.9);x.lineWidth=3;x.shadowColor=css(c);x.shadowBlur=14;rr(-w/2,-h/2,w,h,w*.16);x.stroke();x.shadowBlur=0;
  if(done>0){x.save();x.globalAlpha=Math.min(1,done*2);x.translate(w*.3,-h*.36);x.scale(back(clamp(done)),back(clamp(done)));x.fillStyle=C.green;x.beginPath();x.arc(0,0,18,0,7);x.fill();x.strokeStyle='#06140B';x.lineWidth=5;x.lineCap='round';x.beginPath();x.moveTo(-8,0);x.lineTo(-2,7);x.lineTo(9,-7);x.stroke();x.restore()}
  x.restore()}
const WALL=Array.from({length:30},(_,i)=>{const c=i%6,r=Math.floor(i/6);return{X:CX-375+c*150,Y:300+r*215,d:(c*.05+r*.07)}});
function wall(T,t0,o={}){const{drop=true,done=-1,scale=1}=o;
  WALL.forEach((w,i)=>{let Y=w.Y;let s=1;if(drop){const k=p(T,t0+w.d,t0+w.d+.45);if(k<=0)return;Y=L(w.Y-1500,w.Y,bounceE(k));s=L(.8,1,k)}
    const dk=done>=0?p(T,done+i*.025,done+i*.025+.3):0;x.save();x.translate(CX,860);x.scale(scale,scale);x.translate(-CX,-860);
    x.save();x.translate(w.X,Y);x.rotate(Math.sin(T*1.5+i)*.03);x.scale(s,s);miniVideo(0,0,112,196,i,T,dk);x.restore();x.restore()})}
function bounceE(k){const n=7.5625,d=2.75;if(k<1/d)return n*k*k;if(k<2/d)return n*(k-=1.5/d)*k+.75;if(k<2.5/d)return n*(k-=2.25/d)*k+.9375;return n*(k-=2.625/d)*k+.984375}
function omino(X,Y,s,col,face,T,work=true){x.save();x.translate(X,Y);x.scale(s,s);x.rotate(Math.sin(T*1.4)*.03);
  const c=css(col);
  neon(()=>{x.beginPath();x.arc(0,262,150,Math.PI,0)},c,6,30);
  const hy=Math.sin(T*6)*3*(work?1:.3);x.fillStyle='#0B0A14';x.beginPath();x.arc(0,hy,80,0,7);x.fill();
  neon(()=>{x.beginPath();x.arc(0,hy,80,0,7)},c,6,32);
  neon(()=>{x.beginPath();if(face==='work'){x.moveTo(-30,hy-6);x.lineTo(-12,hy-6);x.moveTo(12,hy-6);x.lineTo(30,hy-6);x.moveTo(-12,hy+30);x.lineTo(12,hy+30)}
    else{x.moveTo(-35,hy-16);x.lineTo(-14,hy-25);x.moveTo(35,hy-16);x.lineTo(14,hy-25);x.moveTo(-20,hy);x.arc(-20,hy-2,3,0,7);x.moveTo(23,hy);x.arc(20,hy-2,3,0,7);x.moveTo(-22,hy+40);x.quadraticCurveTo(0,hy+18,22,hy+40)}},c,5,16);
  x.fillStyle='#0A0912';rr(-135,192,270,178,16);x.fill();neon(()=>{rr(-135,192,270,178,16)},c,6,34);neon(()=>{x.beginPath();x.moveTo(-168,376);x.lineTo(168,376)},c,8,30);
  x.restore()}
function asteriskRays(r,col,T){x.save();x.rotate(T*.4);x.strokeStyle=col;x.lineCap='round';x.lineWidth=r*.16;x.shadowColor=col;x.shadowBlur=r*.6;const ls=[1,.78,.95,.7,1,.82,.9,.74,.96,.8,.88,.76];x.beginPath();for(let i=0;i<12;i++){const a=i*Math.PI/6;x.moveTo(Math.cos(a)*r*.5,Math.sin(a)*r*.5);x.lineTo(Math.cos(a)*r*ls[i]*1.25,Math.sin(a)*r*ls[i]*1.25)}x.stroke();x.restore()}
function mascot(X,Y,r,T,o={}){const{wave=0,snap=0,alpha=1}=o;x.save();x.globalAlpha*=alpha;x.translate(X,Y);
  const bo=Math.abs(Math.sin(T*4.2));x.translate(0,-bo*22);x.scale(1+.06*(1-bo),1-.06*(1-bo));
  asteriskRays(r,C.orange,T);
  const g=x.createRadialGradient(-r*.15,-r*.2,4,0,0,r*.55);g.addColorStop(0,'#FFC4A3');g.addColorStop(1,'#E8683A');x.fillStyle=g;x.shadowColor=C.orange;x.shadowBlur=40;x.beginPath();x.arc(0,0,r*.55,0,7);x.fill();x.shadowBlur=0;
  const blink=(T%2.6)<.12?.15:1;x.fillStyle='#1A0D08';[-1,1].forEach(sd=>{x.beginPath();x.ellipse(sd*r*.18,-r*.08,r*.07,r*.1*blink,0,0,7);x.fill()});
  x.strokeStyle='#1A0D08';x.lineWidth=r*.06;x.lineCap='round';x.beginPath();x.arc(0,r*.08,r*.2,.15*Math.PI,.85*Math.PI);x.stroke();
  x.fillStyle='rgba(255,120,120,.5)';[-1,1].forEach(sd=>{x.beginPath();x.arc(sd*r*.32,r*.12,r*.07,0,7);x.fill()});
  if(snap>0){const q=snap;x.strokeStyle=C.yellow;x.lineWidth=6;for(let i=0;i<8;i++){const a=i*Math.PI/4;x.globalAlpha=alpha*(1-q);x.beginPath();x.moveTo(r*.9+Math.cos(a)*30*q,-r*.4+Math.sin(a)*30*q);x.lineTo(r*.9+Math.cos(a)*(30+50*q),-r*.4+Math.sin(a)*(30+50*q));x.stroke()}x.globalAlpha=alpha}
  // little arm waving
  x.strokeStyle=C.orange;x.lineWidth=r*.09;x.beginPath();x.moveTo(r*.5,0);const wa=wave?Math.sin(T*10)*.5:0;x.lineTo(r*.5+Math.cos(-.9+wa)*r*.45,Math.sin(-.9+wa)*r*.45);x.stroke();
  x.restore()}
function snail(X,Y,s,T,o={}){const{alpha=1,sleepy=true,stack=true,spin=0}=o;x.save();x.globalAlpha*=alpha;x.translate(X,Y);x.rotate(spin);x.scale(s,s);
  const crawl=Math.sin(T*2.4)*.06;
  const c=C.yellow;
  neon(()=>{x.beginPath();x.moveTo(-170,40);x.quadraticCurveTo(-170,0,-120,0);x.lineTo(120,-6+crawl*40);x.quadraticCurveTo(190,-10,200,-70);x.moveTo(-170,40);x.lineTo(150,40);x.quadraticCurveTo(200,40,200,-70)},c,7,24);
  // eye stalks
  neon(()=>{x.beginPath();x.moveTo(185,-70);x.lineTo(205,-150+Math.sin(T*3)*8);x.moveTo(170,-66);x.lineTo(160,-145+Math.cos(T*3)*8)},c,6,18);
  x.fillStyle='#fff';[[205,-150+Math.sin(T*3)*8],[160,-145+Math.cos(T*3)*8]].forEach(([a,b])=>{x.beginPath();x.arc(a,b,12,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(a+2,b+(sleepy?4:0),sleepy?3:6,0,7);x.fill();x.fillStyle='#fff'});
  // shell spiral
  x.save();x.translate(-10,-70);x.fillStyle='#0B0A14';x.beginPath();x.arc(0,0,110,0,7);x.fill();
  neon(()=>{x.beginPath();for(let a=0;a<Math.PI*5.5;a+=.1){const r=110-a*6;const px=Math.cos(a+T*.5)*r,py=Math.sin(a+T*.5)*r;a?x.lineTo(px,py):x.moveTo(px,py)}},C.orange,6,22);x.restore();
  // tower of videos on the shell
  if(stack)for(let i=0;i<6;i++){x.save();x.translate(-10+Math.sin(T*2+i)*6*i,-200-i*58);x.rotate(Math.sin(T*1.5+i)*.06*i);miniVideo(0,0,110,52,i,T);x.restore()}
  if(sleepy){const q=(T*.8)%1;txt('z',230+q*60,-180-q*90,{size:40+q*30,weight:800,color:C.white,alpha:1-q})}
  x.restore()}

/* ---------- scenes ---------- */
function sHook(T){wall(T,-.4,{});
  const k=p(T,.75,1.0);if(k>0){x.save();x.translate(CX,860);const s=L(3,1,eo(k))*(1+.04*Math.sin(T*6));x.scale(s,s);x.rotate(-.05);
    x.fillStyle='rgba(8,6,20,.82)';rr(-250,-150,500,300,60);x.fill();x.strokeStyle=C.orange;x.lineWidth=6;x.shadowColor=C.orange;x.shadowBlur=40;x.stroke();x.shadowBlur=0;
    txt('30',0,-10,{size:210,weight:900,font:'Unb',color:C.white,glow:30});txt('VIDEO',0,105,{size:44,weight:700,font:'Spc',color:C.orange,ls:14});x.restore()}}
function sEditor(T){const lt=T-2.2;
  omino(CX,560,1.05,mood(T),'work',T,true);
  // hour counter 0->8h
  const h=8*ex(p(T,2.5,3.6));const hh=Math.floor(h),mm=Math.floor((h%1)*60);
  x.save();x.translate(CX,1110+Math.sin(T*2.4)*6);x.fillStyle='rgba(20,10,24,.85)';rr(-300,-80,600,160,40);x.fill();x.strokeStyle=C.red;x.lineWidth=4;x.shadowColor=C.red;x.shadowBlur=24;x.stroke();x.shadowBlur=0;
  txt(`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${String(Math.floor(T*97)%60).padStart(2,'0')}`,40,4,{size:84,weight:900,font:'Unb',color:'#fff'});
  x.save();x.translate(-220,0);x.strokeStyle=C.red;x.lineWidth=7;x.lineCap='round';x.beginPath();x.arc(0,0,40,0,7);x.stroke();x.rotate(T*12);x.beginPath();x.moveTo(0,0);x.lineTo(0,-28);x.stroke();x.restore();x.restore();
  txt('stima di settore: 8–20 ore per 30 s di motion',CX,1225,{size:28,weight:500,font:'Spc',color:C.muted,alpha:p(T,3.0,3.3)});
  // floating Pr/Ae chips

  if(!VIG){VIG=x.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.78);VIG.addColorStop(0,'rgba(0,0,0,0)');VIG.addColorStop(1,'rgba(0,0,0,.6)')}x.fillStyle=VIG;x.fillRect(0,0,W,H);
  if(!NP)NP=x.createPattern(noise,'repeat');x.save();x.globalAlpha=.04;x.globalCompositeOperation='overlay';x.translate(Math.random()*256,Math.random()*256);x.fillStyle=NP;x.fillRect(-256,-256,W+512,H+512);x.restore()}

/* ---------- audio ---------- */
let AC=null,MG=null;
function initAudio(){if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.55;const c=AC.createDynamicsCompressor();MG.connect(c);c.connect(AC.destination)}
function nb(d){const b=AC.createBuffer(1,Math.ceil(AC.sampleRate*d),AC.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=b;return s}
function env(g,t,a,d,v){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
function sfx(type,at,arg){if(!AC)return;const t=at??AC.currentTime,g=AC.createGain();g.connect(MG);
  const osc=(tp,f0,f1,d,st=0)=>{const o=AC.createOscillator();o.type=tp;o.frequency.setValueAtTime(f0,t+st);o.frequency.exponentialRampToValueAtTime(f1,t+st+d);o.connect(g);o.start(t+st);o.stop(t+st+d+.05);return o};
  const nf=(d,ft,f0,f1,q=1)=>{const s=nb(d),f=AC.createBiquadFilter();f.type=ft;f.Q.value=q;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+d);s.connect(f);f.connect(g);s.start(t);s.stop(t+d)};
  switch(type){
    case'key':env(g,t,.001,.04,.22);nf(.05,'bandpass',3500,2500,3);break;
    case'land':env(g,t,.001,.08,.18);osc('sine',arg||300,(arg||300)*.6,.08);break;
    case'swoosh':env(g,t,.12,.35,.28);nf(.5,'bandpass',250,2200,1.2);break;
    case'tick':env(g,t,.001,.03,.2);osc('square',2200,2100,.03);break;
    case'pop':env(g,t,.001,.15,.4);osc('sine',arg||500,(arg||500)*2.4,.1);break;
    case'boom':env(g,t,.005,1,.9);osc('sine',120,30,1);break;
    case'stamp':env(g,t,.002,.5,1);osc('sine',140,38,.5);nf(.25,'lowpass',3000,200);break;
    case'scratch':env(g,t,.005,.45,.5);nf(.45,'bandpass',3000,300,4);osc('sawtooth',600,90,.4);break;
    case'rocket':env(g,t,.05,.7,.45);nf(.75,'bandpass',300,3000,1);break;
    case'snap':env(g,t,.001,.06,.7);nf(.06,'highpass',2000,4000);break;
    case'boing':env(g,t,.005,.5,.35);{const o=osc('sine',180,520,.45);}break;
    case'chime':env(g,t,.005,1.2,.3);[1046,1318,1568,2093].forEach((f,i)=>osc('sine',f,f,1.1,i*.06));break;
    case'ding':env(g,t,.005,.7,.3);osc('sine',1568,1568,.7);osc('sine',2349,2349,.6);break;
    case'riser':g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+arg-.05);g.gain.exponentialRampToValueAtTime(.0001,t+arg);osc('sawtooth',110,1500,arg);nf(arg,'bandpass',300,6000,2);break;
    case'kick':env(g,t,.002,.22,.6);osc('sine',140,45,.22);break;
    case'hat':env(g,t,.001,.04,.08);nf(.05,'highpass',8000,9000);break;
    case'snore':env(g,t,.2,.6,.18);osc('sawtooth',90,70,.8);break;
    case'pad':{g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.1,t+1);g.gain.setValueAtTime(.1,t+arg-.8);g.gain.exponentialRampToValueAtTime(.0001,t+arg);[55,65.4,82.4].forEach(f=>osc('sine',f,f,arg));break}
  }}
const CUES=[[0,'pad',8.6],[.75,'stamp'],[.78,'boom'],[2.2,'swoosh'],[4.2,'swoosh'],[5.6,'stamp'],[6.6,'swoosh'],[6.9,'snore'],[7.9,'snore'],[8.6,'scratch'],[9.4,'boom'],[9.4,'rocket'],[9.8,'boing'],[10.2,'snap'],[11.0,'chime'],
  [12,'swoosh'],[13.55,'pop',700],[14,'swoosh'],[16,'swoosh'],[17.3,'pop',600],[17.5,'swoosh'],[18,'swoosh'],[19.4,'chime'],[21,'swoosh'],[22.7,'pop',700],[22.75,'chime'],[23.3,'ding'],[17.7,'riser',.3]];
WALL.forEach((w,i)=>CUES.push([w.d+.3,'land',260+(i%6)*40]));
for(let tt=2.5;tt<3.6;tt+=.07)CUES.push([tt,'tick']);for(let tt=4.4;tt<5.6;tt+=.05)CUES.push([tt,'tick']);
for(let i=0;i<30;i++)CUES.push([10.5+i*.025,'tick']);
for(let tt=12.3;tt<13.5;tt+=.04)CUES.push([tt,'key']);for(let i=0;i<6;i++)CUES.push([21.9+i*.1,'key']);
for(let i=0;i<3;i++)CUES.push([16.2+i*.25,'pop',500+i*150]);
for(let tt=9.4;tt<21;tt+=.5){CUES.push([tt,'kick']);CUES.push([tt+.25,'hat'])}for(let tt=21;tt<25;tt+=1)CUES.push([tt,'kick']);
function fire(a,b){for(const e of CUES)if(e[0]>=a&&e[0]<b)sfx(e[1],undefined,e[2])}

/* ---------- loop ---------- */
let t=0,playing=false,last=performance.now();
const pb=document.getElementById('play'),sc=document.getElementById('scrub'),tm=document.getElementById('tm');
pb.onclick=()=>{initAudio();if(AC.state==='suspended')AC.resume();playing=!playing;pb.textContent=playing?'❚❚':'▶'};
sc.oninput=()=>{t=+sc.value};
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(playing){const pr=t;t+=dt;if(t>=DUR){fire(pr,DUR);t-=DUR;fire(0,t)}else fire(pr,t);sc.value=t}
  render(t);tm.textContent=`${t.toFixed(2)} / 25`;requestAnimationFrame(frame)}
Promise.all(['500 50px Bric','700 50px Bric','800 50px Bric','700 50px Unb','900 50px Unb','500 50px Spc','700 50px Spc'].map(f=>document.fonts.load(f))).finally(()=>requestAnimationFrame(frame));
</script>
