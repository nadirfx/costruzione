<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Instagram chiude · Claude</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#050507;--panel:#0F0F14;--line:#22222B;--txt:#EDEDF2;--mut:#8A8A99;--lime:#C6FF3D;--red:#FF2D55}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:Montserrat,system-ui,sans-serif;min-height:100vh}
  header{padding:18px 16px 4px;max-width:1200px;margin:0 auto}
  h1{font-size:20px;font-weight:900;margin:0;letter-spacing:-.01em}
  h1 span{color:var(--lime)}
  header p{margin:4px 0 0;color:var(--mut);font-size:13px}
  main{display:flex;gap:24px;padding:16px;max-width:1200px;margin:0 auto;align-items:flex-start}
  .stage{flex:0 0 auto;display:flex;flex-direction:column;gap:10px;width:min(100%,calc(78vh*9/16))}
  canvas{width:100%;aspect-ratio:9/16;border-radius:18px;background:#000;display:block;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px var(--line)}
  .ctrl{display:flex;align-items:center;gap:8px}
  button{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:10px;height:38px;min-width:38px;padding:0 12px;font:700 14px Montserrat,sans-serif;cursor:pointer}
  button.on{border-color:var(--lime);color:var(--lime)}
  input[type=range]{flex:1;accent-color:var(--lime);min-width:0}
  .time{font:500 13px 'JetBrains Mono',monospace;color:var(--mut);min-width:84px;text-align:right}
  .beats{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
  .beat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;transition:border-color .15s,transform .15s}
  .beat.cur{border-color:var(--lime);transform:translateX(4px)}
  .beat .top{display:flex;gap:10px;align-items:baseline}
  .beat .tc{font:700 12px 'JetBrains Mono',monospace;color:var(--lime);white-space:nowrap}
  .beat .id{font-weight:900;font-size:13px;letter-spacing:.08em}
  .beat .vo{font-style:italic;font-size:14px;margin:4px 0 2px}
  .beat .vis{color:var(--mut);font-size:12.5px;line-height:1.45}
  @media (max-width:820px){main{flex-direction:column;align-items:stretch}.stage{width:100%;max-width:440px;margin:0 auto}}
</style>
</head>
<body>
<header>
  <h1>INSTAGRAM CHIUDE · <span>fatto con Claude</span></h1>
  <p>9:16 · 22,4 s · premi ▶ (con audio) · clicca un beat per saltarci · barra spaziatrice = play/pausa</p>
</header>
<main>
  <div class="stage">
    <canvas id="cv" width="1080" height="1920"></canvas>
    <div class="ctrl">
      <button id="play">▶</button>
      <button id="rst">↺</button>
      <input id="scrub" type="range" min="0" max="22.4" step="0.01" value="0">
      <span class="time" id="tm">0.00 / 22.4</span>
      <button id="snd" class="on">🔊</button>
    </div>
  </div>
  <div class="beats" id="beats"></div>
</main>
<script>
const W=1080,H=1920,DUR=22.4;
const C={bg:'#06060A',red:'#FF2D55',lime:'#C6FF3D',white:'#F4F4F6',grey:'#8A8A99'};
const cv=document.getElementById('cv'),x=cv.getContext('2d');
const F='Montserrat, system-ui, sans-serif', M="'JetBrains Mono', ui-monospace, monospace";

/* ---------- helpers ---------- */
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const p=(t,a,b)=>clamp((t-a)/(b-a));
const L=(a,b,k)=>a+(b-a)*k;
const eo=k=>1-Math.pow(1-k,3);
const ei=k=>k*k*k;
const back=k=>{const c1=2.2,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};
const bounce=k=>{const n=7.5625,d=2.75;if(k<1/d)return n*k*k;if(k<2/d)return n*(k-=1.5/d)*k+.75;if(k<2.5/d)return n*(k-=2.25/d)*k+.9375;return n*(k-=2.625/d)*k+.984375};
function rng(s){return()=>(s=(s*16807)%2147483647)/2147483647}
function rr(X,Y,w,h,r){x.beginPath();x.roundRect(X,Y,w,h,r)}

function txt(s,X,Y,o={}){
  const {size=80,weight=800,color=C.white,align='center',alpha=1,rgb=0,ls=0,box=null,maxW=0,glow=0,font=F}=o;
  if(alpha<=0)return;
  x.save();x.globalAlpha*=alpha;x.textAlign=align;x.textBaseline='middle';
  let sz=size;x.font=`${weight} ${sz}px ${font}`;x.letterSpacing=ls+'px';
  if(maxW){const w=x.measureText(s).width;if(w>maxW){sz=size*maxW/w;x.font=`${weight} ${sz}px ${font}`}}
  if(box){const w=x.measureText(s).width;const lx=align==='center'?X-w/2:align==='right'?X-w:X;x.fillStyle=box;x.fillRect(lx-sz*.18,Y-sz*.6,w+sz*.36,sz*1.18)}
  if(rgb){x.globalCompositeOperation='lighter';x.fillStyle='rgba(255,0,70,.85)';x.fillText(s,X-rgb,Y);x.fillStyle='rgba(0,220,255,.85)';x.fillText(s,X+rgb,Y+rgb*.3);x.globalCompositeOperation='source-over'}
  if(glow){x.shadowColor=color;x.shadowBlur=glow}
  x.fillStyle=color;x.fillText(s,X,Y);x.restore();
}

/* ---------- icons ---------- */
function glyph(g,s,col,open=0){
  x.strokeStyle=col;x.fillStyle=col;x.lineWidth=s*.1;x.lineCap='round';x.lineJoin='round';
  switch(g){
    case 'cam':rr(-s/2,-s/2,s,s,s*.3);x.stroke();x.beginPath();x.arc(0,0,s*.22,0,7);x.stroke();x.beginPath();x.arc(s*.26,-s*.26,s*.055,0,7);x.fill();break;
    case 'lock':{rr(-s*.4,-s*.02,s*.8,s*.58,s*.12);x.fill();
      x.save();x.translate(s*.25,-s*.02);x.rotate(-.55*open);x.translate(-s*.25,-s*.2*open);
      x.beginPath();x.moveTo(-s*.25,-s*.02);x.lineTo(-s*.25,-s*.22);x.arc(0,-s*.22,s*.25,Math.PI,0);x.lineTo(s*.25,-s*.02);x.stroke();x.restore();
      x.fillStyle='#0C0C10';x.beginPath();x.arc(0,s*.24,s*.08,0,7);x.fill();break}
    case 'heart':x.beginPath();x.moveTo(0,s*.38);x.bezierCurveTo(-s*.6,-s*.05,-s*.35,-s*.55,0,-s*.2);x.bezierCurveTo(s*.35,-s*.55,s*.6,-s*.05,0,s*.38);x.fill();break;
    case 'chat':x.beginPath();x.arc(0,-s*.04,s*.4,0,7);x.stroke();x.beginPath();x.moveTo(-s*.28,s*.24);x.lineTo(-s*.4,s*.44);x.lineTo(-s*.08,s*.34);x.stroke();break;
    case 'spark':x.beginPath();for(let i=0;i<8;i++){const r=i%2?s*.13:s*.48,a=i*Math.PI/4-Math.PI/2;x.lineTo(Math.cos(a)*r,Math.sin(a)*r)}x.closePath();x.fill();break;
    case 'euro':x.font=`900 ${s*.95}px ${F}`;x.textAlign='center';x.textBaseline='middle';x.fillText('€',0,s*.04);break;
    case 'photo':rr(-s*.45,-s*.38,s*.9,s*.76,s*.12);x.stroke();x.beginPath();x.moveTo(-s*.35,s*.25);x.lineTo(-s*.08,-s*.06);x.lineTo(s*.08,s*.1);x.lineTo(s*.2,-.0);x.lineTo(s*.36,s*.25);x.fill();x.beginPath();x.arc(s*.2,-s*.18,s*.08,0,7);x.fill();break;
  }
}
function icon(X,Y,s,o={}){
  const {rot=0,g='cam',col=C.red,alpha=1,glow=0,shadow=true,open=0}=o;
  if(alpha<=0||s<=0)return;
  x.save();x.translate(X,Y);x.rotate(rot);x.globalAlpha*=alpha;
  if(shadow){x.fillStyle='rgba(0,0,0,.55)';rr(-s/2+s*.05,-s/2+s*.12,s,s,s*.25);x.fill()}
  if(glow){x.shadowColor=col;x.shadowBlur=glow}
  const gr=x.createLinearGradient(0,-s/2,0,s/2);gr.addColorStop(0,'#2C2C34');gr.addColorStop(1,'#0B0B0F');
  x.fillStyle=gr;rr(-s/2,-s/2,s,s,s*.25);x.fill();x.shadowBlur=0;
  x.strokeStyle='rgba(255,255,255,.16)';x.lineWidth=Math.max(1.5,s*.018);rr(-s/2+s*.01,-s/2+s*.01,s*.98,s*.98,s*.24);x.stroke();
  const gl=x.createLinearGradient(0,-s/2,0,0);gl.addColorStop(0,'rgba(255,255,255,.13)');gl.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=gl;rr(-s/2,-s/2,s,s/2,[s*.25,s*.25,0,0]);x.fill();
  if(glow){x.shadowColor=col;x.shadowBlur=s*.15}
  glyph(g,s*.5,col,open);
  x.restore();
}
function AI3D(X,Y,size,sc=1,col=C.lime,alpha=1,word='CLAUDE'){
  if(sc<=0||alpha<=0)return;
  x.save();x.globalAlpha*=alpha;x.translate(X,Y);x.scale(sc,sc);x.font=`900 ${size}px ${F}`;x.textAlign='center';x.textBaseline='middle';x.letterSpacing='-6px';{const w=x.measureText(word).width;if(w>980){size=size*980/w;x.font=`900 ${size}px ${F}`}}
  const d=Math.round(size*.07);
  for(let i=d;i>0;i--){x.fillStyle=i===d?'rgba(0,0,0,.7)':`rgb(${40+60*(1-i/d)|0},${58+90*(1-i/d)|0},${8+12*(1-i/d)|0})`;x.fillText(word,i*1.1,i*1.5)}
  x.shadowColor=col;x.shadowBlur=70;x.fillStyle=col;x.fillText(word,0,0);x.shadowBlur=0;
  const g=x.createLinearGradient(0,-size*.4,0,size*.4);g.addColorStop(0,'rgba(255,255,255,.45)');g.addColorStop(.5,'rgba(255,255,255,0)');x.fillStyle=g;x.fillText(word,0,0);
  x.restore();
}

/* ---------- background ---------- */
function bg(T){
  x.fillStyle=C.bg;x.fillRect(0,0,W,H);
  let col,inten;
  if(T<9){col='255,45,85';inten=.16+.3*p(T,6.8,9)+.06*Math.sin(T*9)}
  else if(T<10.9){col='255,255,255';inten=.04}
  else{col='198,255,61';inten=.13+.03*Math.sin(T*3)}
  const g=x.createRadialGradient(W/2,H*.43,40,W/2,H*.43,1150);g.addColorStop(0,`rgba(${col},${inten})`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
  const s=90,off=(T*24)%s;x.strokeStyle='rgba(255,255,255,.04)';x.lineWidth=2;x.beginPath();
  for(let gx=-s+off;gx<W+s;gx+=s){x.moveTo(gx,0);x.lineTo(gx,H)}for(let gy=-s+off;gy<H+s;gy+=s){x.moveTo(0,gy);x.lineTo(W,gy)}x.stroke();
  x.strokeStyle='rgba(255,255,255,.07)';x.beginPath();x.moveTo(-100,H*.33+T*6);x.lineTo(W+100,H*.15+T*6);x.moveTo(W*.18,H+50);x.lineTo(W*.78,-50);x.stroke();
}

/* ---------- precomputed randomness ---------- */
const R=rng(42);
const SHARDS=(()=>{const cw=600,ch=760,nx=4,ny=5,pts=[];for(let j=0;j<=ny;j++){pts[j]=[];for(let i=0;i<=nx;i++){const e=i===0||i===nx||j===0||j===ny;pts[j][i]=[-cw/2+i*cw/nx+(e?0:(R()-.5)*90),-ch/2+j*ch/ny+(e?0:(R()-.5)*90)]}}
  const out=[];for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){const a=pts[j][i],b=pts[j][i+1],c=pts[j+1][i+1],d=pts[j+1][i];for(const tri of[[a,b,c],[a,c,d]]){const cx=(tri[0][0]+tri[1][0]+tri[2][0])/3,cy=(tri[0][1]+tri[1][1]+tri[2][1])/3;const len=Math.hypot(cx,cy)||1;out.push({tri,cx,cy,vx:cx/len*(.5+R()),vy:cy/len*(.5+R())-.6,rs:(R()-.5)*8})}}return out})();
const CONF=Array.from({length:140},()=>({a:R()*Math.PI*2,v:500+R()*1100,s:10+R()*18,r:R()*6,rs:(R()-.5)*14,c:[C.lime,C.white,'#3A3A44'][R()*3|0]}));
const SPARKS=Array.from({length:170},()=>({a:R()*Math.PI*2,v:300+R()*900,s:2+R()*5,c:R()<.7?C.lime:C.white}));
const FILES=Array.from({length:26},()=>({x:R()*W,y:R()*H,o:R(),s:.6+R()*.6}));

/* ---------- scenes ---------- */
function notif(Y){
  x.save();x.translate(540,Y);x.scale(1.1,1.1);
  x.shadowColor='rgba(0,0,0,.6)';x.shadowBlur=40;x.fillStyle='rgba(30,30,36,.96)';rr(-470,-115,940,230,46);x.fill();x.shadowBlur=0;
  x.strokeStyle='rgba(255,255,255,.1)';x.lineWidth=2;x.stroke();
  icon(-375,0,120,{g:'cam',col:C.red,shadow:false});
  txt('INSTAGRAM',-292,-56,{size:28,weight:700,color:C.grey,align:'left',ls:3});
  txt('adesso',430,-56,{size:26,weight:500,color:C.grey,align:'right'});
  txt('⚠ Il tuo account verrà eliminato',-292,2,{size:40,weight:800,align:'left',maxW:700});
  txt('Tocca per saperne di più',-292,54,{size:28,weight:500,color:C.grey,align:'left'});
  x.restore();
}
function s1(T){
  for(let i=0;i<3;i++){const q=(T*1.2+i/3)%1;x.strokeStyle=`rgba(255,45,85,${(1-q)*.55})`;x.lineWidth=6;x.beginPath();x.arc(540,900,170+q*420,0,7);x.stroke()}
  icon(540,900,320*back(p(T,0,.3)),{g:'cam',col:C.red,glow:50+30*Math.sin(T*24)});
  const k=p(T,.05,.4);notif(L(-280,330,back(k)));
}
function s2(T){
  // tape
  const tk=eo(p(T,2.85,3.05));
  icon(540,1060,290*back(p(T,1.5,1.75)),{g:'cam',col:C.red,glow:40});
  const lk=p(T,2.42,2.7);
  if(lk>0)icon(665,1185,150,{g:'lock',col:C.red,glow:30,rot:.12*(1-lk)});
  if(lk>0&&lk<1){} // drop handled below
  x.save();x.font=`900 300px ${F}`;x.letterSpacing='-6px';
  const s='01.01';const tw=x.measureText(s).width;let cx=540-tw/2;
  for(let i=0;i<s.length;i++){const ch=s[i],w=x.measureText(ch).width,ti=1.45+i*.07,k=p(T,ti,ti+.14);
    if(k>0){x.save();x.translate(cx+w/2,560);const sc=L(3.4,1,eo(k));x.scale(sc,sc);
      txt(ch,0,0,{size:300,weight:900,color:C.red,alpha:k,rgb:L(46,5,k)+(T>2.5?Math.random()*6:0),glow:30,ls:-6});x.restore()}
    cx+=w}
  x.restore();
  if(tk>0){x.save();x.translate(540,1060);x.rotate(-.2);x.scale(tk,1);x.fillStyle=C.red;x.shadowColor=C.red;x.shadowBlur=40;x.fillRect(-900,-50,1800,100);x.shadowBlur=0;
    x.fillStyle='#0A0A0D';x.font=`900 50px ${F}`;x.textBaseline='middle';x.letterSpacing='4px';const off=(T*320)%420;for(let k=-3;k<6;k++)x.fillText('CHIUSO  ✕',-900+k*420+off,3);x.restore()}
}
function card(type){
  x.shadowColor='rgba(0,0,0,.6)';x.shadowBlur=50;
  if(type==='photo'){x.fillStyle='#ECECEF';rr(-300,-380,600,760,26);x.fill();x.shadowBlur=0;
    const g=x.createLinearGradient(0,-330,0,190);g.addColorStop(0,'#3A3A46');g.addColorStop(1,'#121218');x.fillStyle=g;x.fillRect(-255,-335,510,520);
    x.fillStyle='#E8E8EC';x.beginPath();x.arc(120,-200,52,0,7);x.fill();
    txt('Claude',120,-200,{size:22,weight:900,color:'#5E7F14'}); // easter egg
    x.fillStyle='#55555F';x.beginPath();x.moveTo(-255,185);x.lineTo(-90,-60);x.lineTo(20,60);x.lineTo(110,-10);x.lineTo(255,185);x.fill();
    x.fillStyle='#2A2A31';x.beginPath();x.moveTo(-255,185);x.lineTo(-40,40);x.lineTo(90,120);x.lineTo(255,60);x.lineTo(255,185);x.fill();
    txt('estate 2023 ♥',0,280,{size:40,weight:700,color:'#33333B'});return}
  x.fillStyle='#16161C';rr(-300,-380,600,760,34);x.fill();x.shadowBlur=0;x.strokeStyle='rgba(255,255,255,.12)';x.lineWidth=2;x.stroke();
  if(type==='profile'){
    const g=x.createLinearGradient(-90,-300,90,-120);g.addColorStop(0,'#FF2D55');g.addColorStop(1,'#FF9F2D');x.strokeStyle=g;x.lineWidth=10;x.beginPath();x.arc(0,-215,88,0,7);x.stroke();
    x.fillStyle='#3A3A44';x.beginPath();x.arc(0,-215,72,0,7);x.fill();
    txt('@tu',0,-90,{size:44,weight:800});
    [['248','post'],['12,4k','follower'],['890','seguiti']].forEach((v,i)=>{txt(v[0],-190+i*190,-20,{size:38,weight:800});txt(v[1],-190+i*190,20,{size:24,weight:500,color:C.grey})});
    for(let i=0;i<6;i++){x.fillStyle=['#2A2A33','#33333D','#24242C'][i%3];x.fillRect(-255+(i%3)*172,70+(i/3|0)*150,166,144)}
  }else{
    for(let i=2;i>=0;i--){x.save();x.rotate((i-1)*.14);x.translate((i-1)*40,-30+i*10);x.fillStyle='#E4E4E8';rr(-170,-200,340,400,16);x.fill();x.fillStyle=['#3B3B47','#2C2C35','#45454F'][i];x.fillRect(-145,-175,290,280);x.restore()}
    txt('Ricordi · 2.418 foto',0,300,{size:34,weight:700,color:C.grey});
  }
}
function s3(T){
  const types=['profile','photo','mem'];
  for(let i=0;i<3;i++){const a=3.6+i*.7;if(T<a)continue;const k=eo(p(T,a,a+.3)),out=i<2?eo(p(T,a+.62,a+.85)):0;if(out>=1)continue;
    if(i===2&&T>=5.7)continue;
    x.save();x.translate(540+out*(i?1:-1)*760,860-out*260);const sc=L(.04,1,k)*L(1,.5,out);x.scale(sc,sc);x.rotate(L((i%2?-1:1)*.9,(i-1)*.05,k)+out*(i?1:-1)*.6);x.globalAlpha=1-out;card(types[i]);x.restore()}
  if(T>=5.7){const k=p(T,5.7,6.8);
    for(const sh of SHARDS){const px=540+sh.cx+sh.vx*eo(k)*900,py=860+sh.cy+sh.vy*eo(k)*800+1100*k*k;
      x.save();x.globalAlpha=1-k*k;x.translate(px,py);x.rotate(sh.rs*k);x.translate(-sh.cx,-sh.cy);
      x.beginPath();x.moveTo(...sh.tri[0]);x.lineTo(...sh.tri[1]);x.lineTo(...sh.tri[2]);x.closePath();x.save();x.clip();card('mem');x.restore();
      x.strokeStyle=C.red;x.lineWidth=3;x.shadowColor=C.red;x.shadowBlur=14;x.stroke();x.restore()}
  }
}
function s4(T){
  const k=p(T,6.8,8.9),e=Math.pow(k,2.3),pc=Math.min(99,Math.floor(e*99));
  for(const f of FILES){const q=(f.o+(T-6.8)*1.1)%1;const fx=L(f.x,540,ei(q)),fy=L(f.y,1060,ei(q));x.globalAlpha=(1-q)*.8;x.fillStyle='#2A2A33';rr(fx-24*f.s,fy-30*f.s,48*f.s,60*f.s,8);x.fill();x.strokeStyle=C.red;x.lineWidth=2;x.stroke();x.globalAlpha=1}
  txt('ELIMINAZIONE ACCOUNT',540,640,{size:38,weight:700,color:C.red,ls:8,font:M,alpha:.6+.4*Math.sin(T*18)});
  const num=pc+'%',rgb=4+26*e;
  txt(num,540,850,{size:280,weight:900,rgb,glow:20+40*e});
  if(e>.25)for(let i=0;i<3;i++){const y=700+Math.random()*300,h=20+Math.random()*40,dx=(Math.random()-.5)*80*e;x.save();x.beginPath();x.rect(0,y,W,h);x.clip();x.fillStyle=C.bg;x.fillRect(0,y,W,h);txt(num,540+dx,850,{size:280,weight:900,color:i%2?C.red:C.white});x.restore()}
  x.fillStyle='#1C1C22';rr(160,1040,760,30,15);x.fill();
  x.shadowColor=C.red;x.shadowBlur=30;x.fillStyle=C.red;rr(160,1040,Math.max(30,760*e),30,15);x.fill();x.shadowBlur=0;
  txt(`file eliminati: ${Math.floor(e*12408).toLocaleString('it-IT')} / 12.408`,540,1120,{size:30,weight:500,color:C.grey,font:M});
  txt('⏳ 30 GIORNI RIMASTI',540,1190,{size:34,weight:700,color:C.white,font:M,alpha:Math.sin(T*10)>0?1:.35});
}

    if(z>1.05){x.save();x.globalAlpha=Math.min(.6,(z-1));x.strokeStyle=C.white;x.lineWidth=3;for(let i=0;i<40;i++){const an=i/40*Math.PI*2+T,r0=300+Math.random()*200;x.beginPath();x.moveTo(540+Math.cos(an)*r0,864+Math.sin(an)*r0);x.lineTo(540+Math.cos(an)*(r0+600),864+Math.sin(an)*(r0+600));x.stroke()}x.restore()}
  }
  captions(T);post(T);
}

/* ---------- audio ---------- */
let AC=null,MG=null,soundOn=true;
function initAudio(){if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.55;const comp=AC.createDynamicsCompressor();MG.connect(comp);comp.connect(AC.destination)}
function nb(d){const b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=b;return s}
function env(g,t,a,d,v){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
function sfx(type,at){
  if(!AC||!soundOn)return;const t=at??AC.currentTime,g=AC.createGain();g.connect(MG);
  const osc=(tp,f0,f1,d)=>{const o=AC.createOscillator();o.type=tp;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);o.connect(g);o.start(t);o.stop(t+d+.05);return o};
  const noiseF=(d,ftype,f0,f1,q=1)=>{const s=nb(d),f=AC.createBiquadFilter();f.type=ftype;f.Q.value=q;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+d);s.connect(f);f.connect(g);s.start(t);s.stop(t+d)};
  switch(type){
    case'boom':env(g,t,.005,.7,1);osc('sine',140,32,.7);break;
    case'kick':env(g,t,.002,.25,.8);osc('sine',150,45,.25);break;
    case'hat':env(g,t,.001,.05,.12);noiseF(.06,'highpass',7000,9000);break;
    case'slam':env(g,t,.002,.3,.8);osc('square',90,40,.3);noiseF(.15,'lowpass',3000,300);break;
    case'buzz':env(g,t,.01,.5,.35);{const o=osc('sawtooth',62,58,.5);}break;
    case'clack':env(g,t,.001,.18,.6);noiseF(.18,'bandpass',2500,1200,6);osc('square',300,120,.1);break;
    case'whoosh':env(g,t,.12,.3,.45);noiseF(.45,'bandpass',300,4000,1.5);break;
    case'shatter':env(g,t,.001,.6,.6);noiseF(.6,'highpass',1500,6000);osc('triangle',2400,800,.3);break;
    case'tick':env(g,t,.001,.03,.35);osc('square',2200,2000,.03);break;
    case'stop':env(g,t,.001,.4,.5);osc('sawtooth',400,30,.4);break;
    case'rewind':env(g,t,.02,.65,.35);{const o=osc('sawtooth',900,120,.7);const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=18;lg.gain.value=200;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+.7)}break;
    case'pop':env(g,t,.001,.15,.6);osc('sine',500,1400,.1);break;
    case'ding':env(g,t,.005,.9,.35);osc('sine',1318,1318,.9);osc('sine',1975,1975,.9);break;
    case'riser':g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+1.1);g.gain.exponentialRampToValueAtTime(.0001,t+1.25);osc('sawtooth',120,1400,1.25);noiseF(1.25,'bandpass',400,6000,2);break;
  }
}
const CUES=[[0,'boom'],[0,'slam'],[.08,'slam'],[.16,'slam'],[.24,'slam'],[.32,'slam'],[1.0,'clack'],[1.25,'whoosh'],[2.0,'boom'],[2.35,'buzz'],[3.6,'whoosh'],[4.3,'whoosh'],[5.0,'whoosh'],[5.7,'shatter'],[9.0,'stop'],[10.2,'rewind'],[11.0,'pop'],[11.05,'ding'],[12.4,'riser'],[14.5,'boom'],[16.2,'whoosh'],[17.62,'shatter'],[19.0,'whoosh'],[20.4,'slam'],[20.9,'slam'],[21.4,'boom'],[22.2,'riser'],[23.5,'boom'],[24.1,'tick'],[24.3,'tick'],[24.55,'pop']];
{let tt=6.8;while(tt<9){CUES.push([tt,'tick']);tt+=L(.4,.06,p(tt,6.8,9))}}
for(let tt=14.5;tt<22.2;tt+=.5){if(tt<20.3||tt>21.5)CUES.push([tt,'kick']);CUES.push([tt+.25,'hat'])}
for(let tt=23.5;tt<26;tt+=.5){CUES.push([tt,'kick']);CUES.push([tt+.25,'hat'])}
function fire(a,b){const A=remap(a),B=remap(b);for(const[c,ty]of CUES)if(c>=A&&c<B)sfx(ty)}

/* ---------- beat sheet ---------- */
const SC=[
 [0,2.0,'HOOK · LA NOTIZIA','Dal primo gennaio Instagram chiude in Italia.','"01.01" schiantato cifra per cifra dal primo frame, aberrazione RGB. Il lucchetto cade sull\'icona, nastro rosso "CHIUSO ✕" attraversa lo schermo.'],

const BE=document.getElementById('beats');
SC.forEach(([a,b,id,vo,vis],i)=>{const d=document.createElement('div');d.className='beat';d.innerHTML=`<div class="top"><span class="tc">${inv(a).toFixed(1)}–${inv(b).toFixed(1)}s</span><span class="id">${id}</span></div><div class="vo">“${vo}”</div><div class="vis">${vis}</div>`;d.onclick=()=>{t=inv(a)+.001;sc.value=t};BE.appendChild(d)});

/* ---------- loop / ui ---------- */
let t=0,playing=false,last=performance.now();
const pb=document.getElementById('play'),sc=document.getElementById('scrub'),tm=document.getElementById('tm'),sb=document.getElementById('snd');
function toggle(){initAudio();if(AC.state==='suspended')AC.resume();playing=!playing;pb.textContent=playing?'❚❚':'▶'}
pb.onclick=toggle;
document.getElementById('rst').onclick=()=>{t=0};
sb.onclick=()=>{soundOn=!soundOn;sb.classList.toggle('on',soundOn);sb.textContent=soundOn?'🔊':'🔇'};
sc.oninput=()=>{t=+sc.value};
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();toggle()}});
let lastBeat=-1;
function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(playing){const prev=t;t+=dt;if(t>=DUR){fire(prev,DUR);t-=DUR;fire(0,t)}else fire(prev,t)}
  render(t);
  if(playing)sc.value=t;tm.textContent=`${t.toFixed(2)} / 22.4`;
  const ot=remap(t),bi=SC.findIndex(s=>ot>=s[0]&&ot<s[1]);if(bi!==lastBeat){[...BE.children].forEach((c,i)=>c.classList.toggle('cur',i===bi));lastBeat=bi}
  requestAnimationFrame(frame);
}
const qs=new URLSearchParams(location.search);if(qs.has('t'))t=+qs.get('t');
(document.fonts?document.fonts.load(`900 100px Montserrat`):Promise.resolve()).finally(()=>requestAnimationFrame(frame));
